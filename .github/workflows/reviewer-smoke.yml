name: reviewer-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dashboard-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: db_weibo_basin
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install review dependencies
        run: pip install -r requirements-review.txt
      - name: Load schema and synthetic data
        run: |
          mysql -h127.0.0.1 -uroot -proot db_weibo_basin < sql/schema.sql
          mysql -h127.0.0.1 -uroot -proot db_weibo_basin < sql/demo_seed.sql
      - name: Start application
        env:
          SECRET_KEY: reviewer-ci-secret
          HOST: 127.0.0.1
          PORT: 5011
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: db_weibo_basin
        run: |
          nohup python app.py > /tmp/basinscope.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5011/healthz >/dev/null; then break; fi
            sleep 2
          done
      - name: Check readiness and dashboard
        shell: bash
        run: |
          health_code=$(curl -sS -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:5011/healthz)
          echo "healthz HTTP $health_code: $(cat /tmp/health.json)"
          if [ "$health_code" != "200" ]; then
            echo "::error title=healthz HTTP $health_code::$(cat /tmp/health.json)"
            exit 1
          fi

          ready_code=$(curl -sS -o /tmp/ready.json -w "%{http_code}" http://127.0.0.1:5011/readyz)
          echo "readyz HTTP $ready_code: $(cat /tmp/ready.json)"
          if [ "$ready_code" != "200" ]; then
            db_snapshot=$(mysql -h127.0.0.1 -uroot -proot -N -e "USE db_weibo_basin; SHOW TABLES; SELECT COUNT(*) FROM t_basin_article; SELECT COUNT(*) FROM t_basin_comment;" | tr '\n' ',')
            echo "::error title=readyz HTTP $ready_code::$(cat /tmp/ready.json) db=$db_snapshot"
            exit 1
          fi

          dashboard_code=$(curl -sS --max-time 600 -o /tmp/dashboard.html -w "%{http_code}" http://127.0.0.1:5011/page/dashboard)
          dashboard_bytes=$(wc -c < /tmp/dashboard.html)
          echo "dashboard HTTP $dashboard_code, bytes=$dashboard_bytes"
          if [ "$dashboard_code" != "200" ]; then
            echo "::error title=dashboard HTTP $dashboard_code::$(head -c 1200 /tmp/dashboard.html | tr '\n' ' ')"
            exit 1
          fi
          test "$dashboard_bytes" -gt 50000
          grep -q "黄河流域" /tmp/dashboard.html
      - name: Show application log on failure
        if: failure()
        run: tail -200 /tmp/basinscope.log || true

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build and start the reviewer stack
        run: docker compose up -d --build
      - name: Wait for readiness
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5001/readyz >/tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ready.json 2>/dev/null || true
          exit 1
      - name: Check dashboard
        shell: bash
        run: |
          curl -fsS http://127.0.0.1:5001/healthz
          curl -fsS --max-time 600 http://127.0.0.1:5001/page/dashboard -o /tmp/dashboard.html
          test "$(wc -c < /tmp/dashboard.html)" -gt 50000
          grep -q "黄河流域" /tmp/dashboard.html
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v
