<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BasinScope · 黄河流域舆情分析（真实数据）</title>
<style>
:root{
  --bg:#f7f2e8; --bg2:#f0e9dc; --panel:#fffdf8; --panel2:#faf5ec; --line:rgba(120,95,60,.18);
  --fg:#2b2118; --fg2:#5c4b3a; --fg3:#85735d;
  --cyan:#3f8f63; --blue:#4a7fa8; --teal:#2f8f86; --amber:#c9860a; --red:#b4544f;
  --purple:#8a5fa8; --pink:#c2568f; --lime:#6f9e3a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:
  radial-gradient(1200px 600px at 12% -8%, rgba(63,143,99,.16), transparent 60%),
  radial-gradient(900px 520px at 96% 4%, rgba(47,143,134,.12), transparent 58%),
  var(--bg);
  color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
.wrap{display:flex;min-height:100vh}

/* ---------- 顶栏 ---------- */
.top{position:fixed;left:0;right:0;top:0;height:58px;z-index:40;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:rgba(255,253,248,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;flex:0 0 34px;position:relative}
.logo svg{display:block;overflow:visible}
.logo .orbit{transform-origin:17px 17px;animation:spin 6s linear infinite}
.logo .orbit2{transform-origin:17px 17px;animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.logo .pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.brand{font-size:16px;font-weight:700;letter-spacing:2px;white-space:nowrap}
.brand small{font-weight:400;color:var(--fg3);letter-spacing:1px;margin-left:8px;font-size:12px}
.top .sp{flex:1}
.chip{font-size:12px;color:var(--fg2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip b{color:var(--cyan)}
.hint{font-size:12px;color:var(--fg3);white-space:nowrap}

/* ---------- 侧栏 ---------- */
.side{position:fixed;left:0;top:58px;bottom:0;width:216px;overflow-y:auto;padding:14px 12px 40px;
  border-right:1px solid var(--line);background:rgba(255,253,248,.6)}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:rgba(120,95,60,.22);border-radius:3px}
/* ---------- 黄河流域专题入口 ---------- */
.secs{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.secs b{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:10px;
  font-size:13px;font-weight:600;color:var(--fg2);border:1px solid var(--line);cursor:pointer;
  background:rgba(63,143,99,.05);transition:background .18s,color .18s,border-color .18s;user-select:none}
.secs b:hover{color:var(--fg);background:rgba(63,143,99,.12)}
.secs b.on{color:#2b2118;background:linear-gradient(90deg,rgba(63,143,99,.30),rgba(47,143,134,.16));
  border-color:rgba(63,143,99,.5)}
.secs b .n{font-size:10px;font-weight:400;color:var(--fg3);margin-left:6px}
.secs b.on .n{color:var(--cyan)}
.grp{font-size:11px;color:var(--fg3);letter-spacing:1px;margin:14px 0 6px;padding-left:8px}
.grp:first-child{margin-top:0}
.it{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--fg2);
  font-size:13px;border:1px solid transparent;white-space:nowrap}
.it:hover{background:rgba(63,143,99,.09);color:var(--fg)}
.it.on{background:linear-gradient(90deg,rgba(63,143,99,.22),rgba(47,143,134,.10));color:#2b2118;
  border-color:rgba(63,143,99,.4)}
.it .d{width:5px;height:5px;border-radius:50%;background:var(--fg3);flex:0 0 5px}
.it.on .d{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.bd{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--fg3)}
.bd.real{color:var(--cyan);border-color:rgba(61,220,151,.45)}
.bd.new{color:var(--amber);border-color:rgba(255,180,77,.45)}
.bd.plan{color:var(--purple);border-color:rgba(169,123,255,.45)}

/* ---------- 主区 ---------- */
.main{margin:58px 0 0 216px;padding:22px 26px 70px;flex:1;min-width:0}
.vtitle{font-size:20px;font-weight:700;margin:0 0 4px}
.lead{color:var(--fg2);font-size:13px;margin:0 0 16px;max-width:1180px}
.lead b{color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--fg3)}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--fg3);margin-top:2px}
.kpi.c1 .v{color:var(--blue)} .kpi.c2 .v{color:var(--cyan)} .kpi.c3 .v{color:var(--amber)}
.kpi.c4 .v{color:var(--purple)} .kpi.c5 .v{color:var(--pink)} .kpi.c6 .v{color:var(--teal)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:12px 14px 6px;min-width:0}
.card.w2{grid-column:span 2} .card.w3{grid-column:span 3}
.card h3{margin:0 0 2px;font-size:14px;font-weight:600}
.card .sub{font-size:11.5px;color:var(--fg3);margin-bottom:6px}
.ch{width:100%;height:260px}
.ch.tall{height:330px} .ch.short{height:190px} .ch.xtall{height:400px}
.chartbox{width:100%}

table{width:100%;border-collapse:collapse;font-size:12.5px}
/* 表格对齐规范（全站统一，56 张表共用 renderTable）：
   ① 文本列一律左对齐；② 数值列（cols 里标 num:true）的**表头与单元格都右对齐**，
   配等宽数字避免逐行跳动；③ nw 只给短列（不换行），长文本列允许折行。 */
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--fg3);font-weight:500;font-size:11.5px;position:sticky;top:0;background:var(--panel)}
td.nw,th.nw{white-space:nowrap}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:rgba(63,143,99,.06)}
.tblwrap{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tblwrap::-webkit-scrollbar{width:7px;height:7px}
.tblwrap::-webkit-scrollbar-thumb{background:rgba(120,95,60,.22);border-radius:4px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}

ul.ev{list-style:none;margin:0;padding:0}
ul.ev li{padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:rgba(255,255,255,.015)}
ul.ev .m{font-size:11px;color:var(--fg3);display:flex;gap:8px;flex-wrap:wrap}
ul.ev .t{font-size:12.5px;color:var(--fg);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---- 排行榜逐条解释（2026-10-06 新增）----
   只在 LIST() 传了 explain 时渲染；不传则完全走原逻辑，
   仓库内另外 4 处 list 卡不受影响。 */
ul.ev.ex{counter-reset:exi}
ul.ev.ex li.ex-on{border-color:rgba(120,95,60,.30)}
/* 有解释时正文放开 2 行截断：解释区已经占空间，正文再截断会读不全 */
ul.ev.ex li.ex-on .t{-webkit-line-clamp:6}
.exbox{margin-top:7px;padding:9px 11px;border-radius:9px;background:rgba(120,95,60,.055);
 border:1px solid rgba(120,95,60,.16);border-left:2.5px solid var(--cyan)}
.exbox>div{display:flex;gap:9px;align-items:flex-start}
.exbox>div+div{margin-top:5px}
.exbox i{flex:none;width:52px;font-style:normal;font-size:10.5px;font-weight:700;
 color:var(--fg3);padding-top:2px;text-align:right;letter-spacing:.02em}
.exbox p{margin:0;font-size:12.3px;color:var(--fg2);line-height:1.74;flex:1;
 overflow-wrap:anywhere}
.exbox p b{color:var(--fg);font-weight:700}
.exbox .exread{color:var(--fg3)} .exbox .exread p{color:var(--fg3)}
.exbox>div:nth-child(2) i{color:var(--cyan)}
.exbox .exread i{color:var(--amber)}
/* ---- 诊断图（figs） ---- */
.figsbox{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px;
 padding-top:10px;border-top:1px solid var(--line)}
.figsbox.one{grid-template-columns:1fr}
.figblk{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
 padding:8px 9px 9px;min-width:0}
.figt{font-size:11.5px;font-weight:700;color:var(--fg2);line-height:1.45}
.figsub{display:block;font-size:10.5px;font-weight:400;color:var(--fg3);
 line-height:1.55;margin-top:1px}
.figslot{width:100%;height:170px;margin-top:5px}
.figrows{width:100%;height:190px;margin-top:5px}
.figlg{display:flex;gap:10px;flex-wrap:wrap;font-size:10.8px;color:var(--fg3);
 margin-top:5px}
.figlg .fl{display:inline-flex;align-items:center;gap:4px}
.figlg .fl i{width:8px;height:8px;border-radius:2px;flex:none}
.fignote{font-size:10.8px;color:var(--fg3);line-height:1.65;margin-top:5px}
.fignote b{color:var(--fg2)}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--fg2)}
.tag.g{color:var(--cyan);border-color:rgba(61,220,151,.4)} .tag.a{color:var(--amber);border-color:rgba(255,180,77,.4)}
.tag.r{color:var(--red);border-color:rgba(255,107,107,.4)} .tag.b{color:var(--blue);border-color:rgba(63,143,99,.4)}
.tag.p{color:var(--purple);border-color:rgba(169,123,255,.4)}

.notes{margin-top:14px}
.note{border-left:3px solid var(--blue);background:rgba(63,143,99,.07);padding:9px 12px;border-radius:0 10px 10px 0;
  font-size:12.5px;color:var(--fg2);margin-bottom:8px}
.note.warn{border-color:var(--amber);background:rgba(255,180,77,.08)}
.note.bad{border-color:var(--red);background:rgba(255,107,107,.08)}
.note.ok{border-color:var(--cyan);background:rgba(61,220,151,.07)}
.note b{color:var(--fg)}
.hidden{display:none}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--fg3);font-size:12px}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0}
.bar .lb{width:96px;color:var(--fg3);font-size:12px}
.bar .tr{flex:1;height:8px;background:rgba(120,95,60,.13);border-radius:5px;overflow:hidden}
.bar .fl{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--teal))}   /* 实际颜色由 renderKV 按行取本图色带（barRamp）覆盖 */
.bar .nv{width:72px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
/* v5：可选第三段「补充值」（如占比 %）。原先 KV 卡只支持 [名, 值]，
   写成数组 [k, v, s] 时 z.k / z.v 全是 undefined → 整张卡只剩标题、一行内容都没有
   （第二张截图里「属地集中度」空白的真正原因，不是截图问题）。 */
/* 宽度用 auto：固定 60px 时「标签96 + 值72 + 补充60 + 间距」在 w=1 窄卡里
   会超出卡片右边界（补充值被裁掉）。auto + min-width:0 让它按内容收缩。 */
.bar .sv{width:auto;min-width:0;flex:0 1 auto;text-align:right;font-size:11.5px;
  color:var(--fg3);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 值为文字（「陕西 20」「12 / 8」）时不画进度条，文字右对齐自适应宽度，
   否则旧逻辑会算出 NaN 宽度并把值打成「-」 */
.bar .tr.textonly{visibility:hidden}
.bar .nv.text{width:auto;flex:0 0 auto;max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== v10 流光层：SVG 虚线 + stroke-dashoffset 线性位移 =====
   一个周期的位移量恰好等于 dash+gap，周期首尾图案完全重合 →
   循环处零跳变；linear 保证全程匀速，infinite 保证不停顿、不加减速。 */
/* ===== v11 · 分段流光覆盖层 =====
   盖在图表 canvas 之上的 SVG，用「虚线 + stroke-dashoffset 线性循环」画出条内流动的
   分段/光带。dash 与 gap 由 JS 的 FLOW 表下发为内联 style，CSS 只保留一个通用 keyframes；
   周期位移量 = dash + gap（由 --cyc 传入），所以循环处图案与起点完全重合 → 零跳变。
   opacity 默认 0：条先「增长」，长完由渲染器加 .on 淡入流光，节奏上不会抢跑。 */
/* overflow 必须 hidden：覆盖层的 viewBox 就等于容器，干流折线是按经纬度换算出来的像素点，
   一旦地图被放大到超出容器（或被挪到边缘），折线坐标就会落在容器外 —— overflow:visible 时
   SVG 会照画不误，于是「河」画到卡片外面去。裁掉才是正确行为。 */
.flowlayer{position:absolute;left:0;top:0;pointer-events:none;z-index:3;overflow:hidden;opacity:0;
  transition:opacity .3s ease}
.flowlayer.on{opacity:1}
.flowlayer path{fill:none;stroke-linecap:round;animation-name:flowSlide;
  animation-duration:var(--dur,1.4s);animation-timing-function:linear;animation-iteration-count:infinite;
  will-change:stroke-dashoffset;transition:opacity .16s linear}
/* 悬停：高亮本行、其余行淡化（只改透明度、不改速度 —— 改速度会重排相位造成跳变） */
.flowlayer path.dim{opacity:.16}
@keyframes flowSlide{from{stroke-dashoffset:0}to{stroke-dashoffset:var(--cyc,-18)}}
@media print{.flowlayer{display:none}}
@media (prefers-reduced-motion:reduce){.flowlayer path{animation:none}}

/* ===== v13 首页地图：干流示意带 + 落地省脉冲 =====
   干流「光晕带 + 实心带」画在同一个 SVG 覆盖层里（不用 ECharts lines 系列）：
   lines 只能靠 effect 粒子做流动，而 effect 走到终点会瞬间跳回起点 —— 本项目
   一律改用 stroke-dashoffset 循环（见 flowSlide），所以带状与流动必须在同一层。 */
.flowlayer path.rvglow{stroke-width:11;opacity:.30;fill:none;stroke-linecap:round;
  stroke-linejoin:round;filter:blur(2.4px);animation:none}
.flowlayer path.rvcore{stroke-width:3.2;opacity:.95;fill:none;stroke-linecap:round;
  stroke-linejoin:round;animation:none}
/* v15：彩色河道压在**同色系**省份填充上会「糊」进底图（长江蓝 over 亮蓝/青省、黄河金
   over 金/橙省）。在彩带下面垫一条白色「护岸」→ 河道在任何填充色上都是一条独立可辨的
   线；浅色舞台上看不出（本来就是白的），深色舞台上看不见白边也不碍事。 */
.flowlayer path.rvcase{fill:none;stroke-linecap:round;stroke-linejoin:round;
  animation:none;filter:blur(1.1px)}
/* 落地省脉冲：CSS 动 SVG 几何（transform-box:fill-box 让 transform-origin 按元素自身算） */
.flowlayer g.pulse{animation:none}
.flowlayer g.pulse i{display:block}
.flowlayer .pring{fill:none;stroke:#ffd45e;stroke-width:2;transform-box:fill-box;
  transform-origin:center;animation:pulseRing 2.4s ease-out infinite}
.flowlayer .pcore{fill:#ffd45e;stroke:#0a1526;stroke-width:1.6}
.flowlayer .plab{fill:#ffe9a8;font-size:11px;font-weight:700;
  paint-order:stroke;stroke:#0a1526;stroke-width:3px}
@keyframes pulseRing{0%{transform:scale(.34);opacity:.95}72%{transform:scale(3.1);opacity:0}
  100%{transform:scale(3.1);opacity:0}}
@media print{.flowlayer .pring{animation:none;transform:scale(1.1);opacity:.5}}
@media (prefers-reduced-motion:reduce){.flowlayer .pring{animation:none;transform:scale(1.4);opacity:.6}}
/* 地图卡放大版（首页主视觉）：容器高一点，让两江走向看得出「从西到东」 */
.ch.mapstage.bigmap{height:430px}
@media (max-width:900px){.ch.mapstage.bigmap{height:330px}}
/* v14：流域专题「总览」页的流域专属地图（只画该河流流经的省，见 R.basinmap）。
   高度单独给：长江是横长形（墨迹约 2.4:1），640px 高能在满宽下不留大片空档。
   v15：用户指定舞台改「明亮浅色」（不要黑/深底）。**只覆盖 .bzmap**，
   .ch.mapstage 的深色舞台保持不动（首页主视觉 / 地理页仍用深底）；
   浅底配套：省界改深板岩、省名改深墨字+白描边、无样本填充改浅灰蓝（见 R.basinmap）。
   v16：底色由冷白蓝改为**浅卡其（hue 60°, 低彩度）**—— 用户要求「不要白色、且与地图配色
   有明显区分」。按 CIE76 ΔE 在全部地图用色上取「最大最小色差」扫过浅色空间，卡其
   得 minΔE≈28（与纯白 28 持平，优于原冷白蓝 19）；实际填充在舞台上 ΔE 43~88
   （最弱的青 #35d3d3 也有 43）。选它的原因是地图已经占掉了朱红/金(5~45°)、青(180°)、
   蓝与板岩(208~230°) 三个色带，只剩黄绿~绿与紫红两条空档；紫红与朱红同族，故取黄绿。 */
.ch.mapstage.bzmap{height:648px;cursor:grab;
  background:linear-gradient(168deg,#f3f3e8 0%,#e6e6d1 52%,#dadab9 100%);
  border-color:rgba(140,132,88,.26);
  box-shadow:inset 0 0 46px rgba(150,142,100,.16)}
.ch.mapstage.bzmap:active{cursor:grabbing}
/* 浅底上不必再用冷色发光晕，改用暖中性柔和投影，避免地图「浮」在亮底上 */
.ch.mapstage.bzmap canvas{filter:drop-shadow(0 6px 20px rgba(90,84,58,.18))}
@media (max-width:1180px){.ch.mapstage.bzmap{height:560px}}
@media (max-width:900px){.ch.mapstage.bzmap{height:420px}}
@media (max-width:760px){.ch.mapstage.bzmap{height:340px!important}}
/* v17：首页主视觉（中国 → 山东 → 济南 三层落点）改**明亮浅绿舞台**
   —— 用户要求不要黑/深底；且深底上侧栏是深墨字（#2b2118 / #85735d），对比度不足。
   与 .bzmap 同一套浅底规则：省界取 BASIN_MEMC（长江绿 / 黄河橙 / 共源玫红 / 非流域灰）、
   省名深墨字 + 白描边、无样本改浅灰蓝；干流沿用流域色（蓝 / 琥珀），落点标签改深字 + 白描边。 */
.ch.mapstage.maplight{background:linear-gradient(168deg,#eefaf2 0%,#dcf3e5 52%,#c6ead6 100%);
  border-color:rgba(45,120,75,.30);
  box-shadow:inset 0 0 46px rgba(45,120,75,.14)}
.ch.mapstage.maplight canvas{filter:drop-shadow(0 5px 18px rgba(40,95,65,.20))}
.ch.mapstage.maplight .flowlayer .plab{fill:#0b3d1f;stroke:rgba(255,255,255,.92);stroke-width:3px}
.ch.mapstage.maplight .flowlayer .pcore{fill:#0b3d1f;stroke:#ffffff;stroke-width:1.4}
.ch.mapstage.maplight .flowlayer .pring{stroke:#c2185b}

/* ---- 山东地市地图舞台（R.sdcity）：浅卡其渐变，与页面米白底同源 ----
   地图本体是浅底填色，所以舞台要比卡片再浅一点点、带一点暖调，避免map页面出现第二块深色。 */
.ch.mapstage.sdcity{height:560px;position:relative;overflow:hidden;
  background:linear-gradient(168deg,#fdfbf5 0%,#f5efe2 58%,#ede5d4 100%);
  border-color:rgba(120,95,60,.26);
  box-shadow:inset 0 0 40px rgba(120,95,60,.10)}
/* 不用 drop-shadow：它会把**文字也复制一份**偏移几个像素，地市名看起来像重影
   （实测「日照」两个字叠成双层）；改用一层很轻的 inset 光晕代替投影。 */
.ch.mapstage.sdcity{box-shadow:inset 0 0 40px rgba(120,95,60,.10), inset 0 1px 0 rgba(255,255,255,.7)}
/* ⚠ 必须显式关掉 canvas 的投影：通用规则 .ch.mapstage canvas{filter:drop-shadow(...)} 会把
   画布上**每一处非透明像素**都复制一份并偏移 3px —— 区域色看不出问题，但地市名会变成重影
   （实测「日照」叠成双层）。深色舞台靠投影出体积感，浅底这张不需要。 */
.ch.mapstage.sdcity canvas{filter:none}
@media (max-width:1180px){.ch.mapstage.sdcity{height:500px}}
@media (max-width:900px){.ch.mapstage.sdcity{height:420px}}
@media (max-width:760px){.ch.mapstage.sdcity{height:340px!important}}
/* 控制条 / 详情浮层必须盖在 canvas 之上，且不能被 pointer 事件吞掉 */
.sdctl{position:absolute;right:10px;top:10px;z-index:7;display:flex;gap:6px}
.sdctl button{font:12px/1.55 inherit;color:#5c4b3a;background:rgba(255,253,248,.92);
  border:1px solid rgba(120,95,60,.30);border-radius:8px;padding:3px 9px;cursor:pointer}
.sdctl button:hover{background:#fff;color:#2b2118}
.sdctl button.on{background:#3f8f63;border-color:#3f8f63;color:#fff}
.sdpin{position:absolute;left:10px;bottom:10px;z-index:7;width:270px;max-width:calc(100% - 20px);
  background:rgba(255,253,248,.96);border:1px solid rgba(120,95,60,.26);border-radius:10px;
  padding:8px 11px;font-size:12px;color:#5c4b3a;line-height:1.8;box-shadow:0 6px 18px rgba(90,84,58,.14)}
.sdpin b{color:#2b2118}
.sdpin .sdx{float:right;cursor:pointer;color:#85735d;margin-left:8px;font-size:14px}
.sdpin .sdhd{font-size:13px;font-weight:700;color:#2b2118;margin-bottom:2px}
@media (max-width:640px){.sdpin{width:calc(100% - 20px)}}

/* ===== v13：柱状图改为静态 =====
   原 v12 的「条纹流动」动效整体移除 —— @keyframes march / .march / .marchlayer（含其
   opacity 过渡与 dim 态）都不再存在：条渲染完成后保持固定不变，无动画、无过渡、无流光。
   条的颜色改由 JS 的 barRamp() 按索引逐条取色（同一图内每条色相都不同）。 */

/* ===== 条类卡片的「明亮底」=====
   与参考视频一致：白底 + 浅灰轨道 + 亮蓝条纹。只覆盖这张卡片内部的 CSS 变量，
   卡内标题/标签/数值/轨道全部自动跟随，不影响整站深色主题。 */
.card.lp{--panel:#fdfdfd;--panel2:#fdfdfd;--line:#e7ecf4;--grid:#edf1f7;
  --fg:#1f2937;--fg2:#4b5563;--fg3:#8a94a6;
  background:#fdfdfd;border-color:#e7ecf4;color:#1f2937;
  box-shadow:0 10px 26px rgba(6,12,24,.38)}
.card.lp h3{color:#1f2937}
.card.lp .sgb .sgt{background:rgba(120,150,190,.15);box-shadow:inset 0 0 0 1px rgba(120,150,190,.18)}
.card.lp .sgb .sgr:hover .sgt{box-shadow:inset 0 0 0 1px rgba(70,120,200,.5),0 0 0 3px rgba(63,143,99,.14)}
.card.lp button.exp{background:rgba(47,111,224,.12);border-color:rgba(47,111,224,.38);color:#1f2937}
.okrow{color:var(--cyan)} .badrow{color:var(--amber)}
button{font:inherit;color:var(--fg);background:rgba(63,143,99,.14);border:1px solid rgba(63,143,99,.4);
  border-radius:9px;padding:6px 12px;cursor:pointer}
button:hover{background:rgba(63,143,99,.24)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card.w3{grid-column:span 2}}
@media (max-width:900px){.side{display:none}.main{margin-left:0}.grid{grid-template-columns:1fr}.card.w2,.card.w3{grid-column:span 1}}
/* ===== 排版优化 v2：卡片级控件 / 复合卡 / 词云标尺 / 溯源折叠 ===== */
.card .chd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chd h3{margin:0 0 2px}
.seg.tools{display:flex;gap:0;background:rgba(255,253,248,.6);border:1px solid var(--line);
  border-radius:9px;padding:2px}
.seg.tools button{background:none;border:0;color:var(--fg3);padding:4px 10px;border-radius:7px;
  cursor:pointer;font-family:inherit;font-size:11.5px;white-space:nowrap}
.seg.tools button:hover{color:var(--fg2)}
.seg.tools button.on{background:rgba(63,143,99,.20);color:#2c6247;font-weight:600}
button.act{background:rgba(63,143,99,.14);border:1px solid rgba(63,143,99,.45);color:#2c6247;
  border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
button.act:hover{background:rgba(63,143,99,.26)}
.ruler{font-size:11px;color:var(--fg3);margin:7px 0 2px;line-height:1.65}
.ruler b{color:#4a7fa8;font-weight:600}

/* ===== 词云解释体系（WC）=====
   三层：速览 tooltip（跟随指针）→ 固定解释卡（点/回车）→ 隐藏 ARIA 实况区。
   配色沿用站点暖砂令牌；解释卡是真 DOM（可选中、可复制、可被读屏器逐段朗读）。 */
.wc-tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;z-index:9;
  max-width:min(320px,72%);background:rgba(20,17,12,.96);color:#f3ece0;
  border:1px solid rgba(200,180,140,.34);border-radius:9px;padding:7px 10px;
  font-size:12px;line-height:1.55;box-shadow:0 8px 22px rgba(0,0,0,.34)}
.wc-tip b{font-size:13.5px;font-weight:700}
.wc-tip-v{margin-left:8px;color:#e8c88a;font-variant-numeric:tabular-nums}
.wc-tip-l{margin-left:8px;padding:1px 7px;border-radius:999px;font-size:11px;
  color:var(--lc,#e0d6c4);border:1px solid var(--lc,#e0d6c4)}
.wc-tip-hint{display:block;margin-top:3px;font-size:11px;color:#b6a88f}
/* 解释卡：贴卡片**底部**并限高 62%。
   早期版本用 bottom:8px + 垂直居中，实测把词云中央几个最大字号词整块盖住 ——
   词云的信息重心就是中心那几个大词，压住它等于解释功能毁掉了可视性。
   改成贴底 + max-height 62% 后，卡片只占下方空白带，大词始终可见；
   内容超出时卡内滚动（overflow:auto）。 */
.wc-x-card{position:absolute;z-index:12;left:50%;transform:translateX(-50%);
  bottom:6px;width:min(560px,calc(100% - 16px));max-height:82%;
  overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:rgba(255,253,248,.97);backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:12px;
  padding:13px 16px 14px;box-shadow:0 14px 40px rgba(43,33,24,.26);text-align:left}
.wc-x-card[hidden]{display:none}
.wc-x-close{position:absolute;top:6px;right:8px;width:26px;height:26px;line-height:1;
  border:1px solid var(--line);background:var(--panel2);color:var(--fg2);
  border-radius:8px;font-size:16px;cursor:pointer}
.wc-x-close:hover{background:#f0e9dc;color:var(--fg)}
.wc-x-close:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wc-x-top{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding-right:30px;margin-bottom:8px}
.wc-x-term{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--fg);
  word-break:break-all;line-height:1.3}
.wc-x-layer{padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;
  color:var(--lc,#5c4b3a);background:color-mix(in srgb,var(--lc,#5c4b3a) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--lc,#5c4b3a) 40%,transparent)}
.wc-x-field{padding:2px 8px;border-radius:6px;font-size:11.5px;color:var(--fg2);
  background:var(--panel2);border:1px solid var(--line)}
.wc-x-body{font-size:13px;line-height:1.75;color:var(--fg2)}
/* 释义里的强调：加粗 + 变色，但不用 <b> 的粗体（与正文层级差太多会显得刺眼） */
.wc-x-body em{font-style:normal;font-weight:700;color:var(--fg)}
.wc-x-def{margin:0 0 8px;color:var(--fg)}
.wc-x-nodict{color:var(--fg2);border-left:3px solid var(--amber);padding-left:9px}
/* 读图提示 / 噪声词提示：左标 + 浅底，和正文释义在视觉上分层 */
.wc-x-note{margin:0 0 8px;padding:8px 10px;border-radius:0 8px 8px 0;
  background:rgba(74,127,168,.07);border-left:3px solid var(--blue);
  font-size:12.5px;line-height:1.7;color:var(--fg2)}
.wc-x-note b{display:block;font-size:11.5px;color:#4a7fa8;font-weight:700;margin-bottom:2px}
.wc-x-warn{background:rgba(201,134,10,.09);border-left-color:var(--amber)}
.wc-x-warn b{color:#a06a06}
.wc-x-stat{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:10px 0 0;
  padding-top:9px;border-top:1px solid var(--line);font-size:12.5px}
/* label 右侧留白不换行、value 允许换行（口径说明普遍较长，如
   「出现篇数（DF）＝含该词的微博篇数，非原始词频 TF」一句就要两行） */
.wc-x-stat dt{color:var(--fg3);white-space:nowrap}
.wc-x-stat dd{margin:0;color:var(--fg2);font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;line-height:1.65}
/* 空态：说清「为什么空」，避免被读成「该议题没有讨论」 */
.wc-empty{padding:22px 18px;color:var(--fg2);font-size:13px;line-height:1.8;
  border:1px dashed var(--line);border-radius:12px;background:var(--panel2)}
.wc-empty b{display:block;font-size:14px;color:var(--fg);margin-bottom:4px}
/* 读屏实况区：视觉隐藏但可被朗读（不能 display:none，否则不播报） */
.wc-a11y{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
@media (max-width:640px){
  /* 窄屏：解释卡改为贴底整宽，速览不占横向空间 */
  .wc-x-card{width:calc(100% - 12px);padding:12px 13px 13px}
  .wc-x-term{font-size:16px}
  .wc-tip{max-width:calc(100% - 8px)}
}
/* 动效关闭（系统偏好）时不要有淡入淡出 */
@media (prefers-reduced-motion:reduce){ .wc-tip{transition:none} }

.stackitem{padding:1px 0 5px}
.stackitem h4{margin:0 0 2px;font-size:12.5px;font-weight:600;color:var(--fg)}
.stackitem .sub{margin-bottom:5px}
details.srcbox{margin:2px 0 4px}
details.srcbox summary{cursor:pointer;font-size:12.5px;color:var(--fg2);padding:8px 11px;
  background:rgba(120,95,60,.09);border:1px solid var(--line);border-radius:9px;list-style:none}
details.srcbox summary::-webkit-details-marker{display:none}
details.srcbox summary:before{content:'▸ ';color:var(--fg3)}
details.srcbox[open] summary:before{content:'▾ '}
details.srcbox .srcgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
details.srcbox img{width:100%;border-radius:9px;display:block;border:1px solid var(--line)}
@media(max-width:1000px){details.srcbox .srcgrid{grid-template-columns:1fr}}
/* ===== v3 完整版：地图配色 / 全局工具 / 卡片导出 / 保底高度 / 打印 ===== */
.card{position:relative}
.ch{min-height:170px}
.toolbar{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.seg.tools.pal button.on{background:rgba(255,180,77,.22);color:#7d5210}
.lgs{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;margin-right:10px;white-space:nowrap}
.lgc{width:16px;height:9px;border-radius:2px;display:inline-block;border:1px solid rgba(120,95,60,.30)}
button.exp{position:absolute;top:9px;right:11px;z-index:3;opacity:0;transition:opacity .15s;
  background:rgba(255,253,248,.82);border:1px solid var(--line);color:var(--fg2);
  border-radius:7px;padding:2px 9px;font-size:10.5px;font-family:inherit;cursor:pointer;letter-spacing:.5px}
.card:hover>button.exp{opacity:1}
button.exp:hover{background:rgba(63,143,99,.26);color:#2b2118;border-color:rgba(63,143,99,.55)}
td.cell.g,th.cell.g{color:var(--cyan)} td.cell.a{color:var(--amber)} td.cell.b{color:var(--blue)}
td.cell.r{color:var(--red)} td.cell.p{color:var(--purple)}
tr.warnrow td{background:rgba(255,180,77,.055)}
.top .tools-top{display:flex;gap:8px;align-items:center}
/* 导航分组折叠 */
.grp{cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;padding:5px 8px;border-radius:8px}
.grp:hover{background:rgba(120,95,60,.08);color:var(--fg2)}
.grp .arw{font-size:9px;color:var(--fg3);transition:transform .18s;display:inline-block}
.grp.collapsed .arw{transform:rotate(-90deg)}
.grp .cnt{margin-left:auto;font-size:10px;color:var(--fg3);border:1px solid var(--line);
  border-radius:6px;padding:0 5px}
.gitems.collapsed{display:none}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .top,.side,button.exp,.toolbar,.btns,details.srcbox,.foot .tag{display:none!important}
  body{background:#f7f2e8!important}
  .main{margin:0!important;padding:4mm 5mm!important}
  .tblwrap{max-height:none!important;overflow:visible!important}
  .card{break-inside:avoid;page-break-inside:avoid}
  .grid{gap:9px}
  .vtitle{font-size:16px}
}
@media(max-width:760px){.ch{min-height:200px!important}}
/* ===== v4：地图「舞台」——地图与背景的区分度 =====
   根因：卡片底色 --panel #fffdf8 本身是深蓝，而声量色阶低端也是深蓝，
   两者明度接近 → 低值省份"融进"背景。做法是给地图单独铺一层更暗的舞台
   （近黑 #060b15），地图色阶整体提亮，再加上外层冷光晕，形成"底暗图亮"。 */
.ch.mapstage{background:radial-gradient(132% 98% at 50% 44%, #0a1526 0%, #060b15 76%);
  border:1px solid rgba(63,143,99,.22);border-radius:11px;
  box-shadow:inset 0 0 64px rgba(4,9,18,.92)}
.ch.mapstage canvas{filter:drop-shadow(0 3px 16px rgba(48,116,226,.42))}
/* 栅格 dense：让后面的小卡回填前面留下的空洞（叶栅格末行补齐的 CSS 侧配合） */
.grid{grid-auto-flow:row dense}
/* ===== v8：分段进度条卡片（正文 / 评论长度分布）=====
   用户指定采用「改造预案」里那张卡的形态。纯 DOM 实现：条形只有 16px 高，
   canvas 这个高度锯齿明显，DOM 矩形锐利；且卡片要容纳两种非图表元素 ——
   「零值档位」（实测确实有 3 档为 0）与「底部口径说明条」。 */
.ch.segbar{height:auto!important;min-height:0}
.sgb{display:flex;flex-direction:column;gap:6px}
.sgb .sgr{display:grid;grid-template-columns:84px minmax(0,1fr) 54px 42px;align-items:center;gap:9px}
.sgb .sgl{font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgb .sgt{position:relative;height:16px;border-radius:8px;background:rgba(120,95,60,.13);
  box-shadow:inset 0 0 0 1px rgba(120,95,60,.10)}
.sgb .sgm{position:absolute;left:1px;top:1px;bottom:1px;border-radius:7px;overflow:hidden}   /* 掩膜宽度 = 填充进度（静态，无过渡） */
.sgb .sgf{position:absolute;left:0;top:0;bottom:0;border-radius:0 5px 5px 0}   /* 填充：纯色块（颜色由 JS 按行取本图色带） */
.sgb .sgn{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;
  justify-content:center;font-style:normal;font-size:9.5px;color:var(--fg3);opacity:.6;letter-spacing:3px}
.sgb .sgv{font-size:12px;color:var(--fg);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sgb .sgp{font-size:10.5px;color:var(--fg3);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sgb .sgr.z .sgl,.sgb .sgr.z .sgv,.sgb .sgr.z .sgp{opacity:.6}
.sgbn{margin-top:9px;border-left:3px solid var(--amber);background:rgba(255,180,77,.09);
  padding:8px 11px;border-radius:0 9px 9px 0;font-size:11.5px;line-height:1.65;color:var(--fg2)}
.sgbn b{color:var(--fg);font-weight:600}
.sgbn i{font-style:normal;color:var(--amber)}
/* 悬停高亮：只提饱和度与描边，不做任何过渡（保持静态） */
.sgb .sgt{transition:none}
.sgb .sgr:hover .sgt{box-shadow:inset 0 0 0 1px rgba(120,95,60,.6),0 0 0 3px rgba(63,143,99,.12)}
.sgb .sgr:hover .sgf{filter:saturate(1.16) brightness(1.03)}
.sgb .sgr:hover .sgl,.sgb .sgr:hover .sgv{color:var(--fg)}

/* ---------- 智能问答（实时 · 星火 + RAG） ---------- */
.chatbox{display:flex;flex-direction:column;height:100%;gap:10px}
.chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px;min-height:0}

.chat-row{display:flex}
.chat-row.user{justify-content:flex-end}
.chat-row.ai{justify-content:flex-start}

   —— 长江 12 省 = 四川 320 + 其余 43~69；全量属地 31 个省里一半 ≤3 条。

function eqClassify(vals, K){
  var UV = (vals||[]).filter(function(v){ return v > 0; })
              .sort(function(a, b){ return a - b; })
              .filter(function(v, i, a){ return i === 0 || v !== a[i-1]; });

  UV.forEach(function(v, i){
    var c = UV.length <= 1 ? 0 : Math.round(i / (UV.length - 1) * (K - 1));
    CLS[v] = c;
    var b = BRK[c];
    if(!b) BRK[c] = {lo: v, hi: v, n: 1};
    else { if(v < b.lo) b.lo = v; if(v > b.hi) b.hi = v; b.n++; }
  });
  return {CLS: CLS, BRK: BRK, K: K, n: UV.length};
}

var R = {};

/* ===== v13：柱状图静态化（横向柱状图 hbar + 分段条 segbar + 纵向柱 bar / bar2 / stack）=====
   原 v12 的四类动效全部移除：进场逐项增长、条形流动条纹、数值滚动补间、数据更新补间。
   渲染完成后即固定不变 —— 移除动画是为了「同一图内逐条区分颜色」这条需求不受动效干扰，

   保留并沿用原样的：数据源、值轴与类目轴、刻度与分割线、数值标签、tooltip、图例、

var ANIM = {

};

var BAR_PANEL = 'light';
/* v13 静态条配色：同一张图内逐条取色。
   色相以主题绿(148°)为起点、按 360/n 等分，顺序铺 —— 无论多少条，两两色相都不同、无重复
   （固定色表在 12 条以上必然出现重色），且是单向渐变，不会被误读成「两组」。
   色相是环形的，所以首尾那一对（在这类「值大小排序」的图里正好是最上和最下一根）
   只差一个步长 → 再按奇偶交替 ±明度，让相邻两根在「色相 + 明度」两个维度都拉开。
   明度按色相分段修正：黄/橄榄段压暗，避免在米白卡片上发飘。
   off（= 卡片的 o.p）只整体旋转色相，令同批卡片之间仍有变化。 */
function hx2(v){ v = Math.round(255 * Math.max(0, Math.min(1, v))); return (v < 16 ? '0' : '') + v.toString(16); }
function hslHex(h, s, l){
  h = ((h % 360) + 360) % 360; s = s / 100; l = l / 100;
  var a = s * Math.min(l, 1 - l);
  function c(n){
    var k = (n + h / 30) % 12;
    return l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
  }
  return '#' + hx2(c(0)) + hx2(c(8)) + hx2(c(4));

var BARCLR_CACHE = {};
function barRamp(n, off){
  n = Math.max(1, n | 0); off = off | 0;
  var key = n + '_' + off;
  if(BARCLR_CACHE[key]) return BARCLR_CACHE[key];
  var out = [], step = 360 / n, i, hh, l;
  for(i = 0; i < n; i++){
    hh = ((148 + off * 13 + i * step) % 360 + 360) % 360;
    l = 43;
    if(hh >= 32 && hh < 82) l = 32;          /* 黄 / 橄榄 */
    else if(hh >= 82 && hh < 152) l = 37;    /* 黄绿 → 绿 */
    else if(hh >= 152 && hh < 200) l = 38;   /* 青 */
    l += (i % 2 ? -6 : 5);                   /* 奇偶交替明度：补上色环首尾那一对的差异 */
    out.push(hslHex(hh, 45, l));

function flowLayer(box){

  if(getComputedStyle(box).position === 'static') box.style.position = 'relative';
  var svg = null, i;

    var ch = box.children[i];

    svg.setAttribute('class', 'flowlayer');
    box.appendChild(svg);

  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + Math.max(W, 1) + ' ' + Math.max(H, 1));

}

function crPath(pts){
  /* 像素点列 → Catmull-Rom 转三次贝塞尔，让流线贴着 ECharts 的 smooth:0.5 河床走，
     否则折线会切过弯道，看起来像「水在岸上跑」 */
  if(!pts || pts.length < 2) return '';
  function n(v){ return (isFinite(v) ? v : 0).toFixed(1); }
  var s = 'M' + n(pts[0][0]) + ' ' + n(pts[0][1]), i;
  for(i = 0; i < pts.length - 1; i++){
    var p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || pts[i+1];
    s += 'C' + n(p1[0] + (p2[0]-p0[0])/6) + ' ' + n(p1[1] + (p2[1]-p0[1])/6) + ' ' +
               n(p2[0] - (p3[0]-p1[0])/6) + ' ' + n(p2[1] - (p3[1]-p1[1])/6) + ' ' +
               n(p2[0]) + ' ' + n(p2[1]);
  }
  return s;
}

function flowMarks(svg, dlist, spec){
  /* dlist: 每行一条 d 字符串；spec = {keys:['fw1','fw2'], w: 线宽}。
     w 为 0 的档位取 spec.w（粗档位）—— 段缝宽度必须跟条高一致，否则会切不干净。
     返回 rows[行号] = [该行的 path 元素]，供悬停高亮直接操作。 */
  spec = spec || {};
  var keys = spec.keys || Object.keys(FLOW);
  var g = '', i, j, t0 = performance.now() / 1000;
  for(i = 0; i < (dlist || []).length; i++){
    if(!dlist[i]) continue;
    for(j = 0; j < keys.length; j++){
      var f = FLOW[keys[j]]; if(!f) continue;
      var w = f.w || spec.w || 2;
      var col = spec.color || f.color;               /* 允许按调用方覆盖流光颜色 */
      var cyc = f.dash + f.gap;                      /* 周期位移量 = dash + gap */
      var dl = -(t0 % f.dur).toFixed(3);             /* 负延迟：对齐全局时钟，重建不「重启」 */
      g += '<path class="' + keys[j] + '" data-i="' + i + '" d="' + dlist[i] + '" style="' +
           'stroke:' + col + ';stroke-width:' + w +
           ';stroke-linecap:' + (f.cap || 'round') +
           ';stroke-dasharray:' + f.dash + ' ' + f.gap +
           ';--dur:' + f.dur + 's;--cyc:-' + cyc +
           ';animation-delay:' + dl + 's"/>';
    }
  }
  svg.innerHTML = g;
  var ps = svg.querySelectorAll('path'), rows = [];
  for(i = 0; i < ps.length; i++){
    var k = +ps[i].getAttribute('data-i');
    (rows[k] = rows[k] || []).push(ps[i]);
  }
  return rows;
}
R.hbar = function(box, s){
  /* v13：静态横向柱状图。
     与 v12 的差异只有两处 ——（1）无任何动画：进场增长 / 数据补间 / 条纹层全部去掉，
     setOption 之后即固定；（2）条不再共用一条渐变，而是逐条取色（barRamp），
     使同一张图里的不同柱子颜色区分明显。
     数据源、值轴、类目轴、刻度、分割线、数值标签、tooltip、条宽与 grid 布局一律照旧。 */
  var o = s.o || {};
  var d = (s.d||[]).slice(0, o.n||15).map(function(x){
    return {name:(x.name!=null?x.name:x[0]), value:(x.value!=null?x.value:x[1])}; });
  d = d.slice().reverse();                        /* 反转 → 自上而下即「由大到小」 */
  var names = d.map(function(z){ return z.name; });
  var vals  = d.map(function(z){ return +z.value || 0; });
  var bh = Math.min(16, o.bw || 16);              /* barMaxWidth */
  var TH = THEME[BAR_PANEL] || THEME.dark;
  var off = o.p || 0;                             /* 配色起始偏移：让同批卡片之间仍有变化 */
  /* 逐条取色：色相按 360/n 等分，图内每条色相都不同 */
  var ramp = barRamp(d.length, off);
  var colorOf = (o.grad && o.grad.length >= 2)
    ? new echarts.graphic.LinearGradient(0,0,1,0,
        [{offset:0,color:o.grad[0].color},{offset:1,color:o.grad[1].color}])
    : function(p){ return ramp[p.dataIndex]; };
  var card = box.closest('.card');
  if(card && BAR_PANEL === 'light') card.classList.add('lp');   /* 亮底：白卡 + 彩条 */
  var c = initChart(box);
  c.setOption(base({
    animation: false,
    animationDuration: 0,
    animationDurationUpdate: 0,
    grid: gridL(0, 46, 10, 6),
    tooltip: {trigger:'axis', axisPointer:{type:'shadow'}, backgroundColor:TH.tipBg,
      borderColor:TH.tipBd, textStyle:{color:TH.tipFg,fontSize:12},
      formatter:function(p){ return p[0].name+'：<b>'+raw(p[0].value)+'</b>'+(o.unit||''); }},
    xAxis: Object.assign({type:'value', axisLabel:{color:TH.axis,fontSize:11,formatter:function(v){return fmt(v);}}},
      {splitLine:{lineStyle:{color:TH.grid}}, axisLine:{show:false}}),
    yAxis: {type:'category', data:names,
      axisLine:{lineStyle:{color:TH.line}}, axisTick:{show:false},
      axisLabel:{color:TH.name, fontSize:11.5, width:96, overflow:'truncate'}},
    series:[{type:'bar', data:vals, barMaxWidth:bh,
      itemStyle:{borderRadius:[0,5,5,0], color:colorOf},
      emphasis:{focus:'self', itemStyle:{shadowBlur:12, shadowColor:'rgba(120,170,255,.5)'}},
      blur:{itemStyle:{opacity:ANIM.hover.dim}},
      label:{show:d.length<=12, position:'right', color:TH.val, fontSize:11,
             formatter:function(p){ return fmt(p.value); }}}]
  }));

};

R.bar = function(box, s){

       o.lab  柱顶标数值（同时放开类目抽稀：类目少时一个都不少）
       o.r    柱顶圆角半径（参考款是明显的圆头；默认 4）

  var d = s.d||{}, x = d.x||[], y = d.y||[], o = s.o||{};

R.mline = function(box, s){

R.pie = function(box, s){
  var o = s.o || {};
  var d = (s.d||[]).map(function(z, i){
    var nm = z.name!=null?z.name:z[0], vv = z.value!=null?z.value:z[1];
    var o2 = {name:nm, value:vv};
    if(o.cmap && o.cmap[nm]) o2.itemStyle = {color:o.cmap[nm]};
    return o2; });
  /* 【v9 统一】全站饼/环图一律采用「议题分布」卡（用户指定的基准样式）的呈现方式：
     扇区不再外挂「名称 + 数值」标签与引线 —— 类目多时必然互相压字、被卡片边缘裁切；
     名称与占比统一交给右侧竖排图例（名称 + 百分比，一位小数），原始条数保留在 tooltip。
     玫瑰图（roseType:'radius'）的半径方向本身编码大小，占比同样由图例给出，
     与饼/环保持完全一致的读写方式。
     宽卡片（>=700px）上环形与图例整体右移集中，避免环形贴左、图例贴右中间空一大片。 */
  var cw = box.clientWidth || 0;   // 容器尚未布局（隐藏视图首帧）时为 0，按窄版处理
  var wide = cw >= 700;
  var c = initChart(box);
  c.setOption(base(Object.assign({
    tooltip:{trigger:'item', backgroundColor:'rgba(255,253,248,.95)', borderColor:C.line, textStyle:{color:C.fg,fontSize:12},
      formatter:function(p){ return p.name+'：<b>'+raw(p.value)+'</b>（'+p.percent+'%）'; }},
    legend: Object.assign(
      {orient:'vertical', top:'middle', itemGap:8,
       textStyle:{color:C.fg2,fontSize:11}, itemWidth:10, itemHeight:10,
       formatter:function(nm){
         var tot = 0, v = 0, i;
         for(i = 0; i < d.length; i++){ tot += (+d[i].value||0); if(d[i].name === nm) v = +d[i].value||0; }
         /* 一律保留 1 位小数（6% → 6.0%），与基准卡「社会治理 28.1%」的标注格式完全对齐 */
         return tot > 0 ? nm + '  ' + (v / tot * 100).toFixed(1) + '%' : nm;
       }},
      wide ? {left:'56%'} : {right:4}),
    series:[{type:'pie',
      radius: o.donut ? ['42%','64%'] : (o.rose ? ['18%','62%'] : ['0%','62%']),
      center: wide ? ['36%','52%'] : ['34%','52%'], data:d, color:PAL,
      roseType:o.rose ? 'radius' : undefined,
      itemStyle:{borderColor:'rgba(255,253,248,.9)', borderWidth:2},
      label:{show:false},
      labelLine:{show:false}}]
  }, {})));
  return c;
};

R.rose = function(box, s){ s.o = Object.assign({rose:true}, s.o||{}); return R.pie(box, s); };
/* ===== v7：新增 5 种「非柱状」渲染器 =====
   背景：全页 69 个图表位里柱状族占了 44 个，视觉过于单调。按数据形态分流：
   donut  环形构成 → 类目少（6~7）且要读占比时，环比横条更省版面
   area   面积折线 → 有序分箱的分布，面积读「密度形状」比一排等高柱直观
   funnel 漏斗     → 分档天然逐档递减（长度/数量分箱），漏斗比柱状更直观
   radar  雷达     → 多系列 × 多指标的「形状差异」对照（柱状只能逐项比高度）
   bubble 气泡堆积 → 长尾排行：面积 ∝ 值，一眼看出体量结构（柱状只编码长度） */
function pairify(d){
  /* 统一两种数据形态：[[名, 值], ...] 与 {x:[名...], y:[值...]} */
  if(d && !d.length && d.x) return d.x.map(function(t, i){ return [t, (d.y||[])[i]]; });
  return (d||[]).map(function(z){
    return [ (z && z.length) ? z[0] : z.name, (z && z.length) ? z[1] : z.value ]; });
}
function labelW(nm){
  /* 标签宽度（em）：汉字 ≈1.07、数字/字母 ≈0.57 —— 与河流带节点同一套实测系数 */
  var w = 0;
  for(var i = 0; i < nm.length; i++) w += (nm.charCodeAt(i) > 255 ? 1.07 : 0.57);
  return w || 1;
}

R.donut = function(box, s){ s.o = Object.assign({donut:true}, s.o||{}); return R.pie(box, s); };
R.area  = function(box, s){ s.o = Object.assign({area:true, smooth:true}, s.o||{}); return R.line(box, s); };

R.radar = function(box, s){
  /* 多系列 × 多指标：每个轴单独取 max（各轴量纲一致时也安全），面积层给「形状」 */
  var d = s.d||{}, xs = d.x||[], ss = d.series||[];
  var ind = xs.map(function(t, i){
    var m = 1;
    ss.forEach(function(z){ m = Math.max(m, +z.y[i]||0); });
    return {name:t, max:Math.ceil(m * 1.15)};
  });
  var c = initChart(box);
  function col(z, i){ return serCMap(s)[z.name] || PAL[i]; }
  c.setOption(base({
    legend:{data:ss.map(function(z){return z.name;}), textStyle:{color:C.fg2,fontSize:11},
      top:2, itemWidth:10, itemHeight:10},
    tooltip:{trigger:'item', backgroundColor:'rgba(255,253,248,.95)', borderColor:C.line,
      textStyle:{color:C.fg,fontSize:12},
      formatter:function(p){
        return '<b>'+p.name+'</b><br/>' + ind.map(function(o, i){
          return o.name+'：<b>'+raw(p.value[i])+'</b>'; }).join('<br/>'); }},
    radar:{center:['50%','56%'], radius:'60%', indicator:ind,
      axisName:{color:C.fg2, fontSize:11},
      splitLine:{lineStyle:{color:C.grid}},
      splitArea:{areaStyle:{color:['rgba(120,95,60,.04)','rgba(120,95,60,.08)']}},
      axisLine:{lineStyle:{color:C.grid}}},
    series:[{type:'radar', symbolSize:4,
      data:ss.map(function(z, i){
        return {name:z.name, value:z.y, itemStyle:{color:col(z, i)},
          lineStyle:{color:col(z, i), width:2},
          areaStyle:{color:col(z, i), opacity:.14}}; })}]
  }));
  return c;
};

R.funnel = function(box, s){
  /* 分档递减：sort:descending 会按值重排，档位顺序信息让位于体量顺序 ——
     卡片副标题里已写明「按档内条数降序排列」，避免被读成时间/长度升序。 */
  var o = s.o||{};
  var d = pairify(s.d||[]).map(function(z){ return {name:z[0], value:z[1]}; });
  var c = initChart(box);
  c.setOption(base({
    tooltip:{trigger:'item', backgroundColor:'rgba(255,253,248,.95)', borderColor:C.line,
      textStyle:{color:C.fg,fontSize:12},
      formatter:function(p){ return p.name+'：<b>'+raw(p.value)+'</b>'+(o.unit||''); }},
    series:[{type:'funnel', left:'10%', right:'10%', top:12, bottom:8,
      minSize:'20%', maxSize:'100%', sort:'descending', gap:2, funnelAlign:'center',
      itemStyle:{borderColor:'rgba(255,253,248,.9)', borderWidth:1},
      label:{show:true, position:'inside', color:'#08111f', fontSize:11, fontWeight:600,
        formatter:function(p){ return p.name+' '+fmt(p.value); }},
      labelLine:{show:false}, color:PAL, data:d}]
  }));
  return c;
};

R.bubble = function(box, s){
  /* 气泡堆积：按值降序，贪心换行塞进容器宽度，面积 ∝ 值。
     只有直径够大时才把词写进圆内（否则靠 tooltip + 图例条），
     图例条给完整 Top 明细，弥补小圆放不下词名的读图损失。
     布局依赖容器像素尺寸 → 把重排函数挂到实例的 __relayout，窗口 resize 时由全局钩子重跑。 */
  var o = s.o||{};
  var d = pairify(s.d||[]).slice(0, o.n||10)
    .map(function(z){ return {name:z[0], value:+z[1]||0}; });
  d.sort(function(a, b){ return b.value - a.value; });
  var c = initChart(box);
  function layout(){
    var W = Math.max(180, box.clientWidth - 8), H = Math.max(120, box.clientHeight - 6);
    var mn = Infinity, mx = 1;
    d.forEach(function(z){ if(z.value > mx) mx = z.value; if(z.value < mn) mn = z.value; });
    function dia(v){
      var t = (mx > mn) ? (v - mn) / (mx - mn) : .5;
      return 34 + 54 * Math.sqrt(Math.max(0, Math.min(1, t)));      /* 34~88px 直径 */
    }
    var gap = 6, rows = [], cur = [], curW = 0, i, D = d.map(function(z){ return dia(z.value); });
    for(i = 0; i < d.length; i++){
      var w0 = D[i] + gap;
      if(cur.length && curW + w0 > W){ rows.push({ix:cur, w:curW}); cur = []; curW = 0; }
      cur.push(i); curW += w0;
    }
    if(cur.length) rows.push({ix:cur, w:curW});
    var hs = rows.map(function(r0){
      return Math.max.apply(null, r0.ix.map(function(k){ return D[k]; })); });
    var tot = hs.reduce(function(a, b){ return a + b + gap; }, 0);
    /* 纵向居中：y 轴域设为 H（= 容器像素高），保证「值→像素」是 1:1，
       否则 tot<H 时行距会被拉伸（圆保持像素尺寸、间距被放大），tot>H 时又会重叠 */
    var y0 = Math.max(0, (H - tot) / 2), pts = [];
    rows.forEach(function(r0, ri){
      var h = hs[ri], x = (W - (r0.w - gap)) / 2;
      r0.ix.forEach(function(k){
        x += D[k] / 2;
        var nm = d[k].name.length > 4 ? d[k].name.slice(0, 4) : d[k].name;
        var fs = Math.min(12, (D[k] - 8) / labelW(nm));
        pts.push({name:d[k].name, v:d[k].value, symbolSize:Math.round(D[k]),
          value:[Math.round(x), Math.round(y0 + h / 2)],
          label:{show:(D[k] >= 40 && fs >= 8.5), fontSize:+fs.toFixed(1), formatter:nm}});
        x += D[k] / 2 + gap;
      });
      y0 += h + gap;
    });
    c.setOption(base({
      grid:{left:0, right:0, top:0, bottom:0, containLabel:false},
      tooltip:{trigger:'item', backgroundColor:'rgba(255,253,248,.95)', borderColor:C.line,
        textStyle:{color:C.fg,fontSize:12},
        formatter:function(p){ return '<b>'+p.data.name+'</b><br/>'+raw(p.data.v)+(o.unit||''); }},
      xAxis:{type:'value', min:0, max:W, show:false},
      yAxis:{type:'value', min:0, max:H, show:false, inverse:true},
      series:[{type:'scatter', symbol:'circle',
        data:pts.map(function(p, k){
          var col = PAL[k % PAL.length];
          p.itemStyle = {color:new echarts.graphic.RadialGradient(.35, .32, .72,
              [{offset:0, color:rgba(col, 1)}, {offset:1, color:rgba(col, .5)}]),
            borderColor:rgba(col, .95), borderWidth:1.5};
          p.label = Object.assign({position:'inside', color:'#08111f'}, p.label);
          return p; })}]
    }), true);
  }
  layout();
  c.__relayout = layout;
  var card = box.closest('.card'), ru = card? card.querySelector('.ruler') : null;
  if(ru){
    ru.innerHTML = '<span class="lgs">面积 ∝ 值（越大越靠前）</span>' +
      d.slice(0, 6).map(function(z, i){
        return '<span class="lgs"><i class="lgc" style="background:'+PAL[i % PAL.length]+'"></i>'+
          z.name+' <b>'+raw(z.value)+'</b></span>'; }).join('') +
      (d.length > 6 ? '<span class="lgs">… 共 '+d.length+' 项，其余悬停查看</span>' : '');
  }
  return c;
};
