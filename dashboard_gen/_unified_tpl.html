R.heat = function(box, s){
  /* 通用热力矩阵（批次 2 新增）：把 R.spark 里那套「多色阶 + 暗格衬底 + 格内数字
     按渲染色亮度自适应」的做法抽成通用渲染器 —— spark 的横轴写死 D1..Dn，
     而年×月矩阵、事件×月份、属地×议题这些都需要自定义行列名。

     d = { x:[列名...], y:[行名...], v:[[列序, 行序, 数值], ...] }
     o.cut  列名后缀说明（如「末列 = 断月」）
     o.unit 图例单位；o.yw 行标签宽度
     o.sqrt true = 色阶按平方根拉伸（**格内数字仍是原值**）。用于值域跨 2~3 个数量级
           的矩阵：线性色阶会把 0.06~6 压成同一片深色，低值区间完全失去分辨率。 */
  var HPAL = ['#2b57b0','#2f7fe0','#22b7e8','#22d0a8','#6f9e3a','#ffd45e','#ff8a3d','#ff4d5e'];
  function h2r(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
  function rampAt(t){
    t = Math.max(0, Math.min(1, t));
    var x = t * (HPAL.length - 1), i = Math.min(HPAL.length - 2, Math.floor(x)), f = x - i;
    var a = h2r(HPAL[i]), b = h2r(HPAL[i+1]);
    return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
  }
  function lum(c){ return 0.299*c[0] + 0.587*c[1] + 0.114*c[2]; }

  var d = s.d||{}, o = s.o||{};
  var X = d.x||[], Y = d.y||[];
  var SQ = !!o.sqrt;
  /* 色阶取值：sqrt 模式只压色阶、不动格内数字 —— 数字必须保持原值可读，
     变形只发生在「颜色 ↔ 数值」这条映射上。 */
  function cval(v){ var x = Math.max(v, 0); return SQ ? Math.sqrt(x) : x; }
  var all = [], mx = 1;
  (d.v||[]).forEach(function(z){
    /* 「有样本」与「值 > 0」必须分开判断：有 6 条样本但去极值均值恰为 0 的格子，
       如果按 v>0 判断就会被画成"无样本"暗格 —— 读者会把"确实为 0"误读成"没数据"。
       v 的第 4 元素（可选）显式给出 has；不给时退回 v>0 的旧行为。 */
    var has = (z.length > 3) ? !!z[3] : z[2] > 0;
    all.push({value:[z[0], z[1], cval(z[2])], v:z[2], has:has,
      name:(Y[z[1]]!=null?Y[z[1]]:'') + ' · ' + (X[z[0]]!=null?X[z[0]]:'')});
    if(cval(z[2]) > mx) mx = cval(z[2]);
  });
  var hot = all.filter(function(z){ return z.has; }).map(function(z){
    var c2 = rampAt(z.value[2] / mx);
    return {value:z.value, v:z.v, has:z.has, name:z.name,
      label:{color:(lum(c2) > 150 ? '#08111f' : '#eaf2ff'), fontSize:10, fontWeight:600}};
  });
  var c = initChart(box);
  c.setOption(base({
    grid:{left:(o.yw||54), right:14, top:8, bottom:24, containLabel:false},
    tooltip:{backgroundColor:'rgba(255,253,248,.95)', borderColor:C.line,
      textStyle:{color:C.fg, fontSize:12},
      formatter:function(p){ return p.data.name + '：<b>' + raw(p.data.v) + '</b>' + (o.unit||''); }},
    xAxis:{type:'category', data:X, axisLine:{show:false}, axisTick:{show:false},
      axisLabel:{color:C.fg3, fontSize:10, interval:0}},
    yAxis:{type:'category', inverse:true, data:Y, axisLine:{lineStyle:{color:C.line}},
      axisTick:{show:false}, axisLabel:{color:C.fg2, fontSize:11}},
    visualMap:{show:false, min:0, max:mx, seriesIndex:1, inRange:{color:HPAL}},
    series:[
      {type:'heatmap', silent:true, z:1, data:all,
        itemStyle:{color:'rgba(120,95,60,.07)', borderRadius:4,
          borderColor:'rgba(255,253,248,.6)', borderWidth:1}},
      {type:'heatmap', z:2, data:hot,
        itemStyle:{borderRadius:4, borderColor:'rgba(6,11,21,.85)', borderWidth:1.5},
        label:{show:true, formatter:function(p){ return p.data.has ? raw(p.data.v) : ''; }}}
    ]
  }));
  var card = box.closest('.card'), ru = card? card.querySelector('.ruler') : null;
  if(ru){
    ru.innerHTML = '<span class="lgs">色阶（低 → 高）</span>' +
      HPAL.map(function(h){ return '<i class="lgc" style="background:'+h+';width:20px"></i>'; }).join('') +
      '　·　格内数字 = ' + (o.unit ? o.unit : '计数') +
      '　·　色域 0 ~ ' + raw(SQ ? Math.round(mx * mx * 10) / 10 : mx) +
      (SQ ? '（<b>色阶按平方根拉伸</b>，格内数字仍为原值）' : '') +
      '　·　<b>暗格 = 无样本</b>（有样本但值为 0 的格仍会显示数字 0）' +
      (o.cut ? '　·　' + o.cut : '') +
      '　（共 ' + hot.length + ' / ' + all.length + ' 格有样本）';
  }
  return c;
};

R.map = function(box, s){
  /* 中国地图：低端用可见的板岩蓝（否则 0 声量省份会融进深色底，整图发黑）；
     visualMap 负责连续上色，itemStyle.areaColor 只作"无数据"兜底。 */
  var o = s.o||{}, side = (o.basin? 'article' : (o.side||'article'));
  var pal = MAP_PALS[o.pal] || MAP_PALS.heat;
  /* o.prov / o.total：允许外部注入省份声量表（流域专题的地图用流域子集口径），
     不传则回落到全域 U.ip[side] —— 两套口径互不覆盖。 */
  var P = o.prov || U.ip[side].provinces, M = U.ip.meta;
  var TOT = (o.total != null ? o.total : U.ip[side].total);
  var YZ={}, YL={}, SH={};
  M.YANGTZE.forEach(function(p){ YZ[p]=1; });
  M.YELLOW.forEach(function(p){ YL[p]=1; });
  /* 共源省单列（与 R.rivermap / 模块级 _BNB 同口径）：meta 里 YANGTZE 已含四川、YELLOW 已含
     青海，两表求交会得出空集，必须靠 SHARED 才能把「两江共源」标出来并归到绿色。 */
  (M.SHARED||[]).forEach(function(p){ SH[p]=1; });
  var mx = Math.max.apply(null, Object.keys(P).map(function(k){ return P[k]; }).concat([1]));
  /* v5：连续 visualMap → **等频分级 + piecewise 图例**。
     原实现的 visualMap 是 continuous(0 ~ mx)，而本项目属地值是长尾的
     （31 个有值省份里一半 ≤3 条，四川 56）→ 绝大多数省挤在最低一两档，
     整图"一大片紫 + 几个亮点"。改分级后各省占满 8 档，相邻省也更容易区分。
     断点值写进图例与卡片色标，数值—颜色关系可逐档核对。 */
  var vals = M.PROV.map(function(p){ return +P[p] || 0; });
  var EQ = eqClassify(vals, pal.length);
  var NODATA_C = 'rgba(120,132,158,.55)';   /* 0 条＝无数据，用冷灰蓝与"低值档"区分 */
  function clsColor(v){ return v > 0 ? pal[(EQ.CLS[v] != null ? EQ.CLS[v] : 0)] : NODATA_C; }
  function basinOf(p){
    if(SH[p]) return '重叠';
    if(YZ[p]) return '长江';
    if(YL[p]) return '黄河';
    return '非流域';
  }
  var data = M.PROV.map(function(p){
    var v = P[p]||0;
    if(o.basin) return {name:p, value:v, itemStyle:{areaColor:BASIN_C[basinOf(p)]}};
    /* v5：分级后逐省显式上色（不再交给 continuous visualMap 猜） */
    return {name:p, value:v, itemStyle:{areaColor:clsColor(v)}};
  });
  var pieces = EQ.BRK.map(function(b, ci){
    if(!b) return null;
    return {min: b.lo, max: b.hi, color: pal[ci]};
  }).filter(Boolean);
  var c = initChart(box);
  c.setOption(base({
    tooltip:{backgroundColor:'rgba(255,253,248,.96)', borderColor:C.line, textStyle:{color:C.fg,fontSize:12},
      formatter:function(p){
        if(p.value==null) return p.name+'：无数据';
        if(o.basin) return '<b>'+p.name+'</b><br/>流域归属：'+basinOf(p.name)+
                          '<br/>声量：'+raw(p.value)+'（'+pct(p.value, TOT)+'）';
        return '<b>'+p.name+'</b><br/>声量：'+raw(p.value)+'（'+pct(p.value, TOT)+'）';
      }},
    visualMap: o.basin ? undefined : {
      show:true, type:'piecewise', pieces:pieces, left:10, bottom:12,
      itemHeight:12, itemWidth:12, calculable:false,
      text:['高','低'], showLabel:true,
      /* 图例画在近黑舞台内，原先用深棕 C.fg2 → 深底深字、断点数字完全看不见 */
      textStyle:{color:'rgba(233,240,252,.88)', fontSize:10}, borderColor:'transparent',
      outOfRange:{color:NODATA_C}
    },
    series:[{type:'map', map:'china', roam:false, selectedMode:false,
      /* ⚠ 只用 layoutCenter + layoutSize（等比缩放）。
         若改用 left/top/right/bottom，ECharts 会分别在 x/y 上缩放去填满矩形，
         宽而矮的容器就会把中国地图压成"扁条"（实测 833×260 时墨迹比例 3.32，
         而中国地图自然比例只有 1.44）。容器高宽比建议 ≥ 1:1.6。 */
      layoutCenter: ['50%','51%'],
      layoutSize: '132%',   /* 实测：墨迹高度 = min(容器宽,高)，等比不拉伸 */
      label:{show:true, color:'rgba(248,252,255,.98)', fontSize:o.labelFs||11,
        textBorderColor:'rgba(4,9,18,.9)', textBorderWidth:2.4},
      itemStyle:{borderColor:'rgba(226,240,255,.88)', borderWidth:1.2, areaColor:pal[0]},
      emphasis:{ label:{color:'#fff', fontWeight:'bold'},
        itemStyle:{borderColor:'#fff', borderWidth:1.8, shadowBlur:18, shadowColor:'rgba(255,214,94,.95)'} },
      data:data}]
  }));
  /* 卡片底部色阶 / 流域图例条 */
  var card = box.closest('.card');
  var ru = card? card.querySelector('.ruler') : null;
  if(ru){
    if(o.basin){
      /* 计数由运行期的 meta 现算，别再手写（历史上一处写死 12/8/3，与数据实际 11/7/2 不符）。 */
      var nSh = Object.keys(SH).length;
      var nYz = Object.keys(YZ).filter(function(p){ return !SH[p]; }).length;
      var nYl = Object.keys(YL).filter(function(p){ return !SH[p]; }).length;
      ru.innerHTML = '<span class="lgs">流域图层（固定色，深浅与声量无关）</span>' +
        [['长江独有 ' + nYz + ' 省', BASIN_C['长江']], ['黄河独有 ' + nYl + ' 省', BASIN_C['黄河']],
         ['长江+黄河 共源 ' + nSh + ' 省', BASIN_C['重叠']], ['非流域', BASIN_C['非流域']]]
        .map(function(z){ return '<span class="lgs"><i class="lgc" style="background:'+z[1]+'"></i>'+z[0]+'</span>'; })
        .join('');
    } else {
      /* 色标：色块 + 断点范围一一对应（分级地图不标断点 = 让人靠颜色猜数值） */
      ru.innerHTML = '<span class="lgs">色阶（按位次等频分 ' + pal.length + ' 级）</span>' +
        EQ.BRK.map(function(b, ci){
          if(!b) return '';
          return '<span class="lgs"><i class="lgc" style="background:' + pal[ci] + '"></i>' +
                 (ci + 1) + ' 档 ' + (b.lo === b.hi ? raw(b.lo)
                                     : (raw(b.lo) + '~' + raw(b.hi))) + '</span>';
        }).join('') +
        '<span class="lgs"><i class="lgc" style="background:' + NODATA_C + '"></i>无数据 0 条</span>' +
        '　·　' + (MAP_PAL_NOTE[o.pal] || MAP_PAL_NOTE.heat) + '　·　' +
        (side==='article'? '微博作者 IP' : '评论作者 IP') +
        '　·　34 省级行政区（右下"南海诸岛"为附图标注）';
    }
  }
  return c;
};

/* ======================================================================
   v14 流域专属地图（长江 / 黄河两个专题「总览」页的主视觉）

   与首页两张地图的分工（R.rivermap / R.jnmaps 是「全库地理落位」）：
     本图是**流域专题自己的地图** —— 只画该河流流经的省级行政区，
     **不渲染完整中国地图、不加载任何在线瓦片**，几何由
     dashboard_gen/build_basin_geo.py 从阿里云 DataV areas_v3 的省级轮廓
     取子集 + 抽稀生成，页内 echarts.registerMap 注册后本地渲染。

   三类编码：
     ① 填充 = 「目标省份（内容涉及省）」声量。色阶按**本流域 min → max 拉伸**：
        三大主题是等量采样口径，各省绝对量差异极小（长江 43~69、黄河 49~74），
        若按 0 起算，十几个省会全部挤进同一档色，等于没编码。
     ② 干流走向 = 「白色护岸（SVG，让河道压在同色省份上也不糊）+ 流域色底衬线
        （ECharts lines，留在 canvas 上，导出 PNG 也在）+ SVG 流动层（复用 flowLayer /
        flowMarks，stroke-dashoffset 无缝循环）」三层叠成。
        颜色按流域固定：**长江＝蓝 #1f6ee0、黄河＝黄 #d99a00**；白色光段沿上游 → 下游
        匀速流动（linear + infinite + 负延迟对齐全局时钟，循环处零跳变）。
        两端标出源头与入海口 —— 地图上因此能同时读出「这条江怎么走」和「声量落在哪」。
        **不用 ECharts lines.effect**（走到终点会跳回起点）。
     ③ roam 打开：滚轮 / 双指缩放、拖拽平移。省名标签用 GeoJSON 的 centroid 锚点
        自绘（不用 geo 自带 label）—— 宽屏一律全标，窄屏才开自动避让，
        避免东部几个小省的名字被整体隐掉。

   v15：舞台由「近黑」改为「明亮浅色」（用户指定不要黑/深底）——省界、省名、
        无样本填充、源/口锚点全部按浅底重配；只改 .bzmap，深色舞台仍留给首页/地理页。
        干流改「流域色（长江蓝 #1f6ee0 / 黄河金 #d99a00）+ 白色护岸 + 白色流光」的
        SVG 无缝循环（见 paintFlow 与 paintGeo 的 caseW）。
        ⚠ 改动本卡后跑 `dashboard_gen/_probe_bzmap.py` 生成独立探针页 + 无头截图复核：
          整页有 171 张图，直接往成品页里挂测试脚本跑不到（虚拟时间预算先被耗尽）。

   ⚠ 几何范围只含该流域省份，不涉及国界 / 台湾 / 南海诸岛等国标要素（本图不含、也不应含）。
   ====================================================================== */
R.basinmap = function(box, s){
  var o = s.o || {};
  // 黄河专题在 build_unified_page 里的视图前缀是 'hh'，但几何数据键是 'yl'，故一并归一。
  var bk = (o.bk === 'yl' || o.bk === 'hh') ? 'yl' : 'yz';
  var FC = window.BZGEO || {};
  var RV = (window.BZGEO && window.BZGEO.river) || {};
  /* 干流动态线配色（v15）：长江＝蓝、黄河＝黄 —— 用户指定。两色都取中明度饱和色，
     在浅色舞台上与背景高对比；河道下垫白色「护岸」（见 paintGeo 的 caseW），
     所以压在同色系省份填充（亮蓝 / 金橙）上也不会糊掉。 */
  var RVC = (bk === 'yl')
    ? {core:'#d99a00', cname:'黄色', name:'黄河'}
    : {core:'#1f6ee0', cname:'蓝色', name:'长江'};
  var fc = FC[bk];
  if(!fc){
    box.innerHTML = '<div class="note bad">缺少流域几何数据：请先执行 dashboard_gen/build_basin_geo.py</div>';
    return null;
  }
  var NAME = 'bz_' + bk;
  if(!echarts.getMap(NAME)) echarts.registerMap(NAME, fc);

  var P = o.prov || {}, TOT = o.total || 0, NOD = o.noData || {};
  var feats = fc.features;
  var names = feats.map(function(f){ return f.properties.name; });
  /* v16 浅卡其舞台（#e6e6d1 一带）上，无样本省用更深的冷灰蓝：
     原来的 rgba(170,184,206,.55) 合成后只有 ΔE 15.8，混在暖底里读不出；
     加深到 .60/140,150,168 后 ΔE 21.3，且冷暖对立，一眼能看出「这块没样本」。 */
  var HEAT = MAP_PALS.heat, NODATA = 'rgba(140,150,168,.60)';
  var mx = Math.max.apply(null, names.map(function(n){ return +P[n] || 0; }).concat([1]));
  var nz = names.map(function(n){ return +P[n] || 0; }).filter(function(v){ return v > 0; });
  var mn = nz.length ? Math.min.apply(null, nz) : 0;
  /* v5 分级重做（2026-10-03）：**弃用 min→max 线性拉伸**，改「按位次等频分级」
     （实现见上方 eqClassify，全站唯一）。
     为什么必须换：长江 12 省 = 四川 320 + 其余 43~69。线性拉伸时四川独占最高档，
     其余 11 个省的 (v-mn)/span 全在 0.00~0.09 → 全部落进第 1 档，
     于是整张图"一片深蓝 + 一个红块"，既不 vivid 也丢掉了省际区分度。
     分级后：12 个省占满 8 档中的 8 档，断点原样印在卡片底部色标 + tooltip。 */
  var K = HEAT.length;
  var EQ = eqClassify(nz, K), CLS = EQ.CLS, BRK = EQ.BRK;
  function heatOf(v){
    if(!v) return NODATA;
    return HEAT[CLS[v] != null ? CLS[v] : 0];
  }
  function brkText(c){                /* 该档取值范围的文字（单值就不写区间） */
    var b = BRK[c];
    if(!b) return '';
    return b.lo === b.hi ? raw(b.lo) : (raw(b.lo) + '~' + raw(b.hi));
  }
  var rank = {};
  names.slice().sort(function(a, b){ return (+P[b] || 0) - (+P[a] || 0); })
       .forEach(function(n, i){ rank[n] = i + 1; });

  var regions = names.map(function(n){
    var v = +P[n] || 0;
    return {name: n, value: v, itemStyle: {areaColor: heatOf(v)}};
  });
  var anchors = feats.map(function(f){
    return {name: f.properties.name, value: f.properties.anchor,
            v: +P[f.properties.name] || 0};
  });

  /* v16：layoutSize 的百分比基准是容器**短边**（ECharts 语义）。首屏这张卡是宽扁容器
     （实测约 1340×600），按短边取 99% 时长江图只用到约一半宽、一半高，四周全是空档。
     改用与 R.sdmap 同一套反算：先由 GeoJSON 投影包络求墨迹自然长宽比 INK_AR
     （经度按中纬 cos 收缩，否则西部被拉长），再取「墨迹宽度上限 =
     min(容器宽, 容器高 × INK_AR)」× 留边系数，最后换算回「相对短边」的百分比。
     AR 由数据算、不写死 → 换流域 / 换省集自动跟着变。 */
  function inkAR(){
    var x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    function scan(ring){
      for(var i = 0; i < ring.length; i++){
        var p = ring[i];
        if(p[0] < x0) x0 = p[0]; if(p[0] > x1) x1 = p[0];
        if(p[1] < y0) y0 = p[1]; if(p[1] > y1) y1 = p[1];
      }
    }
    feats.forEach(function(f){
      var g = f.geometry, cc = g.coordinates;
      (g.type === 'Polygon' ? cc : Array.prototype.concat.apply([], cc)).forEach(scan);
    });
    scan(RV[bk] || []);                     /* 干流也纳入包络，别让河道出框 */
    var mid = (y0 + y1) / 2;
    var w = (x1 - x0) * Math.cos(mid * Math.PI / 180), h = (y1 - y0);
    return (w > 0 && h > 0 && isFinite(w) && isFinite(h)) ? (w / h) : 1.7;
  }
  var INK_AR = inkAR(), FIT_K = 0.94;
  function fitPct(){
    var W = box.clientWidth || 0, H = box.clientHeight || 0;
    if(!W || !H) return '99%';              /* 隐藏视图首帧量不到 → 退回旧行为 */
    var need = Math.min(W * FIT_K, H * FIT_K * INK_AR);
    return (Math.round(need / Math.min(W, H) * 1000) / 10) + '%';
  }

  var c = initChart(box);
  function opt(){
    var w = box.clientWidth || 900;
    /* 窄屏字小 + 开避让；宽屏一律全标（13 个省名一个都不能少） */
    var fs = w >= 720 ? 12.5 : (w >= 560 ? 11 : 9.5);
    var crowd = w < 560;
    /* v15 浅色舞台配色：省界深板岩、省名深墨字 + 白描边（白描边保证在深浅两种填充上
       都读得出来）、源/口锚点用流域色 + 白边、强调态改深色描边（原白描边在浅底看不见）。 */
    return base({
      tooltip:{trigger:'item', backgroundColor:'rgba(255,255,255,.97)',
        borderColor:'rgba(140,132,88,.32)', textStyle:{color:'#1d2b45', fontSize:12}, confine:true,
        formatter:function(p){
          if(p.componentType !== 'series' || p.seriesType !== 'map') return '';
          var v = +p.value || 0;
          if(!v && NOD[p.name]) return '<b>' + p.name + '</b><br/>' + NOD[p.name];
          return '<b>' + p.name + '</b><br/>目标省份声量 <b>' + raw(v) + '</b> 条'
               + '（占本流域 ' + pct(v, TOT) + '）'
               + '<br/>流域内位次 ' + rank[p.name] + ' / ' + names.length
               + '<br/>色阶 第 ' + ((CLS[v] || 0) + 1) + ' 档（' + brkText(CLS[v]) + ' 条）'
               + '<br/><span style="color:#6b7891">共 ' + K + ' 档，按位次等频分级；越亮 = 声量越高</span>';
        }},
      geo:{map:NAME, roam:true, zoom:1.02, scaleLimit:{min:.85, max:8},
        layoutCenter:['50%','50%'], layoutSize:fitPct(),
        label:{show:false},
        /* v5：省界改**白描边**。深色描边（rgba(66,92,130,.62)）在深紫/深红档上几乎看不见，
           相邻省一撞色就糊成一片；白色 1.3px 在任何一档上都能划清边界，
           且浅卡其舞台上有"贴纸浮起"的层次。emphasis 反而用深色描边（亮底上更醒目）。 */
        itemStyle:{borderColor:'rgba(255,255,255,.94)', borderWidth:1.3,
          areaColor:'rgba(168,182,203,.45)'},
        emphasis:{itemStyle:{borderColor:'#2a1a5e', borderWidth:2.2, shadowBlur:18,
          shadowColor:'rgba(42,26,94,.45)'}},
        regions:regions},
      series:[
        {type:'map', map:NAME, geoIndex:0, data:regions, silent:true},
        /* 干流静态底衬线：留在 canvas 上（导出 PNG 时也在），流动层由 SVG 覆盖层叠在其上 */
        {type:'lines', coordinateSystem:'geo', polyline:true, silent:true, zlevel:3,
         lineStyle:{color:'#ffffff', width:BASINSCOPE_VECTOR_MODE ? 12 : 0, opacity:BASINSCOPE_VECTOR_MODE ? .96 : 0},
         data:[{coords:RV[bk] || []}]},
        {type:'lines', coordinateSystem:'geo', polyline:true, silent:true, zlevel:4,
         lineStyle:{color:BASINSCOPE_VECTOR_MODE ? '#7d450a' : RVC.core, width:BASINSCOPE_VECTOR_MODE ? 7 : 2.6, opacity:1},
         data:[{coords:RV[bk] || []}]},
        /* 源头 / 入海口锚点（流域色 + 白边，浅底可见） */
        {type:'scatter', coordinateSystem:'geo', symbolSize:9, zlevel:6, silent:true,
         itemStyle:{color:RVC.core, borderColor:'#ffffff', borderWidth:1.8},
         label:{show:true, color:'#16324f', fontSize:11, distance:5,
           textBorderColor:'rgba(255,255,255,.96)', textBorderWidth:3,
           formatter:function(p){ return window.BASINSCOPE_I18N ? window.BASINSCOPE_I18N.geo(p.data.name) : p.data.name; }},
         data:o.ends || []},
        /* 省名标签层：centroid 锚点，宽屏全标；深墨字 + 白描边 → 深浅底都清晰 */
        {type:'scatter', coordinateSystem:'geo', symbolSize:1, zlevel:6, silent:true,
         itemStyle:{color:'rgba(0,0,0,0)'},
         /* 白描边加粗到 3.2：填色换成高彩度紫/品红/橙之后，深墨字在暗档上全靠这圈白边
            撑住可读性，描边太细会"糊"进底色。 */
         label:{show:true, color:'#16324f', fontSize:fs,
           textBorderColor:'rgba(255,255,255,.98)', textBorderWidth:3.2,
           formatter:function(p){ return window.BASINSCOPE_I18N ? window.BASINSCOPE_I18N.geo(p.data.name) : p.data.name; }},
         /* v16：地图放大到满卡后，东部小省（安徽/江苏/浙江/上海）的 centroid 锚点会挤在
            一起 —— 一律允许 shiftY 纵向避让（宽屏也有大量纵向空间可借），只在窄屏
            （crowd）才额外允许丢标签。两者都关掉会让名字叠成一坨，反而不可读。 */
         labelLayout:{hideOverlap:crowd, moveOverlap:'shiftY'},
         emphasis:{label:{show:true}},
         data:anchors}
      ]
    });
  }
  c.setOption(opt());
  /* 干流动态线（v15）：SVG 覆盖层 + stroke-dashoffset 无缝循环 —— 与首页主视觉
     （R.rivermap / R.jnmaps）复用同一套 flowLayer / paintGeo。干流走向为示意折线，
     流动方向 = 源头 → 入海口。必须在 setOption 之后铺（坐标系就绪才换算得出像素）。 */
  var svgR = null;
  function paintFlow(){
    svgR = flowLayer(box);
    paintGeo(box, c, 0, [{color:RVC.core, pts:RV[bk] || []}],
             {coreW:4, glowW:11, glowOp:.26,
              caseW:14, caseColor:'#ffffff', caseOp:.95,   /* 白色护岸：浅底看不出、压色块不糊 */
              flowColor:'rgba(255,255,255,.96)'});
  }
  paintFlow();
  setTimeout(paintFlow, 800);             /* 兜底：隐藏视图首帧 clientWidth=0，换算不出像素 */
  c.on('finished', function(){ if(svgR) svgR.classList.add('on'); });
  /* 兜底显形：个别环境（无头渲染 / 动画被系统禁用）'finished' 不触发，光带会永远停在
     opacity:0 而「看不见流动」。与 R.sdmap / R.jnmaps 同一处置：900ms 后无条件加 .on。 */
  setTimeout(function(){ if(svgR) svgR.classList.add('on'); }, 900);
  c.on('georoam', paintFlow);             /* 缩放 / 平移后坐标系变了，必须重铺覆盖层 */
  var old = c.__relayout;
  c.__relayout = function(){ if(old) old(); c.setOption(opt()); paintFlow(); };

  var card = box.closest('.card'), ru = card ? card.querySelector('.ruler') : null;
  if(ru){
    /* 色标改成"色块 + 该档取值范围"一一对应：分级地图如果不标断点，
       读者只能靠颜色猜数值，等级语义就废了。 */
    var sw = BRK.map(function(b, ci){
      if(!b) return '';
      return '<span class="lgs"><i class="lgc" style="background:' + HEAT[ci] + '"></i>' +
             (ci + 1) + ' 档 ' + brkText(ci) + '</span>';
    }).join('');
    ru.innerHTML =
      '<span class="lgs">填充＝目标省份声量，<b>按位次等频分 ' + K + ' 级</b>（越亮越高）：</span>' +
      sw +
      '<span class="lgs"><i class="lgc" style="background:' + RVC.core + '"></i>' +
        RVC.name + '干流 · ' + RVC.cname + '流动线（源→入海循环）</span>' +
      '<span class="lgs"><i class="lgc" style="background:' + NODATA + '"></i>无本流域样本</span>' +
      '　·　最高 ' + raw(mx) + ' 条 / 最低 ' + raw(mn) + ' 条（分母 = 本流域微博 ' + raw(TOT) + ' 条）' +
      '　·　' + (o.note || '') +
      '　·　<b>滚轮 / 双指可缩放</b>';
  }
  return c;
};

/* ======================================================================
   v13 首页地图（批次 3 新增）

   为什么单独两个渲染器、不复用 R.map：
     R.map 服务于流域专题的「IP 属地声量」——颜色编码的是**声量**（连续色阶）。
     首页这两张图编码的是**归属**（长江 / 黄河 / 两江共源）与**区位**，量纲不是声量，
     用连续色阶会把"归属"这件事糊掉。所以另开两个，配色/图例/交互都按归属走。

   两张图的共同做法：
     ① ECharts 只负责画底图（省份填充 + 标签 + tooltip）；
     ② 干流与水系走向画在 SVG 覆盖层里，用 stroke-dashoffset 做无缝流动
        （ECharts 的 lines.effect 走到终点会跳回起点，本项目的技术选型一律排除）；
     ③ 像素换算靠 convertToPixel({seriesIndex:0}, [lng,lat])，必须在 setOption 之后。
   ====================================================================== */
var BASIN_MEM = {'长江':BASIN_MEMC['长江'],'黄河':BASIN_MEMC['黄河'],
                 '共源':BASIN_MEMC['共源'],'非流域':'#242e45'};

/* 地图上的经纬度 → 容器像素。坐标系未就绪时 convertToPixel 返回 null（隐藏视图首帧
   clientWidth=0 也会算出 NaN），所以两个都要判。 */
function geoPx(c, si, pt){
  try{
    var p = c.convertToPixel({seriesIndex: si}, pt);
    if(p && isFinite(p[0]) && isFinite(p[1])) return p;
  }catch(e){}
  /* 兜底：流域专属地图（R.basinmap）的地图系列是 geoIndex 绑定，个别版本按
     seriesIndex 换算不出像素 → 再试 geoIndex。两者共用同一坐标系，像素相同。 */
  try{
    var q = c.convertToPixel({geoIndex: si}, pt);
    if(q && isFinite(q[0]) && isFinite(q[1])) return q;
  }catch(e2){}
  return null;
}

/* 把若干条经纬度折线画成「光晕带 + 实心带 + 两档流光」，并可选放一个脉冲标记。
   rivers: [{color, pts:[[lng,lat],...]}]；opt.label/opt.at 给脉冲点。 */
function paintGeo(box, c, si, rivers, opt){
  opt = opt || {};
  var svg = flowLayer(box), dl = [], bands = '', i, j;
  /* 带/光晕的宽度与不透明度、流光颜色都可由调用方覆盖（默认＝CSS 里 .rvglow/.rvcore 的原值，
     首页主视觉不传这些参数 → 行为与改造前完全一致）。 */
  var wg = opt.glowW || 11, wc = opt.coreW || 3.2;
  var og = (opt.glowOp == null ? .30 : opt.glowOp);
  /* 护岸（v15）：caseW = 0 表示不画（首页/地理页不传 → 行为与改造前一致） */
  var wca = opt.caseW || 0, cca = opt.caseColor || '#ffffff';
  var oca = (opt.caseOp == null ? .92 : opt.caseOp);
  var cases = '';
  for(i = 0; i < rivers.length; i++){
    var rv = rivers[i], px = [];
    for(j = 0; j < rv.pts.length; j++){
      var q = geoPx(c, si, rv.pts[j]);
      if(q) px.push(q);
    }
    if(px.length < 2) continue;
    var d = crPath(px);
    dl.push(d);
    if(wca) cases += '<path class="rvcase" d="' + d + '" style="stroke:' + cca +
                     ';stroke-width:' + wca + ';opacity:' + oca + '"/>';
    bands += '<path class="rvglow" d="' + d + '" style="stroke:' + rv.color +
             ';stroke-width:' + wg + ';opacity:' + og + '"/>' +
             '<path class="rvcore" d="' + d + '" style="stroke:' + rv.color +
             ';stroke-width:' + wc + '"/>';
  }
  /* flowMarks 会整体重写 innerHTML，所以先让它铺流光，再把自己那几层「插到最前面」
     —— 护岸在最底、光晕次之、实心带居中、流光在最上，顺序由 prepend 顺序决定。
     两次 afterbegin 会依次把 bands、cases 顶到最前，最终：case → glow → core → flow。 */
  flowMarks(svg, dl, {keys: opt.flowKeys || ['fw1', 'fw2'], color: opt.flowColor});
  if(bands) svg.insertAdjacentHTML('afterbegin', bands);
  if(cases) svg.insertAdjacentHTML('afterbegin', cases);
  if(opt.mark && opt.label){
    var mp = geoPx(c, si, opt.mark);
    if(mp){
      svg.insertAdjacentHTML('beforeend',
        '<g class="pulse" transform="translate(' + mp[0].toFixed(1) + ',' + mp[1].toFixed(1) + ')">' +
        '<circle class="pring" r="9"/>' +
        '<circle class="pcore" r="4.2"/>' +
        '<text class="plab" x="10" y="-8">' + opt.label + '</text></g>');
    }
  }
  return dl.length;
}

/* ---- 首页主视觉：中国地图 · 两江通行省域 + 干流示意走向 ----
   s.d = { prov:{省:值}, rivers:[{name,color,pts}], mark:[lng,lat], label:'山东', total:n }
   o   = { labelFs, palette } */
R.rivermap = function(box, s){
  var d = s.d || {}, o = s.o || {};
  var M = U.ip.meta, P = d.prov || {};
  var TOT = d.total != null ? d.total : 1;
  var YZ = {}, YL = {}, SH = {};
  M.YANGTZE.forEach(function(p){ YZ[p] = 1; });
  M.YELLOW.forEach(function(p){ YL[p] = 1; });
  (M.SHARED || []).forEach(function(p){ SH[p] = 1; });
  /* 归属判定：共源（两江都过）优先 —— 青海是长江正源所在、四川西北部有黄河流过，
     所以这两省不能只算一条江的。原先按「两表求交」判定会得出"零个共源省"。 */
  function memOf(p){
    if(SH[p]) return '共源';
    if(YZ[p]) return '长江';
    if(YL[p]) return '黄河';
    return '非流域';
  }
  var nMem = {长江: 0, 黄河: 0, '共源': 0, '非流域': 0};
  var data = M.PROV.map(function(p){
    var k = memOf(p);
    nMem[k]++;
    return {name: p, value: P[p] || 0, itemStyle: {areaColor: BASIN_MEM[k]}};
  });
  var c = initChart(box);
  c.setOption(base({
    tooltip: {backgroundColor: 'rgba(255,253,248,.96)', borderColor: C.line,
      textStyle: {color: C.fg, fontSize: 12},
      formatter: function(p){
        var k = memOf(p.name);
        var head = '<b>' + p.name + '</b>　<span style="color:' + BASIN_MEM[k] + '">' + k + '</span>';
        if(k === '非流域') return head + '<br/>两江均不通行（不在本作品采集范围）';
        return head + '<br/>聚焦样本声量：<b>' + raw(p.value) + '</b>' +
               (p.value ? '（占两江合计 ' + pct(p.value, TOT) + '）' : '<br/>该省本批无样本');
      }},
    series: [{
      type: 'map', map: 'china', roam: false, selectedMode: false,
      /* 与 R.map 同一套等比缩放参数：只用 layoutCenter + layoutSize，
         用 left/top/right/bottom 会把宽而矮的容器把地图压成扁条。 */
      layoutCenter: ['50%', '51%'], layoutSize: '128%',
      label: {show: true, color: 'rgba(248,252,255,.97)', fontSize: o.labelFs || 11,
        textBorderColor: 'rgba(4,9,18,.92)', textBorderWidth: 2.6},
      itemStyle: {borderColor: 'rgba(206,226,255,.74)', borderWidth: 1,
        areaColor: BASIN_MEM['非流域']},
      emphasis: {label: {color: '#fff', fontWeight: 'bold'},
        itemStyle: {borderColor: '#fff', borderWidth: 1.8, shadowBlur: 20,
          shadowColor: 'rgba(255,214,94,.95)'}},
      data: data
    }]
  }));
  /* 干流 + 落地省脉冲：必须在 setOption 之后（坐标系未就绪时换算不出像素） */
  var svgRef = null;
  function paint(){
    svgRef = flowLayer(box);
    paintGeo(box, c, 0, d.rivers || [], {mark: d.mark, label: d.label});
  }
  paint();
  c.__relayout = paint;
  c.on('finished', function(){ if(svgRef) svgRef.classList.add('on'); });
  setTimeout(function(){ if(svgRef) svgRef.classList.add('on'); }, 900);

  var card = box.closest('.card'), ru = card ? card.querySelector('.ruler') : null;
  if(ru){
    var tot = nMem['长江'] + nMem['黄河'] + nMem['共源'];
    ru.innerHTML =
      [['长江通行 ' + nMem['长江'] + ' 省', BASIN_MEM['长江']],
       ['黄河通行 ' + nMem['黄河'] + ' 省', BASIN_MEM['黄河']],
       ['两江共源 ' + nMem['共源'] + ' 省（' + (M.SHARED || []).join('、') + '）', BASIN_MEM['共源']],
       ['非流域 ' + nMem['非流域'] + ' 省', BASIN_MEM['非流域']]]
        .map(function(z){
          return '<span class="lgs"><i class="lgc" style="background:' + z[1] + '"></i>' + z[0] + '</span>';
        }).join('') +
      '　·　流域合计 <b>' + tot + '</b> 省（34 省级行政区口径，右下"南海诸岛"为附图标注）' +
      '<br/><span class="lgs">江河走向为<b>示意折线</b>（沿程节点连线）· 流动方向 = 源头 → 入海口 · ' +
      '非测绘数据</span>';
  }
  return c;
};

/* ---- 首页辅图：山东省 · 黄河入海段（区位图，不填声量）----
   ⚠ 本项目采集只到省级，没有地市级声量。所以这张图**不做任何数值编码**：
     9 个沿黄市用固定琥珀色标出（地理常识），tooltip 明确写"无地市级数据"，
     绝不在 hover 里给城市编一个数字。 */
R.sdmap = function(box, s){
  var d = s.d || {}, o = s.o || {};
  var RIV = {}; (d.riverCities || []).forEach(function(x){ RIV[x] = 1; });
  var data = {};
  (d.cities || []).forEach(function(x){ data[x] = 1; });

  /* ---- 布局：按容器实测尺寸算 layoutSize，不能写死百分比 ----
     ECharts 的 layoutSize 是「地图包围盒」的尺寸（百分比以容器短边为基准），超出容器的部分
     会被画布直接裁掉，**不是**等比缩小。卡片是窄栏（约 388×430），而山东省图是横长的
     （墨迹自然比例 h/w ≈ 0.68），旧值写 124% 时地图被放大到 124%×388 ≈ 481px 宽，
     比容器宽 90 多像素 → 东西两端的菏泽 / 威海连标签一起被切（用户截图所见）。
     这里反着算：先取「墨迹宽度上限 = min(容器宽, 容器高 / 墨迹比例)」，再乘留边系数，
     最后换算成相对短边的百分比。FIT_AR 是对该地图实测的自然比例（含边界描边与标签外沿），
     换地图或改卡片尺寸后用 dashboard_gen/_probe_mapfit.py 复测。 */
  var FIT_AR = 0.676, FIT_K = 0.94, fitLast = '';
  function fitPct(){
    var W = box.clientWidth || 0, H = box.clientHeight || 0;
    fitLast = W + 'x' + H;
    if(!W || !H) return '100%';
    var need = Math.min(W * FIT_K, H * FIT_K / FIT_AR);
    return (Math.round(need / Math.min(W, H) * 1000) / 10) + '%';
  }
  var LS = fitPct();

  var c = initChart(box);
  var CITY_FILL = o.riverFill || '#8a5a1c';      /* 沿黄市：琥珀暗底，与黄河色同族 */
  var CITY_CORE = o.riverCore || 'rgba(255,178,66,.42)';
  c.setOption(base({
    tooltip: {backgroundColor: 'rgba(255,253,248,.96)', borderColor: C.line,
      textStyle: {color: C.fg, fontSize: 12},
      formatter: function(p){
        var nm = String(p.name || '').replace(/市$/, '');
        var isR = !!RIV[p.name];
        return '<b>' + nm + '</b>　' + (isR ? '黄河干流流经' : '黄河干流不经') +
               '<br/><span style="color:#c9860a">本项目无地市级数据</span>' +
               '<br/>采集粒度只到省级（t_basin_article.目标省份 / 发布地区），' +
               '故本图不作数值编码';
      }},
    series: [{
      type: 'map', map: 'shandong', roam: false, selectedMode: false,
      layoutCenter: ['50%', '50%'], layoutSize: LS,
      label: {show: true, color: 'rgba(248,252,255,.97)', fontSize: 10.5,
        textBorderColor: 'rgba(4,9,18,.92)', textBorderWidth: 2.4,
        formatter: function(q){ return String(q.name).replace(/市$/, ''); }},
      itemStyle: {borderColor: 'rgba(206,226,255,.6)', borderWidth: 1,
        areaColor: 'rgba(44,55,84,.85)'},
      emphasis: {label: {color: '#fff', fontWeight: 'bold'},
        itemStyle: {borderColor: '#fff', borderWidth: 1.8,
          shadowBlur: 16, shadowColor: 'rgba(255,214,94,.9)'}},
      data: (d.cities || []).map(function(x){
        var isR = !!RIV[x];
        return {name: x, value: 0, itemStyle: {
          areaColor: isR ? CITY_CORE : 'rgba(44,55,84,.85)',
          borderColor: isR ? 'rgba(255,196,90,.95)' : 'rgba(206,226,255,.6)',
          borderWidth: isR ? 1.6 : 1}};
      })
    }]
  }));
  var svgRef = null;
  function paint(){
    /* 容器尺寸变了（窗口缩放 / 分栏变化）就重算 layoutSize，否则地图会按旧宽度继续放大 */
    if((box.clientWidth || 0) + 'x' + (box.clientHeight || 0) !== fitLast){
      c.setOption({series: [{layoutSize: fitPct()}]});
    }
    svgRef = flowLayer(box);
    paintGeo(box, c, 0, d.course ? [{color: '#c9860a', pts: d.course}] : [],
             {mark: d.mark, label: d.label});
  }
  paint();
  c.__relayout = paint;
  c.on('finished', function(){ if(svgRef) svgRef.classList.add('on'); });
  /* 首帧若容器还没量到尺寸（隐藏视图 / 布局未完成），900ms 后再校准一次 */
  setTimeout(function(){
    if((box.clientWidth || 0) + 'x' + (box.clientHeight || 0) !== fitLast) paint();
    if(svgRef) svgRef.classList.add('on');
  }, 900);

  var card = box.closest('.card'), ru = card ? card.querySelector('.ruler') : null;
  if(ru){
    ru.innerHTML =
      '<span class="lgs"><i class="lgc" style="background:' + CITY_CORE + '"></i>' +
      '黄河干流流经 9 市（' + (d.riverCities || []).map(function(x){
        return String(x).replace(/市$/, ''); }).join('、') + '）</span>' +
      '<span class="lgs"><i class="lgc" style="background:rgba(44,55,84,.85)"></i>其余 7 市</span>' +
      '<br/><span class="lgs">9 市高亮是<b>地理常识</b>，不代表这 9 市被测到、其他 7 市没有舆情；' +
      '本图<b>不作数值编码</b></span>';
  }
  return c;
};

/* ---- 流域总览：山东省 16 地市地图（自动聚焦 + 漫游缩放 + 悬停 / 点击详情）----

   为什么单独做一张：站内既有的「中国 → 山东 → 济南」三层图里，山东是 1/4 屏的小图、
   roam:false，16 个地市名挤在一起没法读，也接不住「落到哪个市」的追问。这张是它的下钻版：
     ① 首屏先把镜头放到**含河北 / 河南 / 安徽 / 江苏**的视野（让读者认出这是山东），
        停 2 秒后平滑推进到「全省刚好铺满」—— 聚焦级别由**全部边界顶点投影到像素后反算**，
        不是经纬度包围盒（后者把留白浪费在东西两端，菏泽 / 威海容易被切）；
     ② 填色＝微博正文<b>提及次数</b>（对数分 5 档，济南 300+ 与个位数地市同图必须压标度）；
     ③ 悬停出 tooltip，点击把详情锁进左下浮层（Esc 或点右上角 × 取消）；
     ④ 容器尺寸变了重算聚焦，1600 → 420 宽都能用。

   ⚠ 改这里之前先看这三条实测结论（回退必踩）：
     A. geo + series(geoIndex) 组合下，series.data[].itemStyle 与 geo.regions **都不给区域上色**
        （实测 0 像素），区域色只能由 visualMap 驱动；
     B. geo 绑定的 series **不会自动弹 tooltip**，必须 dispatchAction({type:'showTip'/'hideTip'})；
     C. GeoJSON 嵌套错位（Polygon 少一层）时地图照样画得出来，只有"按顶点求包络"会算错，
        表现为南部三市（枣庄 / 临沂 / 菏泽）被裁到画布外 —— sdnb.js 由
        dashboard_gen/_gen_sdnb_map.py 生成，改几何请改那个脚本。 */
R.sdcity = function(box, s){
  box.style.position = 'relative';
  if(!echarts.getMap('sdnb')){
    box.innerHTML = '<div class="note bad">缺少 sdnb.js（山东 16 地市 + 邻省边界），本图未渲染</div>';
    return null;
  }
  var d = s.d || {};
  var MEM = d.cities || {}, ADC = d.adcode || {}, PCP = d.provcp || {}, RIV = {};
  (d.river || []).forEach(function(x){ RIV[x] = 1; });
  var NAMES = Object.keys(MEM);
  var TOTAL = 0;
  NAMES.forEach(function(n){ TOTAL += (+MEM[n] || 0); });
  var RANK = {};
  NAMES.slice().sort(function(a, b){ return (+MEM[b] || 0) - (+MEM[a] || 0); })
       .forEach(function(n, i){ RANK[n] = i + 1; });

  var RAMP = ['#eae3cd', '#cfe0bd', '#a9cf9a', '#7fb877', '#4f9e5c'];   /* 低 → 高 */
  var OUT = '#e4ddcd';                        /* 邻省：暖灰，明显别于色阶任何一档 */
  var K_ALL = ['city', 'prov'], K_CITY = ['city'];
  /* 悬停/锁定时 ECharts 会额外画一个 emphasis 标签（默认色 #640000、默认 formatter 是全名），
     与散点画的短名叠在一起。show:false 实测无效（geo 与 series 两处都试过），
     只有把 formatter 置空才真的不画。 */
  function EMPTY(){ return ''; }

  function short(n){ return String(n).replace(/市$/, ''); }
  function val(n){ var v = MEM[n]; return (v == null || isNaN(v)) ? 0 : +v; }

  /* ---- 档位：把 log(提及+1) 取五分位点当断点，得到离散的 0..4 档 ----
     为什么用「离散档」当 data.value，而不是拿阈值直接写 visualMap.pieces：
     档数固定 5、城市只有 16 个，两者交给 piecewise 映射后图例边界不会和数据打架。 */
  var _brk = null;
  function breaks(){
    if(_brk) return _brk;
    var vs = NAMES.map(function(n){ return Math.log(val(n) + 1); }).sort(function(a, b){ return a - b; });
    _brk = [];
    for(var i = 4; i >= 1; i--){
      var pos = i / 5 * (vs.length - 1), lo = Math.floor(pos), hi = Math.ceil(pos), f = pos - lo;
      var t = (lo === hi) ? vs[lo] : vs[lo] * (1 - f) + vs[hi] * f;
      _brk.push(Math.max(1, Math.round(Math.exp(t) - 1)));      /* 降序：b0 最大 */
    }
    for(var j = 0; j < _brk.length - 1; j++){ if(_brk[j] <= _brk[j + 1]) _brk[j + 1] = _brk[j] - 1; }
    return _brk;
  }
  function TIER(n){
    var b = breaks(), v = val(n);
    return v >= b[0] ? 4 : v >= b[1] ? 3 : v >= b[2] ? 2 : v >= b[3] ? 1 : 0;
  }
  function pieces(){ return [0, 1, 2, 3, 4].map(function(i){ return {value: i, color: RAMP[i]}; }); }

  function ringsOf(g){
    return g.type === 'Polygon' ? g.coordinates : Array.prototype.concat.apply([], g.coordinates);
  }
  function feats(){
    var m = echarts.getMap('sdnb');
    return (m && m.geoJSON && m.geoJSON.features) || [];
  }
  /* 地市标签的逐市微调：少数据点（济南 / 淄博 / 泰安 / 聊城 / 济宁 / 枣庄）在省图里挨得近，
     统一"点在中心、字在上方"会让字挤成一团；这里只挪文字、不挪点。 */
  var LABFIX = {'淄博市': [9, -3], '泰安市': [-7, 6], '聊城市': [-9, 0],
                '德州市': [-7, -2], '济宁市': [-7, 2], '枣庄市': [-4, 8]};
  function cityPts(){
    var out = [];
    feats().forEach(function(f){
      var p = f.properties || {};
      if(p.kind !== 'city' || !p.cp) return;
      out.push({name: p.name, value: p.cp,
                label: LABFIX[p.name] ? {offset: LABFIX[p.name]} : {}});
    });
    return out;
  }

  var c = initChart(box);
  c.setOption(base({
    tooltip: {backgroundColor: 'rgba(255,253,248,.96)', borderColor: C.line,
      textStyle: {color: C.fg, fontSize: 12},
      formatter: function(p){
        if(PCP[p.name]) return '<span style="color:#85735d">' + p.name +
          '：邻省，仅作区位参照，不参与统计</span>';
        if(!MEM.hasOwnProperty(p.name)) return '';
        var v = val(p.name);
        return '<b>' + short(p.name) + '</b>' + (ADC[p.name] ? '　区划代码 ' + ADC[p.name] : '') +
               '<br/>微博正文提及：<b>' + raw(v) + '</b> 次' +
               (TOTAL ? '（占 16 市合计 ' + pct(v, TOTAL) + '，第 ' + RANK[p.name] + ' 位）' : '') +
               '<br/>' + (RIV[p.name] ? '<span style="color:#c9860a">黄河干流流经</span>'
                                      : '<span style="color:#85735d">黄河干流不经</span>') +
               '<br/><span style="color:#85735d">提及＝正文出现该市名的次数，非地市级采集粒度</span>';
      }},
    visualMap: {type: 'piecewise', show: false, seriesIndex: 0, pieces: pieces(),
      outOfRange: {color: OUT}},
    geo: {map: 'sdnb', roam: true, zoom: 1, center: null,
      scaleLimit: {min: 0.6, max: 22},
      itemStyle: {areaColor: OUT, borderColor: '#ffffff', borderWidth: 1},
      /* 区域名**不由 geo.label 画**：geo 标签的位置取的是 ECharts 自己算的"标签点"，
         实测济南与淄博会被并到一处（相距十几像素）、且样式全局统一改不了。
         改成下面两个静默散点系列自己画文字 —— 位置＝各市在 DataV 里的 center，
         偏移可在 LABFIX 里逐市微调，必要时还能按缩放级别整批收起来。 */
      label: {show: false},
      emphasis: {itemStyle: {areaColor: '#f2c185'},
        label: {formatter: EMPTY},
        /* 必须显式关掉 emphasis 的标签：geo 的 emphasis 标签默认是开的，
           不关的话悬停/锁定某市时会在区域中心多冒出一个全名（"临沂市"），
           和散点画的短名（"临沂"）叠在一起。 */
        label: {show: false}}},
    series: [
      {id: 'sdfill', type: 'map', geoIndex: 0,
       data: NAMES.map(function(n){ return {name: n, value: TIER(n)}; }),
       label: {show: false},
       /* ⚠ series 的 emphasis.label 与 geo 的**不是同一处配置**：geo 那边关掉了，
          series 这边不关，悬停 / 锁定城市时照样会冒出一个全名（"临沂市"）压在散点短名上。
          itemStyle 这里不放 —— 高亮填色仍由 geo.emphasis 给（series 改不动 geo 的填色）。 */
       emphasis: {label: {formatter: EMPTY}}},
      /* 地市：点 + 名（点＝DataV 给的市行政中心，正文提及值在 tooltip 里） */
      {id: 'sdcitylab', type: 'scatter', coordinateSystem: 'geo', geoIndex: 0,
       data: cityPts(), symbol: 'circle', symbolSize: 5,
       itemStyle: {color: '#2f6b45', borderColor: 'rgba(255,255,255,.95)', borderWidth: 1.2},
       label: {show: true, position: 'top', distance: 3,
         formatter: function(p){ return short(p.name); },
         color: '#3f3226', fontSize: 11, fontWeight: 600,
         textShadowColor: 'rgba(255,255,255,.95)', textShadowBlur: 3},
       emphasis: {label: {formatter: EMPTY}},
       labelLayout: {hideOverlap: true},
       tooltip: {show: false}, z: 4},
      /* 邻省名：**不能靠 geo.label 给**（同一样式改不了颜色），改挂一个静默散点画文字，
         就能单独配色；tooltip 一并关掉，避免误以为邻省也参与统计。 */
      {id: 'sdprovlab', type: 'scatter', coordinateSystem: 'geo', geoIndex: 0, silent: true,
       data: Object.keys(PCP).map(function(n){ return {name: n, value: PCP[n]}; }),
       symbolSize: 1, itemStyle: {color: 'transparent'},
       label: {show: true, position: 'inside', formatter: function(p){ return p.name; },
         color: '#a08a6c', fontSize: 11,
         textShadowColor: 'rgba(255,255,255,.9)', textShadowBlur: 3},
       tooltip: {show: false}, z: 3}
    ]
  }));

  /* ---------- 聚焦：全部边界顶点投影到像素求包络，再反算 center / zoom ---------- */
  var curZoom = 1, curCenter = null, anim = null;
  function extent(kinds){
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, n = 0;
    feats().forEach(function(f){
      if(kinds.indexOf((f.properties || {}).kind) < 0) return;
      ringsOf(f.geometry).forEach(function(ring){
        ring.forEach(function(p){
          var px = c.convertToPixel({geoIndex: 0}, p);
          if(!px) return;
          n++;
          if(px[0] < x0) x0 = px[0];
          if(px[0] > x1) x1 = px[0];
          if(px[1] < y0) y0 = px[1];
          if(px[1] > y1) y1 = px[1];
        });
      });
    });
    if(!n) return null;
    return {c: c.convertFromPixel({geoIndex: 0}, [(x0 + x1) / 2, (y0 + y1) / 2]),
            w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0)};
  }
  function fitTo(kinds, pad){
    var e = extent(kinds);
    if(!e) return null;
    var W = box.clientWidth || 0, H = box.clientHeight || 0;
    if(!W || !H) return null;
    var z = curZoom * Math.min(W * pad / e.w, H * pad / e.h);
    return {center: e.c, zoom: Math.max(0.6, Math.min(22, z))};
  }
  function apply(st){
    if(!st) return;

    c.setOption({geo: {center: st.center, zoom: st.zoom}});
  }

  /* ---- 地市名的显隐：判据用「山东在屏幕上的实际像素宽度」而不是 zoom ----
     zoom 是相对量（1600px 宽与 420px 宽下，同一个 zoom 差好几倍的实际大小），
     用 zoom 当阈值会导致窄屏明明已经聚焦、名字却被收掉。
     宽度 < 340px 时 16 个名字必然糊在一起，此时收掉，靠 tooltip 给名字。 */
  var LAB_MINW = 340, labOn = null;
  function syncLabels(){
    var e = extent(K_CITY);
    if(!e) return;
    var on = e.w >= LAB_MINW;
    if(on === labOn) return;
    labOn = on;
    /* 点和字一起收：视野拉远时 16 个点缩成一层噪点，反而干扰读邻省轮廓 */
    /* 按 id 更新（不要按索引塞空对象 {}）：塞 {} 会连带重置 series[0] 的 emphasis 配置，
       表现是悬停时那个红色的全名标签又回来了。 */
    c.setOption({series: [{id: 'sdcitylab', symbolSize: on ? 5 : 0, label: {show: on}}]});
  }
  var _labT = null;
  c.on('georoam', function(){
    if(_labT) clearTimeout(_labT);
    _labT = setTimeout(function(){ _labT = null; syncLabels(); }, 120);
  });
  function ease(t){ return 1 - Math.pow(1 - t, 3); }
  function glide(to, ms){
    if(anim){ cancelAnimationFrame(anim); anim = null; }
    if(!to) return;
    var reduce = false;
    try{ reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    if(reduce || !ms){ apply(to); return; }
    var z0 = curZoom, c0 = curCenter || to.center, t0 = Date.now();
    (function step(){
      var t = Math.min(1, (Date.now() - t0) / ms), k = ease(t);
      apply({zoom: z0 + (to.zoom - z0) * k,
             center: [c0[0] + (to.center[0] - c0[0]) * k, c0[1] + (to.center[1] - c0[1]) * k]});
      anim = t < 1 ? requestAnimationFrame(step) : null;
      if(!anim) syncLabels();                 /* 动画停下的那一帧再决定名字显不显示 */
    })();
  }

  /* 首屏：含邻省的宽视野（一眼认出这是山东及周边） */
  apply(fitTo(K_ALL, 0.84) || {center: [118.0, 36.4], zoom: 1.2});
  syncLabels();
  /* 2 秒后自动聚焦到省域（全省刚好铺满画布） */
  var _autoT = setTimeout(function(){ lastKinds = K_CITY; glide(fitTo(K_CITY, 0.90), 1100); }, 2000);

  /* ---------- 悬停 / 点击详情 ---------- */
  var pinned = null, hideT = null, pinEl = null;
  function drawPin(){
    if(pinEl){ pinEl.parentNode.removeChild(pinEl); pinEl = null; }
    if(!pinned) return;
    var n = pinned, v = val(n);
    pinEl = el('div', 'sdpin',
      '<div class="sdhd">' + short(n) +
        '<span class="sdx" title="取消锁定（Esc）">×</span></div>' +
      (ADC[n] ? '行政区划代码　<b>' + ADC[n] + '</b><br/>' : '') +
      '微博正文提及　<b>' + raw(v) + '</b> 次<br/>' +
      '占 16 市合计　<b>' + pct(v, TOTAL) + '</b>　（第 <b>' + RANK[n] + '</b> 位）<br/>' +
      '黄河干流　<b>' + (RIV[n] ? '流经' : '不经') + '</b>' +
      '<br/><span style="color:#85735d">提及＝正文出现该市名的次数，不是地市级采集结果</span>');
    var x = pinEl.querySelector('.sdx');
    if(x) x.onclick = function(ev){ ev.stopPropagation(); pinned = null; drawPin(); };
    box.appendChild(pinEl);
  }
  c.on('mouseover', function(p){
    if(!MEM.hasOwnProperty(p.name)) return;
    if(hideT){ clearTimeout(hideT); hideT = null; }
    c.dispatchAction({type: 'showTip', seriesIndex: 0, name: p.name});
  });
  c.on('mouseout', function(){
    if(hideT) clearTimeout(hideT);
    hideT = setTimeout(function(){ c.dispatchAction({type: 'hideTip'}); }, 90);
  });
  c.on('click', function(p){
    if(!MEM.hasOwnProperty(p.name)){ pinned = null; drawPin(); return; }
    pinned = p.name;
    drawPin();
    c.dispatchAction({type: 'showTip', seriesIndex: 0, name: p.name});
  });
  window.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && pinned){ pinned = null; drawPin(); }
  });

  /* ---------- 控制条：聚焦全省 / 周边视野 / 重播聚焦动画 ---------- */
  var lastKinds = K_CITY, lastPad = 0.90;
  function refit(ms){ glide(fitTo(lastKinds, lastPad), ms == null ? 900 : ms); if(!ms) syncLabels(); }
  var ctl = el('div', 'sdctl');
  var bCity = el('button', 'on', '聚焦全省'), bAll = el('button', null, '周边视野');
  bCity.title = '把山东省 16 地市刚好铺满画布';
  bAll.title = '缩小到含河北 / 河南 / 安徽 / 江苏 的视野';
  function pick(btn, kinds, pad){
    bCity.className = (kinds === K_CITY) ? 'on' : '';
    bAll.className = (kinds === K_CITY) ? '' : 'on';
    lastKinds = kinds; lastPad = pad;
    clearTimeout(_autoT);
    glide(fitTo(kinds, pad), 900);
  }
  bCity.onclick = function(){ pick(bCity, K_CITY, 0.90); };
  bAll.onclick = function(){ pick(bAll, K_ALL, 0.84); };
  ctl.appendChild(bCity); ctl.appendChild(bAll);
  box.appendChild(ctl);

  /* ---------- 尺寸变化：resize 后重算聚焦（与站内其它渲染器同一套 __relayout 约定）-------- */
  c.__relayout = function(){ c.resize(); refit(0); };
  /* 首帧容器可能还没量到尺寸（视图刚入树），900ms 后兜底校准一次 */
  setTimeout(function(){ c.resize(); refit(0); }, 900);

  /* ---------- 卡下图例 / 口径 ---------- */
  var card = box.closest('.card'), ru = card ? card.querySelector('.ruler') : null;
  if(ru){
    var b = breaks();
    var segs = [['≥ ' + raw(b[0]), RAMP[4]],
                [raw(b[1]) + '–' + raw(Math.max(b[0] - 1, b[1])), RAMP[3]],
                [raw(b[2]) + '–' + raw(Math.max(b[1] - 1, b[2])), RAMP[2]],
                [raw(b[3]) + '–' + raw(Math.max(b[2] - 1, b[3])), RAMP[1]],
                ['≤ ' + raw(Math.max(b[3] - 1, 0)), RAMP[0]]];
    ru.innerHTML =
      '<span class="lgs"><b>正文提及次数</b>（微博正文出现该市名的次数）</span>　' +
      segs.map(function(z){
        return '<span class="lgs"><i class="lgc" style="background:' + z[1] + '"></i>' + z[0] + '</span>';
      }).join('') +
      '　<span class="lgs"><i class="lgc" style="background:' + OUT + '"></i>邻省（河北 / 河南 / 安徽 / 江苏，只作区位参照）</span>' +
      '<br/><span class="lgs">档位按<b>对数五分位</b>划分（极差太大，线性归一会把除头部外的地市全压到最淡一档）· ' +
      '本图<b>不是地市级采集结果</b>：库里没有地市字段，提及数由<b>正文关键词</b>命中得到（口径见「口径与方法」）。' +
      '悬停看数值，点击可锁定左下详情；右上角两个按钮切换「全省 / 含邻省」视野，滚轮或拖拽可自行缩放。</span>';
  }
  return c;
};

/* ---- 首页总览：济南区位三层地图（中国 → 山东 → 济南）----
   布局按要求：**中国地图在最上方；济南地图在左下；山东地图在右下**。

   为什么是「一张卡片装三张图」：全站栅格是 3 列（.grid: repeat(3,1fr)），
   最小宽度单位是 1/3，拿不到「左右各半」；所以三张子图放进同一张 w3 卡片内，
   用 inner grid 自己排「上一下二」，才能精确满足左右下三分之二的分栏要求。

   三张子图各自独立 ECharts 实例（沿用 R.rivermap / R.sdmap 的等比缩放算法：
   layoutSize 以容器短边为基准，按「墨迹宽度上限 = min(W*K, H*K/AR)」反算，
   否则宽而矮的容器会把地图压扁或把东西两端切掉）。

   ⚠ 三者**口径不同，禁止混读**（图例与 tooltip 分别写明）：
     中国图 = 微博**发布地区（作者 IP 属地）**计数，省级粒度
     山东图 = 微博**正文提及**各地市次数（本项目无地市级 IP 数据）
     济南图 = 微博**正文提及**各区县次数（合计仅十余条，样本稀薄，不代表区县热度）

   返回**复合实例**（resize / __relayout / getDataURL 同时作用于三张图），
   使框架的窗口 resize 钩子与 PNG 导出继续可用；导出为「上一下二」拼合图。 */
R.jnmaps = function(box, s){
  var d = s.d || {};
  var PROV = d.prov || {}, SD = d.sd || {}, JN = d.jn || {}, M = d.meta || {};
  var RULES = d.rules || {};
  var HEAT = MAP_PALS.heat;

  if(!R.jnmaps._css){                     /* 样式只注入一次 */
    var st = document.createElement('style');
    st.textContent =
      '.jnm{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}' +
      '.jnm .jrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}' +
      '.jnm .jcell{position:relative;min-height:0;border:1px solid rgba(45,120,75,.22);' +
        'border-radius:10px;background:rgba(255,255,255,.55);overflow:hidden}' +
      '.jnm .jcell .jbox{position:absolute;inset:0}' +
      '.jnm .jtag{position:absolute;left:9px;top:7px;z-index:3;font-size:10.5px;color:#5c4b3a;' +
        'background:rgba(255,253,248,.74);border:1px solid rgba(120,95,60,.24);' +
        'border-radius:6px;padding:1px 7px;pointer-events:none;line-height:1.5}' +
      /* 顶部：中国图是宽图（墨迹约 1.6:1），放进更宽的卡片必然左右留白 ——
         把留白位置放「济南相关」的数字与讨论来源，比让地图孤零零居中更可用 */
      '.jnm .jtop{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,268px) minmax(0,1fr)}' +
      '.jnm .jtop .jbox{position:relative;inset:auto;min-height:0}' +
      '.jnm .jside{padding:30px 10px 10px 12px;overflow:auto;border-right:1px solid rgba(120,95,60,.14)}' +
      '.jnm .jsh{font-size:12px;color:#2b2118;font-weight:600;margin-bottom:6px}' +
      '.jnm .jnum{font-size:20px;font-weight:700;color:#3f8f63;line-height:1.2}' +
      '.jnm .jnum small{font-size:11.5px;color:#85735d;font-weight:400;margin-left:4px}' +
      '.jnm .jbar{display:grid;grid-template-columns:52px 1fr 44px;align-items:center;' +
        'gap:6px;font-size:11px;color:#5c4b3a;margin:3px 0}' +
      '.jnm .jbar i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,#3f8f63,#3f8f63)}' +
      '.jnm .jbar b{color:#2b2118;font-weight:600;text-align:right}' +
      '.jnm .jnw{font-size:10.5px;color:#85735d;line-height:1.7;margin-top:8px}' +
      '@media(max-width:900px){.jnm .jrow2{grid-template-columns:1fr}' +
        '.jnm .jtop{grid-template-columns:1fr}.jnm .jside{display:none}}';

    R.jnmaps._css = 1;
  }

  /* 取色：**对数压缩**。地市提及量级差异极大（济南 314 / 其余个位数），

  /* v17：浅底舞台（见 .ch.mapstage.maplight）配套 ——

  function painter(vals){
    var mx = 1;
    vals.forEach(function(v){ if(v > mx) mx = v; });
    return function(v){
      if(!v) return 'rgba(146,158,170,.42)';        /* 0 值：浅灰蓝，明显别于色阶任何一档 */
      var t = Math.log(v + 1) / Math.log(mx + 1);
      var i = Math.max(0, Math.min(HEAT.length - 1, Math.round(t * (HEAT.length - 1))));
      return HEAT[i];
    };
  }
  var cnPaint = painter(Object.keys(PROV).map(function(k){ return PROV[k]; }));
  var sdPaint = painter(Object.keys(SD).map(function(k){ return SD[k]; }));
  var jnPaint = painter(Object.keys(JN).map(function(k){ return JN[k]; }));

  /* 共源优先（青海＝长江正源、四川西北有黄河流过），与 R.rivermap 同一套判定。
     v17：四色统一取 BASIN_MEMC —— 之前 共源 与 长江 都写死成同一个绿，
     导致青海、四川在图上与"只属长江"的省无法分辨（用户报的字段名不实）。 */
  var MEM = d.mem || {};
  var YZ = {}, YL = {}, SH = {};
  (MEM['长江'] || []).forEach(function(p){ YZ[p] = 1; });
  (MEM['黄河'] || []).forEach(function(p){ YL[p] = 1; });
  (MEM['共源'] || []).forEach(function(p){ SH[p] = 1; });
  var MEMC = {'长江': BASIN_MEMC['长江'], '黄河': BASIN_MEMC['黄河'],
              '共源': BASIN_MEMC['共源'], '非流域': 'rgba(120,133,146,.85)'};
  function memOf(p){
    if(SH[p]) return '共源';
    if(YZ[p]) return '长江';
    if(YL[p]) return '黄河';
    return '非流域';
  }
  function mn(x){ return String(x).replace(/市$/, ''); }
  var RIVSD = {};
  (d.sdRiverCities || []).forEach(function(x){ RIVSD[x] = 1; RIVSD[mn(x)] = 1; });

  /* ---- DOM：上（中国 + 济南相关数字）/ 下二（左济南 · 右山东）---- */
  var wrap = el('div', 'jnm');
  var cTop = el('div', 'jcell');
  cTop.appendChild(el('div', 'jtag', '① 中国 · 发布地区（IP 属地）省级声量'));
  var gTop = el('div', 'jtop');
  var side = el('div', 'jside');
  (function(){
    /* d.jnSrc 已由 build_jinan_map.py 过滤为**仅真实省级行政区**：
       「未知」/空/境外不再作为"地区"挤进榜单，改由 d.jnMiss 以脚注单列。
       注：不能再用 src[0] 冒充「山东」—— 榜单顺序取决于数据，必须显式按名查找。 */
    var ALL = d.jnSrc || [];
    var src = ALL.slice(0, 6);
    var MS = d.jnMiss || {};
    var mx = 1;
    src.forEach(function(z){ if(z[1] > mx) mx = z[1]; });
    var sdRow = ALL.filter(function(z){ return z[0] === '山东'; })[0] || ['山东', 0];
    var miss = (MS.unknown || 0) + (MS.other || 0);
    side.innerHTML =
      '<div class="jsh">济南相关 · 关键数字</div>' +
      '<div class="jnum">' + raw(M.jnTotal) + '<small>条微博提到「济南」</small></div>' +
      '<div class="jnw">占全库 ' + raw(M.total) + ' 条的 <b style="color:#3f8f63">' +
        pct(M.jnTotal, M.total) + '</b></div>' +
      '<div class="jsh" style="margin-top:12px">讨论济南的微博 · 发布地区（省级）Top' + src.length + '</div>' +
      src.map(function(z){
        return '<div class="jbar"><span>' + z[0] + '</span>' +
               '<i style="width:' + Math.max(6, Math.round(z[1] / mx * 100)) + '%"></i>' +
               '<b>' + raw(z[1]) + '</b></div>';
      }).join('') +
      '<div class="jnw">发布地区＝作者 IP 属地（省级）。山东本地 <b>' + raw(sdRow[1]) + '</b> 条，' +
        '占提及总量 ' + pct(sdRow[1], M.jnTotal) + '，说明济南议题以本地关切为主、跨省扩散有限。</div>' +
      (miss ? '<div class="jnw">另有 <b>' + raw(miss) + '</b> 条发布地区缺失，' +
        '占 ' + pct(miss, M.jnTotal) + '（「未知」' + raw(MS.unknown || 0) + ' 条' +
        ((MS.other || 0) ? '、境外/无法归省 ' + raw(MS.other) + ' 条' : '') +
        '），非地点、不参与以上省级排行。</div>' : '');
  })();
  var bTop = el('div', 'jbox');
  gTop.appendChild(side); gTop.appendChild(bTop);
  cTop.appendChild(gTop);
  var cJn = el('div', 'jcell'), bJn = el('div', 'jbox');
  cJn.appendChild(el('div', 'jtag', '② 济南市 · 正文提及区县'));
  cJn.appendChild(bJn);
  var cSd = el('div', 'jcell'), bSd = el('div', 'jbox');
  cSd.appendChild(el('div', 'jtag', '③ 山东省 · 正文提及地市'));
  cSd.appendChild(bSd);
  var row2 = el('div', 'jrow2');
  row2.appendChild(cJn);                     /* 左：济南 */
  row2.appendChild(cSd);                     /* 右：山东 */
  cTop.style.flex = '1.15';
  wrap.appendChild(cTop); wrap.appendChild(row2);
  box.appendChild(wrap);

  /* ---- 等比缩放：按**图表容器实测尺寸**反算 layoutSize（百分比以短边为基准）----
     注意量的是 .jbox（真正的图表容器），不是含侧栏的整格，否则留白/裁切都会算错。 */
  var FIT_K = 0.94;
  function fitFor(elm, ar){
    var W = elm.clientWidth || 0, H = elm.clientHeight || 0;
    if(!W || !H) return '100%';
    var need = Math.min(W * FIT_K, H * FIT_K / ar);
    return (Math.round(need / Math.min(W, H) * 1000) / 10) + '%';
  }
  function shortName(x){ return String(x).replace(/市$/, ''); }
  function val(x){ return (x == null || isNaN(x)) ? 0 : +x; }

  function mkChart(cell, ar, opt){
    var box2 = cell.querySelector('.jbox');
    var c = initChart(box2);
    var last = '';
    function size(){ return (box2.clientWidth || 0) + 'x' + (box2.clientHeight || 0); }
    function apply(){
      opt.series[0].layoutSize = fitFor(box2, ar);
      c.setOption(base(opt));
      last = size();
    }
    apply();
    c.__relayout = function(){ if(size() !== last) apply(); };
    return c;
  }

  /* ---------- ① 中国图：填充＝省级声量；描边＝流域归属；干流与落点由 paintGeo 叠 ----
     高亮/描边一律走 data 里的 itemStyle/label（series-map 没有 geo.regions 选项，
     写了也不生效）。山东另给常显标签，便于一眼定位落地区域。 */
  /* 面积过小或邻省挨太近的省级行政区，把省名从几何中心推开，
     否则「北京/天津/河北」「沪苏浙」「港澳粤」会叠成一团。 */
  var CN_LOFF = {'北京': [0, -11], '天津': [15, 5], '上海': [15, 3],
                 '香港': [-7, 12], '澳门': [-17, 11], '台湾': [14, 0],
                 '海南': [0, 9], '宁夏': [-1, 0]};
  var cnData = Object.keys(PROV).map(function(p){
    var k = memOf(p);
    var lb = CN_LOFF[p] ? {offset: CN_LOFF[p]} : {};
    if(p === '山东'){
      lb.color = '#0b3d1f';                        /* 浅绿舞台上改用深墨绿 */
      lb.fontWeight = 'bold';
      lb.fontSize = 11.5;
      lb.textBorderColor = 'rgba(255,255,255,.92)';  /* 白描边（深底时是黑描边） */
      lb.textBorderWidth = 2.6;
      /* 省名与落点合成一个标签：否则「山东」二字与济南落点文字会叠在一起 */
      lb.formatter = '山东 · 济南';
    }
    return {name: p, value: PROV[p], itemStyle: {
      areaColor: cnPaint(PROV[p]),
      borderColor: MEMC[k],
      borderWidth: k === '非流域' ? 1 : 2}, label: lb};
  });
  var cCn = mkChart(cTop, 0.74, {
    tooltip: {backgroundColor: 'rgba(255,253,248,.96)', borderColor: C.line,
      textStyle: {color: C.fg, fontSize: 12},
      formatter: function(p){
        var v = val(PROV[p.name]);
        var k = memOf(p.name);
        var extra = (p.name === '山东')
          ? '<br/><span style="color:#c9860a">落地区域（齐鲁师范学院所在省）</span>' : '';
        return '<b>' + p.name + '</b>　<span style="color:' + MEMC[k] + '">' + k + '</span>' +
               '<br/>发布地区声量：<b>' + raw(v) + '</b> 条' +
               (v ? '（占全库 ' + pct(v, M.total) + '）' : '') + extra +
               '<br/><span style="color:#85735d">描边色＝流域归属；' + (RULES.china || '') + '</span>';
      }},
    series: [{
      type: 'map', map: 'china', roam: false, selectedMode: false,
      layoutCenter: ['50%', '50%'], layoutSize: '100%',
      /* 常显省名：浅字 + 深描边，压在冷暖填色上仍可读。
         重叠时先沿 Y 轴错开（moveOverlap），实在放不下才隐藏（hideOverlap）；
         被隐藏的省名与全部数值都能在 tooltip 里读到。 */
      /* v17 浅底配套：省名改深墨字 + 白描边（深底时是白字 + 黑描边） */
      label: {show: true, color: 'rgba(14,40,26,.96)', fontSize: 10.5,
        textBorderColor: 'rgba(255,255,255,.92)', textBorderWidth: 2.4,
        formatter: function(q){ return window.BASINSCOPE_I18N ? window.BASINSCOPE_I18N.geo(q.name) : q.name; }},
      labelLayout: {moveOverlap: 'shiftY', hideOverlap: true},
      itemStyle: {borderColor: 'rgba(120,133,146,.85)', borderWidth: 1,
        areaColor: 'rgba(146,158,170,.42)'},
      emphasis: {label: {show: true, color: '#0b3d1f', fontWeight: 'bold', fontSize: 11.5},
        itemStyle: {borderColor: '#0b3d1f', borderWidth: 1.8,
          shadowBlur: 14, shadowColor: 'rgba(45,120,75,.45)'}},
      data: cnData,
      /* 济南：落点标记（只留脉冲点与符号，文字已并入「山东 · 济南」标签） */
      markPoint: {silent: true, symbolSize: 9, label: {show: false},
        itemStyle: {color: '#c9860a', borderColor: '#fff', borderWidth: 1.2},
        data: [{name: '济南', coord: [117.000923, 36.675807]}]}
    }]
  });

  /* ---------- ② 济南图（左下）：区县正文提及 ---------- */
  var jnData = Object.keys(JN).map(function(k){
    return {name: k, value: JN[k], itemStyle: {areaColor: jnPaint(JN[k])}};
  });
  var jnHit = Object.keys(JN).filter(function(k){ return JN[k] > 0; }).length;
  var cJn = mkChart(cJn, 0.88, {
    tooltip: {backgroundColor: 'rgba(255,253,248,.96)', borderColor: C.line,
      textStyle: {color: C.fg, fontSize: 12},
      formatter: function(p){
        var v = val(JN[p.name]);
        return '<b>' + p.name + '</b><br/>正文提及：<b>' + v + '</b> 条' +
               (v ? '' : '<br/><span style="color:#85735d">本批样本中无提及</span>') +
               '<br/><span style="color:#85735d">' + (RULES.jn || '') + '</span>';
      }},
    series: [{
      type: 'map', map: 'jinan', roam: false, selectedMode: false,
      layoutCenter: ['50%', '50%'], layoutSize: '100%',
      label: {show: true, color: 'rgba(14,40,26,.96)', fontSize: 9.5,
        textBorderColor: 'rgba(255,255,255,.92)', textBorderWidth: 2.2,
        formatter: function(q){
          var v = val(JN[q.name]);
          return q.name + (v ? ' ' + v : '');
        }},
      labelLayout: {hideOverlap: true},
      itemStyle: {borderColor: 'rgba(120,133,146,.72)', borderWidth: 1,
        areaColor: 'rgba(146,158,170,.42)'},
      emphasis: {label: {color: '#0b3d1f', fontWeight: 'bold'},
        itemStyle: {borderColor: '#0b3d1f', borderWidth: 1.6,
          shadowBlur: 12, shadowColor: 'rgba(45,120,75,.45)'}},
      data: jnData,
      markPoint: {silent: true, symbolSize: 8, label: {show: false},
        itemStyle: {color: '#c9860a', borderColor: '#fff', borderWidth: 1.1},
        data: [{name: '济南', coord: [117.000923, 36.675807]}]}
    }]
  });

  /* ---------- ③ 山东图（右下）：填充＝地市正文提及；描边＝黄河干流流经（合并原 hm2）----
     原 hm2 是纯区位图（不作数值编码）；现合并到这里：面积冷暖读提及量，
     琥珀描边标出黄河干流流经的 9 市（地理常识，不是"被测到"的意思）。 */
  var sdData = Object.keys(SD).map(function(k){
    var it = {name: k, value: SD[k], itemStyle: {areaColor: sdPaint(SD[k])}};
    if(RIVSD[k] || RIVSD[shortName(k)]){
      it.itemStyle.borderColor = 'rgba(255,196,90,.95)';
      it.itemStyle.borderWidth = 1.8;
    }
    if(k === '济南市'){
      it.itemStyle.borderColor = '#c9860a';
      it.itemStyle.borderWidth = 2.4;
      it.label = {show: true, color: '#8a4b06', fontWeight: 'bold',
                  textBorderColor: 'rgba(255,255,255,.9)', textBorderWidth: 2.2};
    }
    return it;
  });
  var cSd = mkChart(cSd, 0.676, {
    tooltip: {backgroundColor: 'rgba(255,253,248,.96)', borderColor: C.line,
      textStyle: {color: C.fg, fontSize: 12},
      formatter: function(p){
        var v = val(SD[p.name]);
        var nm = shortName(p.name);
        var isR = !!(RIVSD[p.name] || RIVSD[nm]);
        return '<b>' + nm + '</b>' +
               (p.name === '济南市' ? '　<span style="color:#c9860a">省会</span>' : '') +
               (isR ? '　<span style="color:#b45309">黄河干流流经</span>' : '') +
               '<br/>正文提及：<b>' + v + '</b> 条' +
               (M.sdIp ? '<br/>全省 IP 属地声量 ' + raw(M.sdIp) + ' 条（省级口径）' : '') +
               '<br/><span style="color:#85735d">琥珀描边＝黄河干流流经（地理常识）；' +
               (RULES.sd || '') + '</span>';
      }},
    series: [{
      type: 'map', map: 'shandong', roam: false, selectedMode: false,
      layoutCenter: ['50%', '50%'], layoutSize: '100%',
      label: {show: true, color: 'rgba(14,40,26,.96)', fontSize: 10.5,
        textBorderColor: 'rgba(255,255,255,.92)', textBorderWidth: 2.4,
        formatter: function(q){ return shortName(q.name); }},
      itemStyle: {borderColor: 'rgba(120,133,146,.72)', borderWidth: 1,
        areaColor: 'rgba(146,158,170,.42)'},
      emphasis: {label: {color: '#0b3d1f', fontWeight: 'bold'},
        itemStyle: {borderColor: '#0b3d1f', borderWidth: 1.8,
          shadowBlur: 14, shadowColor: 'rgba(45,120,75,.45)'}},
      data: sdData
    }]
  });

  var ALL = [cCn, cJn, cSd];

  /* ---------- 叠加地理图层（复用全站既有 paintGeo / flowLayer）----------
     中国图：两江干流示意走向（原 hm1 的图层）；山东图：黄河入海段 + 济南落点脉冲（原 hm2 的图层）。
     paintGeo 内部自建/复用 .flowlayer，并用 flowMarks 整体重写其内容 → 重复调用不会叠加多份折线。
     必须放在 setOption 之后：坐标系未就绪时 convertToPixel 换算不出像素。 */
  /* opts：线宽等样式覆盖（市一级地图比省图小，沿用省图的 11/3.2 会显得过粗） */
  function overGeo(box2, c, lines, mk, opts){
    function paint(){
      var svg = flowLayer(box2);
      paintGeo(box2, c, 0, lines, Object.assign({}, opts || {}, mk || {}));
      svg.classList.add('on');
    }
    paint();
    setTimeout(paint, 900);
    var old = c.__relayout;
    c.__relayout = function(){ if(old) old(); paint(); };
    c.on('finished', function(){ flowLayer(box2).classList.add('on'); });
  }
  overGeo(bTop, cCn, d.rivers || [], {});
  /* ② 济南市：黄河穿城段（动态线沿用 flowMarks 的白色虚线动画，与山东图同一套） */
  overGeo(bJn, cJn, d.jnCourse ? [{color: '#c9860a', pts: d.jnCourse}] : [], {},
          {glowW: 8, coreW: 2.4, glowOp: .34});
  overGeo(bSd, cSd, d.sdCourse ? [{color: '#c9860a', pts: d.sdCourse}] : [],
          {mark: d.mark, label: '济南'});

  /* ---------- 复合实例：让框架的 resize 钩子与 PNG 导出对三张图都生效 ---------- */
  var api = {
    resize: function(){ ALL.forEach(function(c){ c.resize(); }); },
    __relayout: function(){ ALL.forEach(function(c){ if(c.__relayout) c.__relayout(); }); },
    __composite: ALL,
    getDataURL: function(opt){
      opt = opt || {};
      var pr = opt.pixelRatio || 2, bgc = opt.backgroundColor || '#f7f2e8';
      var W = box.clientWidth || 1000, H = box.clientHeight || 560;
      var cv = document.createElement('canvas');
      cv.width = Math.round(W * pr); cv.height = Math.round(H * pr);
      var x = cv.getContext('2d');
      x.fillStyle = bgc; x.fillRect(0, 0, cv.width, cv.height);
      var pad = Math.round(8 * pr), gap = Math.round(10 * pr);
      var topH = Math.round((cv.height - 2 * pad - gap) * 0.555);
      var botY = pad + topH + gap, botH = cv.height - botY - pad;
      var halfW = Math.round((cv.width - 2 * pad - gap) / 2);
      function put(c, cx, cy, cw, ch){
        if(!c || !c.getRenderedCanvas) return;
        var src = c.getRenderedCanvas({pixelRatio: pr, backgroundColor: bgc});
        var k = Math.min(cw / src.width, ch / src.height);
        var dw = src.width * k, dh = src.height * k;
        x.drawImage(src, cx + (cw - dw) / 2, cy + (ch - dh) / 2, dw, dh);
      }
      put(cCn, pad, pad, cv.width - 2 * pad, topH);
      put(cJn, pad, botY, halfW, botH);
      put(cSd, pad + halfW + gap, botY, halfW, botH);
      return cv.toDataURL('image/png');
    }
  };

  /* 图例条：三张图三套口径 + 两种编码（填充＝数值、描边＝流域归属/沿黄），逐条写明，
     避免"一个数读三张图"或者把描边当成数值。 */
  var card = box.closest('.card'), ru = card ? card.querySelector('.ruler') : null;
  if(ru){
    var SHL = (MEM['共源'] || []);
    var nYz = (MEM['长江'] || []).filter(function(p){ return SHL.indexOf(p) < 0; }).length;
    var nYl = (MEM['黄河'] || []).filter(function(p){ return SHL.indexOf(p) < 0; }).length;
    ru.innerHTML =
      /* 8 档色带里 HEAT[4] 已不是"高"（那是品红），高值端要取最后一档 */
      '<span class="lgs"><i class="lgc" style="background:' + HEAT[HEAT.length-1] + '"></i>填充＝声量/提及（越高越亮）</span>' +
      '<span class="lgs"><i class="lgc" style="background:' + HEAT[0] + '"></i>低（含 0）</span>' +
      '<span class="lgs"><i class="lgc" style="background:' + MEMC['长江'] + '"></i>描边·长江 ' + nYz + ' 省</span>' +
      '<span class="lgs"><i class="lgc" style="background:' + MEMC['黄河'] + '"></i>描边·黄河 ' + nYl + ' 省</span>' +
      '<span class="lgs"><i class="lgc" style="background:' + MEMC['共源'] + '"></i>描边·两江共源 ' +
      SHL.length + ' 省（' + SHL.join('、') + '）</span>' +
      '<span class="lgs"><i class="lgc" style="background:' + MEMC['非流域'] + '"></i>描边·非流域</span>' +
      '<span class="lgs"><i class="lgc" style="background:#ffc45a"></i>山东图描边＝黄河干流流经 9 市</span>' +
      '<span class="lgs"><i class="lgc" style="background:#c9860a"></i>济南（省会）</span>' +
      '<br/><span class="lgs">①中国图＝<b>发布地区（IP 属地）</b>省级计数（全库 ' + raw(M.total) +
      ' 条，山东 <b>' + raw(M.sdIp) + '</b> 条）　·　②③＝<b>正文提及</b>近似口径' +
      '（本项目无地市/区县 IP 数据）　·　流域合计 <b>' + (nYz + nYl + SHL.length) +
      '</b> 省（34 省级行政区口径，右下「南海诸岛」为附图）　·　江河走向为<b>示意折线</b>，非测绘数据</span>' +
      '<br/><span class="lgs">含「济南」的微博 <b>' + raw(M.jnTotal) + '</b> 条（占全库 ' +
      pct(M.jnTotal, M.total) + '）；济南各区县提及合计仅 <b>' + jnHit + '/12</b> 个区县有提及，' +
      '<b>样本稀薄、不代表区县热度</b>　·　' + (RULES.excluded || '') +
      '　·　' + (RULES.jnSrc || '') + '</span>';
  }
  return api;
};

/* ---- 流域传播态势：沿江上下游剖面（v8 重做，2026-10-02）----
   数据形态不变：s.d = {lanes:[{name, color, total, pts:[[省, 值], ...]}]}

   为什么推翻 v7 的「河流带状」：
   ① 圆面积编码把 1.55 倍的数值差画成 3.06 倍面积（直径线性拉伸 → 面积二次放大），
      且量程下限由最长的标签字符串（「内蒙古89」）反推 —— 尺度被文本绑架；
   ② 波浪轨道是写死的装饰曲线，偏偏与「黄河下游更高」的真实走势同向，
      会被读成量级变化；
   ③ 白色流光与圆内白色文字同色、且是全站唯一常驻动效 ——
      唯一在动的元素恰好不携带任何信息。

   v8 做法：位置编码（y = 声量）+ 沿岸序位（x = 上游 → 下游）+ 省均基线。
   · 位置编码允许非零起点，所以 64~99 这种窄区间也能读出高低差（圆面积不允许）；
   · 圆点大小恒定，不再二次编码；
   · 不画面积填充 —— 面积配非零起点会夸大基数，与位置编码自相矛盾；
   · N 条江各占一个面板，共用同一 y 刻度与同一 x 序位轴 → 跨江可直接比；
   · 全部静态（与 v13 全站静态化一致），动效只留 hover 放大。 */
R.flow = function(box, s){
  var d = s.d||{}, lanes = d.lanes||[], unit = (s.o&&s.o.unit)||'条';
  var c = initChart(box);
  if(!lanes.length) return c;
  var all = [];
  lanes.forEach(function(L){ L.pts.forEach(function(p){ all.push(+p[1] || 0); }); });
  var gmin = Math.min.apply(null, all), gmax = Math.max.apply(null, all);
  /* y 轴量程：留 12% 余量，再向外吸附到「好看的刻度」，别让最高点贴着顶 */
  var padv = Math.max(2, (gmax - gmin) * 0.10);
  var span = (gmax - gmin) + 2 * padv;
  var yStep = [1, 2, 5, 10, 20, 25, 50, 100].filter(function(z){ return span / z <= 5.5; })[0] || 100;
  var yMin = Math.floor((gmin - padv) / yStep) * yStep;
  var yMax = yMin + yStep * Math.ceil((gmax + padv - yMin) / yStep);
  var maxN = Math.max.apply(null, lanes.map(function(L){ return L.pts.length; }));
  var N = lanes.length;
  /* 面板纵向布局：每块 = 标题带 + grid + 省名标签带，整块堆叠。
     用「分块」而不是「grid 顶 + 相对偏移」，是为了保证第 2 块的标题带落在第 1 块
     省名标签**之下** —— 之前按 top-6.6% 取标题时两者正好压在同一行上。 */
  var padT = 2, padB = 2, gapP = 5, titleH = 5, labelH = 5;
  var ph = (100 - padT - padB - gapP * (N - 1)) / N - titleH - labelH;
  var blockH = ph + titleH + labelH + gapP;
  var grids = [], xAxes = [], yAxes = [], series = [], titles = [];
  function xf(names){
    /* x 是「沿岸序位」不是类目：两条江点数不同（12 vs 8），类目轴会把 8 个点摊满整幅、
       与 12 个点的面板错位。value 轴按序位定位，两面板「第 n 省」落在同一 x，可直接对齐读。 */
    return function(v){ var i = Math.round(v);
      return (i >= 1 && i <= names.length) ? names[i-1] : ''; };
  }
  lanes.forEach(function(L, i){
    var names = L.pts.map(function(p){ return p[0]; });
    var vals  = L.pts.map(function(p){ return +p[1] || 0; });
    var mean  = vals.reduce(function(a,b){ return a + b; }, 0) / (vals.length || 1);
    var last  = L.pts[names.length - 1];
    var pk = L.pts.reduce(function(a,b){ return (+b[1] > +a[1]) ? b : a; });
    var top = padT + i * blockH;
    grids.push({left:'3%', right:'3%', top:(top + titleH) + '%', height:ph + '%'});
    xAxes.push({gridIndex:i, type:'value', min:0, max:maxN + 1, interval:1,
      axisLine:{lineStyle:{color:C.line}}, axisTick:{show:false},
      splitLine:{show:true, lineStyle:{color:C.grid, type:[2,4]}},
      axisLabel:{color:C.fg3, fontSize:11, margin:10, formatter: xf(names)}});
    yAxes.push({gridIndex:i, type:'value', min:yMin, max:yMax, interval:yStep,
      axisLine:{show:false}, axisTick:{show:false},
      splitLine:{lineStyle:{color:C.grid}},
      /* 不设 axis name：ECharts 把 name 放在轴顶，会与面板标题首行叠字；
         单位在卡片副标题与图例条里已经写明。 */
      axisLabel:{color:C.fg3, fontSize:10.5}});
    series.push({name:L.name, type:'line', xAxisIndex:i, yAxisIndex:i,
      smooth:0.35, symbol:'circle', symbolSize:9, showSymbol:true, z:5,
      lineStyle:{width:2.6, color:L.color, cap:'round'},
      itemStyle:{color:L.color, borderColor:'#fffdf8', borderWidth:2},
      /* 刻意不画 areaStyle：面积配非零起点会夸大基数 */
      label:{show:true, position:'top', distance:7, color:C.fg, fontSize:11.5,
        fontWeight:600, formatter:function(q){ return raw(q.data.value[1]); }},
      emphasis:{scale:1.35, label:{fontSize:12.5}},
      markLine:{silent:true, symbol:'none',
        lineStyle:{color:'#b9a98f', width:1.2, type:[5,5]},
        label:{position:'insideEndTop', color:C.fg3, fontSize:10.5,
          formatter:'省均 ' + mean.toFixed(1)},
        data:[{yAxis: Math.round(mean * 10) / 10}]},
      data: L.pts.map(function(p, j){ return {name:p[0], value:[j + 1, +p[1] || 0]}; })});
    titles.push({top: top + '%', left:'3%',
      text:'{nm|' + L.name + '}  {mt|' + raw(L.total) + ' ' + unit + ' · ' + names.length +
           ' 省 · 省均 ' + mean.toFixed(1) + '}   {ex|上游 ' + L.pts[0][0] + ' ' + raw(L.pts[0][1]) +
           ' → 下游 ' + last[0] + ' ' + raw(last[1]) + ' ｜ 峰值 {pk|' + pk[0] + ' ' + raw(pk[1]) + '}}',
      textStyle:{rich:{
        nm:{fontSize:12.5, fontWeight:700, color:C.fg},
        mt:{fontSize:12, color:C.fg3},
        ex:{fontSize:11.5, color:C.fg3},
        pk:{fontSize:11.5, fontWeight:700, color:C.fg}}}});
  });
  c.setOption(base({
    title:titles, grid:grids, xAxis:xAxes, yAxis:yAxes, series:series,
    animation:false, animationDuration:0, animationDurationUpdate:0,
    tooltip:{trigger:'item', backgroundColor:'rgba(255,253,248,.95)', borderColor:C.line,
      textStyle:{color:C.fg, fontSize:12},
      extraCssText:'box-shadow:0 4px 16px rgba(60,50,35,.18);border-radius:8px',
      formatter:function(q){
        var L = lanes[q.seriesIndex] || lanes[0], v = q.data.value;
        return '<b>' + q.name + '</b>　<span style="color:' + L.color + '">' + L.name + '</span>' +
          '<br/>沿岸序位：第 ' + v[0] + ' / ' + L.pts.length + ' 省（上游 → 下游）' +
          '<br/>声量：<b>' + raw(v[1]) + '</b> ' + unit +
          '<br/>占该流域：<b>' + (v[1] / L.total * 100).toFixed(1) + '%</b>';
      }}
  }));
  var card = box.closest('.card'), ru = card ? card.querySelector('.ruler') : null;
  if(ru){
    ru.innerHTML = '<span class="lgs">纵轴 = 该省样本量（位置编码，' + lanes.length +
      ' 条江共用同一刻度，可直接横向比）· 虚线 = 该流域省均 · x 轴 = 沿岸序位（左＝上游，右＝入海口）</span>' +
      lanes.map(function(L){
        var vs = L.pts.map(function(p){ return +p[1] || 0; });
        var mean = vs.reduce(function(a,b){ return a + b; }, 0) / (vs.length || 1);
        return '<span class="lgs"><i class="lgc" style="background:'+L.color+'"></i>' +
               L.name+' <b>'+raw(L.total)+'</b> '+unit+'（'+L.pts.length+' 省，省均 '+mean.toFixed(1)+'）</span>';
      }).join('') +
      '　·　两江合计 <b>' + raw(lanes.reduce(function(a,z){ return a + z.total; }, 0)) + '</b> ' + unit;
  }
  return c;
};

R.wordcloud = function(box, s){
  /* 数据驱动词云：替代 static/*.png 静态图，可悬停 / 噪声词可开关。
     批次 1 起支持两种新模式（旧调用不受影响）：
       · 数据带分组与颜色 [[词, 频次, 组名, 色], ...] → 按事件簇着色而非按排名
       · o.click 给出回调名 → 点某个词时联动同视图内的事件簇面板
     批次 3（2026-10-06）起所有词都带**专业解释**：
       释义表由 word_glossary.py 注入 window.WCGLOSS，本函数只负责把
       词表 / 分层说明 / 度量口径交给渲染器，不在前端硬编码任何词义。 */
  if(!window.WC){
    box.innerHTML = '<div class="note bad">词云渲染器未加载</div>';
    return null;
  }
  var o = s.o||{};
  var G = window.WCGLOSS || {};
  var res = WC.render(box, s.d||[], {
    noiseOn: WC_NOISE,
    maxFs: o.maxFs||48,
    minFs: o.minFs||11,
    /* 解释体系所需的三份数据 */
    gloss: G.gloss || {},
    layerNote: G.layerNote || {},
    noiseNote: G.noiseNote || '',
    emptyNote: G.emptyNote || '',
    /* 度量口径必须写清：词云的数值是「出现篇数（文档频率 DF）」，
       不是原始词频 TF。二者差别很大，混称会让读者以为可以直接和词频表对照。 */
    meta: {unit: o.unit || '出现篇数（文档频率 DF）＝含该词的微博篇数，'
                         + '非原始词频 TF（同篇内多次出现仍只计 1 篇）',
           source: o.source || ''},
    tipW: o.tipW,
    onClick: o.click ? function(it){
      /* 就近找同视图内的事件簇面板（两个流域各有一个，不能用全局单例） */
      var host = box.closest('#main') || document;
      var panel = host.querySelector('.clupanel');
      if(panel && panel.__select) panel.__select(it.g);
    } : null
  });
  var card = box.closest('.card');
  var ru = card? card.querySelector('.ruler') : null;
  if(ru && s.d && s.d.length){
    var a = s.d[0], z = s.d[s.d.length-1], tot = 0, ev = 0, evV = 0;
    var grp = o.eventGroups || [];
    for(var i=0;i<s.d.length;i++){
      tot += s.d[i][1];
      if(s.d[i][2] && grp.indexOf(s.d[i][2])>=0){ ev++; evV += s.d[i][1]; }
    }
    ru.innerHTML = '字号标尺：<b>'+a[0]+'</b> '+raw(a[1])+' 次 → 最大字号　·　<b>'+z[0]+'</b> '+
      raw(z[1])+' 次 → 最小字号　·　映射 √((v−v<sub>min</sub>)/(v<sub>max</sub>−v<sub>min</sub>))'+
      '　·　本图 '+s.d.length+' 词合计 '+raw(tot)+' 次'+
      (grp.length? '　·　<b>事件词 '+ev+' 个 / 非事件词 '+(s.d.length-ev)+' 个</b>（事件词占本图频次 '+pct(evV, tot)+'）' : '')+
      (o.note? '　·　'+o.note : '') +
      (res? '　·　落子 '+res.placed+'/'+res.items : '');
  }
  return res;
};

/* ===== 事件簇面板（批次 1 · 词云改造新增）=================================
   由来：原词云只有一个维度（频次），「中央生态环保督察」与「近日」同尺度比较，
   读者看不出「哪个事件正在被讨论」。本面板给词云补上两层：
     ① 释义 —— 这一簇究竟是什么（从这批语料归纳，不是百科抄写）
     ② 证据 —— 3 条最高互动的真实原文，带链接可核验
   数据契约（build_basin_data.py 产出，全部 SQL 实测，无估值）：
     s.d = { basin:'长江', cloud:'yz-w3', gate:30, amb:{跨簇词:[簇,簇]},
             cls:[ {name, words:[词表], gloss, color,
                    n, t0, t1, rep, cmt, lk  —— 命中篇数 / 时间跨度 / 转评赞
                    prov:[[省,篇]...]        —— 目标省份口径 Top4
                    vis:[词云里可见的词], nvis,
                    ev:[{txt,au,tm,pv,eng,rep,lk,url}...] } ] }
   ⚠ 本段是块注释，内部不得再出现块注释开始/结束符 —— JS 不支持嵌套块注释，
     内层结束符会提前闭合外层，后面那行就变成真代码，报 Unexpected token。
     这个坑在第一次写入时踩过，是 node --check 抓出来的（页面自检抓不到）。
   交互：点簇标签 → 本面板切详情 + 词云 setFocus(簇名)（其余词压暗到 15%）。
   联动靠 DOM 就近查找，不挂全局变量 —— 两个流域的面板不会互相抢焦点。 */
R.clusters = function(box, s){

  function es(x){

  }
  function ensureCss(){

        'font-size:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:var(--fg2);transition:.15s}'+
      '.ctag:hover{border-color:rgba(255,255,255,.26);color:var(--fg)}'+
      '.ctag.on{background:rgba(63,143,99,.16);border-color:rgba(63,143,99,.55);color:var(--fg)}'+
      '.ctag i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}'+
      '.ctag b{margin-left:2px;font-weight:600;opacity:.7;font-size:11px}'+
      '.ctag.all{color:var(--fg3)}'+
      '.cludet{border-top:1px solid var(--line);padding-top:10px}'+
      '.clugrid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1.15fr);gap:16px;align-items:start}'+
      '@media (max-width:1100px){.clugrid{grid-template-columns:1fr}}'+
      '.cludet h4{margin:0 0 7px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}'+
      '.cludet h4 i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}'+
      '.ckvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:10px 0}'+
      '.ckvs div{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:6px 9px}'+
      '.ckvs span{display:block;font-size:11px;color:var(--fg3);margin-bottom:2px}'+
      '.ckvs b{font-size:13px;font-weight:600;line-height:1.35}'+
      '.gl{font-size:12.5px;line-height:1.7;color:var(--fg2);margin:0}'+
      '.cprov{font-size:11.5px;color:var(--fg3);margin:0 0 9px}'+
      '.cev{display:flex;flex-direction:column;gap:8px}'+
      '.evitem{background:rgba(255,255,255,.03);border-left:2px solid rgba(120,95,60,.35);'+
        'border-radius:0 8px 8px 0;padding:7px 10px}'+
      '.evitem p{margin:0 0 4px;font-size:12.5px;line-height:1.65;color:var(--fg2)}'+
      '.evm{font-size:11px;color:var(--fg3)}'+
      '.evm a{color:var(--blue);text-decoration:none}'+
      '.gate{font-size:11px;padding:1px 8px;border-radius:20px;font-weight:400}'+
      '.gate.ok{background:rgba(61,220,151,.14);color:var(--cyan)}'+
      '.gate.low{background:rgba(255,180,77,.16);color:var(--amber)}'+
