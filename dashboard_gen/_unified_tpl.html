      '.cnote b{color:var(--fg2);font-weight:600}';
    document.head.appendChild(st);
  }
  function focusCloud(n){
    if(window.__flush) window.__flush();      /* 词云可能还在视口外未落子，先强制画一遍 */
    var inst = charts[d.cloud];
    return (inst && inst.setFocus) ? inst.setFocus(n) : 0;
  }
  function detail(c){
    var gv = c.n >= gate
      ? '<span class="gate ok">'+raw(c.n)+' 篇 · 过 '+gate+' 篇闸门</span>'
      : '<span class="gate low">'+raw(c.n)+' 篇 · 未过 '+gate+' 篇闸门，只作线索</span>';
    var prov = (c.prov||[]).map(function(p){ return es(p[0])+' '+raw(p[1]); }).join('　·　') || '—';
    var ev = (c.ev||[]).map(function(e){
      return '<div class="evitem"><p>'+es(e.txt)+'</p><div class="evm">'+
        es(e.au||'-')+'　·　'+es(e.tm||'')+'　·　目标省份 '+es(e.pv||'-')+
        '　·　互动 '+raw(e.eng)+'（转 '+raw(e.rep)+' / 赞 '+raw(e.lk)+'）'+
        (e.url? '　·　<a href="'+es(e.url)+'" target="_blank" rel="noopener">原文</a>' : '')+
        '</div></div>';
    }).join('') || '<div class="cnote">本簇暂无代表原文</div>';
    var nw = (c.words||[]).length, miss = nw - (c.nvis||0);
    var ambLine = (c.words||[]).filter(function(w){ return amb[w]; }).map(function(w){
      return '<b>'+es(w)+'</b> 亦属「'+amb[w].filter(function(x){ return x!==c.name; }).join('、')+'」';
    }).join('；');
    return '<h4><i style="background:'+(c.color||'#8899aa')+'"></i>'+es(c.name)+' '+gv+'</h4>'+
      '<div class="clugrid">'+
        '<div>'+
          '<p class="gl">'+es(c.gloss||'')+'</p>'+
          '<div class="ckvs">'+
            '<div><span>命中篇数（去重微博 ID）</span><b>'+raw(c.n)+'</b></div>'+
            '<div><span>时间跨度</span><b>'+es(c.t0||'-')+' ~ '+es(c.t1||'-')+'</b></div>'+
            '<div><span>互动合计（转+评+赞）</span><b>'+raw((c.rep||0)+(c.cmt||0)+(c.lk||0))+'</b></div>'+
            '<div><span>词云可见词</span><b>'+(c.nvis||0)+' / '+nw+'</b></div>'+
          '</div>'+
          '<div class="cprov">参考省份（目标省份口径）：'+prov+'</div>'+
          '<div class="cnote">词表：'+es((c.words||[]).join(' / '))+
            (miss>0? '　·　其中 '+miss+' 个词未被分词器切出（短语被切碎，或单字被停用词表滤掉），因此词云里看不到'
                   : '')+
            (ambLine? '<br>跨簇词（同一篇会同时进两簇，故各簇篇数不可相加）：'+ambLine : '')+
          '</div>'+
        '</div>'+
        '<div class="cev">'+ev+'</div>'+
      '</div>';
  }
  function paint(){
    var tags = cls.map(function(c){
      return '<span class="ctag'+(c.name===sel?' on':'')+'" data-n="'+es(c.name)+'">'+
        '<i style="background:'+(c.color||'#8899aa')+'"></i>'+es(c.name)+'<b>'+raw(c.n)+'</b></span>';
    }).join('') + '<span class="ctag all'+(sel?'':' on')+'" data-n="">全部</span>';
    var cur = null;
    for(var i=0;i<cls.length;i++) if(cls[i].name===sel) cur = cls[i];
    box.innerHTML = '<div class="clutags">'+tags+'</div><div class="cludet">'+
      (cur? detail(cur) : '<div class="cnote">未选中事件簇 —— 词云显示全量词。点上方任一标签即可聚焦。</div>')+
      '</div>';
    Array.prototype.forEach.call(box.querySelectorAll('.ctag'), function(t){
      t.onclick = function(){ select(t.dataset.n); };
    });
  }
  function select(name){
    if(!name){ sel = null; focusCloud(null); paint(); return 0; }
    var known = false;
    for(var i=0;i<cls.length;i++) if(cls[i].name===name) known = true;
    if(!known){
      /* 点到非事件词（概念词/套话/省名）：如实说明，不假装选中某一簇 */
      sel = null; focusCloud(null); paint();
      var nt = box.querySelector('.cludet');
      if(nt) nt.insertBefore(el('div','note warn',
        '「'+es(name)+'」属于非事件层（议题概念词 / 公文套话 / 行政区划名 / 泛义实义词），不归属任何事件簇。'+
        '词云已恢复全量显示。'), nt.firstChild);
      return 0;
    }
    sel = name;
    var hit = focusCloud(name);
    paint();
    return hit;
  }
  box.__select = function(n){ return select(n); };
  ensureCss(); paint();
  return { select: select, current: function(){ return sel; } };
};


/* ===== 事件台账（v14，2026-10-07）=====
   由来：现状「事件监测」页 6 张卡里 3 张是同批数据的不同切法，且整页零交互。
   改法不是换皮，而是**按信息类型分配不同载体**—— 事件有 4 类信息
   （规模 / 时间 / 议题归属 / 负面强度），用同一种卡片装全部会导致：
     ① 小事件被大事件留白淹没（实测两流域规模差 20~39 倍）；
     ② 每张卡都要放全套字段，真正区分度高的「负面占比」被摊平成一行小字。
   四种载体：
     A 主事件面板 .evhero  —— 规模 Top1，大号数字 + 内嵌月度带 + 省份横条
     B 高负警示块 .evalert —— 负面占比 ≥50%，形态即语义
     C 逐月命中带 .evband  —— 每行 18 格，色阶与热力图同源
     D 行式清单 .evrow    —— 全量 + 议题分组，扫读成本远低于 N 张卡片
   另附 E 议题对比 .evtpc  —— 显式写明哪些议题能横向比、哪些不能。

   ⚠ 三条口径纪律（都是实测踩出来的，别改回去）：
   1) **不做"升温/降温"**：样本 60%+ 集中在 2026 年，任何跨期增幅都是伪信号
      （同一判据在 2026 判出 ~90% 事件、平移到 2025 同期只剩 0~2 个）。
   2) **"覆盖省数"是常量列**（实测恒为 3~4），已删；改用「首省占比」
      （Top1 省份 ÷ 该事件总篇数，实测 45%~80%），能区分区域性与跨省扩散。
   3) **议题负面区间大幅交叠**，"生态治理比文旅更负面"在本批数据里不成立。
      故 evtpc 里按交叠比例分档写明，而不是给一个笼统的均值对比。 */
R.evledger = function(box, s){
  var d = s.d || {}, cls = d.cls || [];
  if(!cls.length){ box.innerHTML = '<div class="note">暂无事件簇数据</div>'; return null; }
  var T3 = d.topics || ['生态治理','文旅','医患矛盾'];
  var TC = d.tcolor || {};
  var gate = d.gate || 30;
  /* part：拆成两张卡渲染，而非一张 2000+px 的巨卡。
     理由：① 栅格是 3 列，单卡过高会让该视图首屏几乎全是这一张卡；
           ② 本渲染器有 @media 断点，窄屏时两栏会堆叠变更高 ——
              固定 h= 必然在某个宽度下再次溢出（实测 1180 差 880px）。
     part='top'  → 面板 / 警示块 / 月度带 / 议题对比（概览层）
     part='list' → 行式清单 + 详情（下钻层） */
  var part = d.part || 'top';
  box.classList.add('evpanel');

  function es(x){
    return String(x==null? '' : x).replace(/[&<>]/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]; });
  }
  /* [[月, 篇数]] → {月: 篇数}。months 存的是这种对数组，本页要查 ~250 次，
     先建索引避免每次 O(n) 扫描。 */
  function dict(pairs){
    var o = {};
    (pairs||[]).forEach(function(p){ o[p[0]] = p[1]; });
    return o;
  }
  /* 月份轴：近 18 个月（与事件×月份热力图同口径，不引入第二套时间轴） */
  var allM = {};
  cls.forEach(function(c){ (c.months||[]).forEach(function(mv){ allM[mv[0]] = 1; }); });
  var months = Object.keys(allM).sort().slice(-18);
  var mxs = 1;
  cls.forEach(function(c){ (c.months||[]).forEach(function(mv){
    if(months.indexOf(mv[0])>=0 && mv[1]>mxs) mxs = mv[1]; }); });
  var NMAX = cls.reduce(function(a,c){ return c.n>a? c.n : a; }, 1);
  var NEGMIN = d.negGate == null ? 50 : d.negGate;

  /* 8 档等频色阶：与地图 / 热力图同一套口径（0 格单独冷灰） */
  var RAMP = ['#ffe9b8','#ffd98a','#ffc85c','#f7b23b','#e39420','#c97a16','#a85f10','#7d450a'];
  function hcol(v){
    if(!v) return 'rgba(133,115,93,.13)';
    var k = Math.min(7, Math.ceil(v / mxs * 7));
    return RAMP[k];
  }
  function firstM(c){
    var ms = (c.months||[]).map(function(mv){ return mv[0]; }).sort();
    return ms.length? ms[0] : '—';
  }
  /* 区间交叠比例：0=完全分离，≥0.6=大幅重合。
     ⚠ 不能只判「有没有交叠」—— 交叠 10% 与 90% 结论完全不同。 */
  function ovl(a, b){
    var lo = Math.max(a[0], b[0]), hi = Math.min(a[1], b[1]);
    if(hi <= lo) return 0;
    return (hi - lo) / Math.max(a[1]-a[0], b[1]-b[0], 1);
  }
  function rngOf(list){
    var v = list.map(function(c){ return c.negPct || 0; });
    return v.length? [Math.min.apply(null,v), Math.max.apply(null,v)] : [0,0];
  }

  function ensureCss(){
    if(document.getElementById('evCss')) return;
    var st = el('style'); st.id = 'evCss';
    st.textContent =
      '.evpanel{display:block}'+
      '.evsec{margin-bottom:16px}'+
      '.evsec:last-child{margin-bottom:0}'+
      '.evh{font-size:12.5px;font-weight:600;margin:0 0 3px;display:flex;'+
        'align-items:baseline;gap:8px;flex-wrap:wrap}'+
      '.evh em{font-style:normal;font-weight:400;font-size:11px;color:var(--fg3)}'+
      /* A 主事件面板 */
      '.evhero{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;background:var(--panel2);'+
        'border:1px solid var(--line);border-radius:10px;padding:15px 17px}'+
      '@media (max-width:1100px){.evhero{grid-template-columns:1fr}}'+
      '.evhero .kick{font-size:10.5px;color:var(--cyan);font-weight:600;letter-spacing:.05em}'+
      '.evht{font-size:18px;font-weight:600;margin:5px 0 6px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}'+
      '.evhn{display:flex;align-items:baseline;gap:11px;margin-bottom:9px;flex-wrap:wrap}'+
      '.evhn b{font-size:32px;font-weight:600;line-height:1}'+
      '.evhn .u{font-size:11.5px;color:var(--fg2)}'+
      '.evhn .sep{width:1px;height:18px;background:var(--line)}'+
      '.evgl{font-size:12.5px;line-height:1.7;color:var(--fg2);margin:8px 0 10px;margin:0 0 10px}'+

  /* ---------- A 主事件面板 ---------- */
  function secHero(){
    var c = cls[0];
    var pv = (c.prov||[]).slice(0,8);
    var pmx = pv.reduce(function(a,p){ return p[1]>a? p[1] : a; }, 1);
    var inner = '<div><div class="kick">规模最大的事件</div>'+
      '<div class="evht">'+es(c.name)+
        (c.negPct>=NEGMIN? '<span class="gate">负面 '+c.negPct+'%</span>' : '')+'</div>'+
      '<div class="evhn"><b>'+raw(c.n)+'</b><span class="u">条命中</span>'+
        '<span class="sep"></span><span class="u">负面 <b style="color:var(--red)">'+c.negPct+'%</b></span>'+
        '<span class="sep"></span><span class="u">覆盖 '+((c.prov||[]).length)+' 省</span>'+
        '<span class="sep"></span><span class="u">首现 '+es(c.t0||'—')+'</span></div>'+
      (c.gloss? '<p class="evgl">'+es(c.gloss)+'</p>' : '')+
      '<div class="evmb ax">'+months.map(function(m){
        return '<div class="mc">'+m.slice(2)+'</div>'; }).join('')+'</div>'+
      '<div class="evmb">'+months.map(function(m){
        var v = (dict(c.months||{})[m])||0;
        return '<div class="mc" style="background:'+hcol(v)+'" title="'+es(m)+'：'+v+' 条"></div>';
      }).join('')+'</div>'+
      '<p class="evwarn">⚠ 月度分布只读"何时存在"，<b>不可读作声量趋势</b>：'+
        '本流域样本 '+d.y26+'% 集中在 2026 年，右侧密集是采集集中造成的。</p>'+
      '</div>'+
      '<div><div class="tk2" style="font-size:10.5px;color:var(--fg3);margin:0 0 6px">'+
        '<b style="color:var(--fg2)">省份构成</b>（命中篇数）</div>'+
      (pv.length? pv.map(function(p,i){
        /* 首省用墨绿（项目语义：墨绿 = 真实数据），其余降一档为浅色。
           ⚠ 不要给首省用赭黄/绛红 —— 本页只有「负面占比」才配警示色，
           用警示色标省份会让读者误以为该省是风险点。 */
        return '<div class="prov"><span>'+es(p[0])+'</span>'+
          '<span class="tr"><i style="width:'+(p[1]/pmx*100).toFixed(0)+'%;'+
          'background:'+(i? 'rgba(63,143,99,.42)':'var(--cyan)')+'"></i></span>'+
          '<span class="nv">'+raw(p[1])+'</span></div>';
      }).join('') : '<div class="tk2" style="color:var(--fg3)">无省份数据</div>')+
      '<div class="tk2" style="font-size:10.5px;color:var(--fg3);margin-top:8px">'+
        '现状明细表只给"首要省份"一个值，读者看不到分布 —— 这是本页信息损失最大的一处。</div>'+
      '</div>';
    return '<div class="evsec"><div class="evh">主事件面板'+
      '<em>规模 Top1 用大号面板而非卡片 —— 形态本身说明"这是重点"</em></div>'+
      '<div class="evhero">'+inner+'</div></div>';
  }

  /* ---------- B 高负警示块 ---------- */
  function secAlerts(){
    var negs = cls.filter(function(c){ return c.negPct>=NEGMIN; });
    if(negs.length<2) return '';
    var top = negs.slice(0,4);
    return '<div class="evsec"><div class="evh">高负警示块'+
      '<em>负面占比 ≥ '+NEGMIN+'% 的 '+negs.length+' 个事件 · 形态即语义，不与普通项同形</em></div>'+
      '<div class="evalerts">'+top.map(function(c){
        return '<div class="evalert"><div class="an">'+es(c.name)+'</div>'+
          '<div class="am"><b>'+c.negPct+'%</b><span class="u">负面 · '+raw(c.n)+' 条</span></div>'+
          '<div class="ab"><i style="width:'+c.negPct+'%"></i></div>'+
          '<div class="tk2" style="color:var(--fg3);margin-top:4px">'+
          es((c.gloss||'').slice(0,34))+'…</div></div>';
      }).join('')+'</div></div>';
  }

          '<div class="bt">'+months.map(function(m){
            var v = (dict(c.months||{})[m])||0;
            return '<div class="mc" style="background:'+hcol(v)+'" title="'+es(c.name)+

          }).join('')+'</div>';
      }).join('')+
      '<div class="bax">'+months.map(function(m){

        '3+ <i style="background:'+RAMP[3]+'"></i> 最深 <i style="background:'+RAMP[7]+'"></i></span></div>'+
      '<div class="tk2" style="color:var(--fg3);margin-top:5px">事件名后的年份 = <b>首次出现</b>年份。'+
        '<b>不可横向比条长来比声量</b>（部分事件首现于 2011 年，'+
        '但本批样本只覆盖近 18 个月，长短反映的是"这批数据里命中多少个月"）。</div></div>';

  /* ---------- E 议题对比（放在 D 之前：先说清哪些能比）---------- */
  function secTopics(){
    var byT = {};
    T3.forEach(function(t){ byT[t] = cls.filter(function(c){ return c.topic===t; }); });
    var live = T3.filter(function(t){ return byT[t].length; });
    var cells = live.map(function(t){
      var sub = byT[t].slice().sort(function(a,b){ return b.n-a.n; });
      var nps = sub.map(function(c){ return c.negPct||0; }).sort(function(a,b){ return a-b; });
      var lo = nps[0], hi = nps[nps.length-1], mid = nps[Math.floor(nps.length/2)];
      return '<div class="tc" style="border-top:3px solid '+(TC[t]||'#85735d')+'">'+
        '<div class="tn">'+es(t)+'</div>'+
        '<div class="ts"><b>'+raw(sub.reduce(function(a,c){ return a+c.n; },0))+
          '</b> 条 / '+sub.length+' 个事件</div>'+
        '<div class="tk2">负面占比区间</div>'+
        '<div class="tr">'+lo+'%<i>→</i>'+hi+'%<em>中位 '+mid+'%</em></div>'+
        '<div class="tb">'+sub.map(function(c){
          return '<span style="width:'+(c.n/NMAX*100).toFixed(0)+'%;background:'+
            (TC[t]||'#85735d')+'" title="'+es(c.name)+'：'+(c.negPct||0)+'%"></span>';
        }).join('')+'</div>'+
        '<div class="tk2">规模最大的事件</div>'+
        '<div class="tk2" style="color:var(--fg2);font-size:11.5px">'+es(sub[0].name)+
          '（'+raw(sub[0].n)+' 条）</div></div>';
    }).join('');
    /* 交叠分档：≥60% 完全交叠（不可比）/ 0~60% 部分交叠（只能逐事件比） */
    var hard = [], mild = [];
    for(var i=0;i<live.length;i++) for(var j=i+1;j<live.length;j++){
      var v = ovl(rngOf(byT[live[i]]), rngOf(byT[live[j]]));
      if(v>=0.6) hard.push(live[i]+'↔'+live[j]);
      else if(v>0) mild.push(live[i]+'↔'+live[j]);
    }
    return '<div class="evsec"><div class="evh">议题对比'+
      '<em>先说清哪些议题能横向比、哪些不能 —— 否则读者会拿重叠的区间做对比</em></div>'+
      '<div class="evtpc">'+cells+'</div>'+
      '<div class="tk2" style="color:var(--fg3);margin-top:7px;line-height:1.7">⚠ '+
      '<b style="color:var(--fg2)">议题之间不能整体比负面强度</b>。'+
      (hard.length? '<b style="color:var(--red)">'+hard.join('、')+'</b> 区间大幅重合 → 不可比；' : '无完全重合的议题对；')+
      (mild.length? mild.join('、')+' 部分交叠 → 只能逐事件比，不能比均值。' : '')+
      '所以"某议题比另一议题更负面"这类说法，<b style="color:var(--fg2)">在本批数据里不成立</b>。</div></div>';
  }

  /* ---------- D 行式清单 + 详情 ---------- */
  var sel = cls[0].name;
  function detail(c){
    var pv = (c.prov||[]).slice(0,6);
    var pmx = pv.reduce(function(a,p){ return p[1]>a? p[1] : a; }, 1);
    var ev = (c.ev||[]).slice(0,2).map(function(e){
      return '<div class="evi"><p>'+es(e.txt)+'</p><div class="vm">'+es(e.au||'-')+
        '　·　'+es(e.tm||'')+'　·　互动 '+raw(e.eng)+'（转 '+raw(e.rep)+' / 赞 '+raw(e.lk)+'）'+
        (e.url? '　·　<a href="'+es(e.url)+'" target="_blank" rel="noopener">原文</a>' : '')+
        '</div></div>';
    }).join('') || '<div class="tk2" style="color:var(--fg3)">本事件暂无代表原文</div>';
    /* 情感构成细条：原 ev3+ev4 两张堆叠图的正/中/负绝对篇数折进这里。
       为什么折：这两张与"负面占比"是同一批数据的不同切法，且上下相邻、
       信息重复；台账已有 negPct，缺的只是"正面/中性各多少条"，
       一根 20px 高的细条足够，不必再占两张图。 */
    var sm = {};
    (c.sent||[]).forEach(function(z){ sm[z[0]] = z[1]; });
    var sp = sm['正面']||0, sn = sm['中性']||0, sg = sm['负面']||0;
    var stot = sp + sn + sg;
    var sentBar = stot ? (
      '<div class="tk2" style="font-size:10.5px;color:var(--fg3);margin:9px 0 4px">'+
        '<b style="color:var(--fg2)">情感构成</b>（SnowNLP 判定，'+
        '正 '+raw(sp)+' / 中 '+raw(sn)+' / 负 '+raw(sg)+' 条）</div>'+
      '<div class="evsent">'+[
          ['正面', sp, 'var(--cyan)'], ['中性', sn, 'var(--amber)'],
          ['负面', sg, 'var(--red)']].map(function(x){
        return '<i style="width:'+(x[1]/stot*100).toFixed(1)+'%;background:'+x[2]+
          '" title="'+x[0]+' '+x[1]+' 条（'+Math.round(x[1]/stot*100)+'%）"></i>';
      }).join('')+'</div>') : '';
    return '<div class="evdet"><h4><i style="background:'+(c.color||'#85735d')+'"></i>'+es(c.name)+
      '<span class="gate'+(c.n>=gate? ' ok':' low')+'">'+raw(c.n)+' 条 · '+
      (c.n>=gate? '过闸门':'未过闸门，只作线索')+'</span></h4>'+
      (c.gloss? '<p class="gl">'+es(c.gloss)+'</p>' : '')+
      '<div class="gr"><div><div class="tk2" style="font-size:10.5px;color:var(--fg3);margin-bottom:5px">'+
        '<b style="color:var(--fg2)">代表原文</b>（簇内互动最高，带链接可回源核验）</div>'+
        (ev||'')+
        sentBar+
        '<div class="tk2" style="font-size:10.5px;color:var(--fg3);margin-top:9px">'+
        '<b style="color:var(--fg2)">命中词表</b>（人工归纳，簇的召回依据）</div>'+
        '<div class="evkw">'+(c.words||[]).map(function(w){
          return '<span>'+es(w)+'</span>'; }).join('')+'</div></div>'+
      '<div><div class="tk2" style="font-size:10.5px;color:var(--fg3);margin-bottom:5px">'+
        '<b style="color:var(--fg2)">省份分布</b>（命中篇数 Top6）</div>'+
      (pv.length? pv.map(function(p){
        return '<div class="prov" style="display:grid;grid-template-columns:34px 1fr 34px;gap:7px;'+
          'align-items:center;font-size:11.5px;margin-bottom:3px"><span>'+es(p[0])+'</span>'+
          '<span class="tr" style="height:9px;border-radius:5px;background:rgba(120,95,60,.1)">'+
          '<i style="display:block;height:100%;width:'+(p[1]/pmx*100).toFixed(0)+'%;'+
          'border-radius:5px;background:var(--cyan)"></i></span>'+
          '<span class="nv" style="text-align:right;color:var(--fg2)">'+raw(p[1])+'</span></div>';
      }).join('') : '<div class="tk2" style="color:var(--fg3)">无省份数据</div>')+
      '<div class="tk2" style="color:var(--fg3);margin-top:8px;line-height:1.7">'+
        '首省占比 <b style="color:var(--fg2)">'+(c.prov&&c.prov[0]?
          Math.round(c.prov[0][1]/c.n*100):0)+'%</b>（'+
        ((c.prov&&c.prov[0]&&c.prov[0][1]/c.n>=0.6)? '区域性事件' : '跨省扩散')+'）。'+
        '<b>已删除「覆盖省数」列</b> —— 实测恒为 3~4，是常量列不携带信息。</div>'+
      '</div></div></div>';
  }
  function secList(){
    var out = '<div class="evsec"><div class="evh">全量事件清单'+
      '<em>行式而非卡片：'+cls.length+' 行连成一张表，扫读成本远低于 '+
      cls.length+' 张独立卡片；点任一行切换下方详情</em></div>';
    T3.forEach(function(t){
      var sub = cls.filter(function(c){ return c.topic===t; });
      if(!sub.length) return;
      var nps = sub.map(function(c){ return c.negPct||0; });
      out += '<div class="evlh"><span class="sw" style="background:'+(TC[t]||'#85735d')+'"></span>'+
        '<b>'+es(t)+'</b><span class="tk2" style="margin:0">'+
        sub.length+' 个事件 · 累计 '+raw(sub.reduce(function(a,c){ return a+c.n; },0))+
        ' 条 · 负面 '+Math.min.apply(null,nps)+'%~'+Math.max.apply(null,nps)+'%</span></div>'+
        '<div class="evlst">'+sub.map(function(c){
          var pv = c.prov||[];
          var sh = pv.length? Math.round(pv[0][1]/c.n*100) : 0;
          var neg = c.negPct>=NEGMIN;
          return '<div class="evrow'+(neg?' neg':'')+(c.name===sel?' on':'')+
            '" data-n="'+es(c.name)+'" title="'+es(c.name)+'：'+raw(c.n)+' 条 · 负面 '+
            (c.negPct||0)+'% · 首现 '+es(c.t0||'—')+'">'+
            '<span class="dot" style="background:'+(neg?'var(--red)':'var(--cyan)')+'"></span>'+
            '<span class="nm">'+es(c.name)+'</span>'+
            '<span class="tr"><i style="width:'+Math.max(4,Math.round(c.n/NMAX*100))+'%"></i></span>'+
            '<span class="tk">'+raw(c.n)+' 条</span>'+
            '<span class="tk"'+(neg? ' style="color:var(--red)"':'')+'>'+(c.negPct||0)+'%</span>'+
            '<span class="tk sh">'+sh+'%<em>'+es(pv.length? pv[0][0] : '—')+'</em></span></div>';
        }).join('')+'</div>';
    });
    var cur = null;
    for(var i=0;i<cls.length;i++) if(cls[i].name===sel) cur = cls[i];
    out += detail(cur||cls[0])+'</div>';
    return out;
  }

  function paint(){
    box.innerHTML = part === 'list'
      ? secList()
      : secHero() + secAlerts() + secBands() + secTopics();
    if(part !== 'list') return;
    Array.prototype.forEach.call(box.querySelectorAll('.evrow'), function(r){
      r.onclick = function(){
        sel = r.dataset.n;
        Array.prototype.forEach.call(box.querySelectorAll('.evrow'), function(x){
          x.classList.toggle('on', x.dataset.n===sel); });
        var old = box.querySelector('.evdet');
        if(old) old.outerHTML = detailByName(sel);
      };
    });
  }
  function detailByName(n){
    for(var i=0;i<cls.length;i++) if(cls[i].name===n) return detail(cls[i]);
    return '';
  }
  ensureCss(); paint();
  return { select: function(n){ sel = n; paint(); }, current: function(){ return sel; } };
};


/* ===== v8：分段进度条渲染器 =====
   由来：用户指定采用「BasinScope-界面改造预案」里那张「正文长度分布」卡的形态
   —— 左侧中文档位、中间分段进度条、右侧条数与占比、底部一条口径说明。
   实现选型：纯 DOM 而非 ECharts。理由：
     1) 条形只有 16px 高，canvas 在这个高度上锯齿明显，DOM 矩形边缘锐利；
     2) 卡片要容纳两种非图表元素 —— 「零值档位」（实测确实有 3 档为 0）
        和「底部口径说明条」，塞进 ECharts 反而要拼 graphic，得不偿失。
   段数按轨道实际像素宽自适应：轨道窄时分太多段会糊成一条虚线。 */
function _h2c(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function _lerpC(a, b, t){
  var A = _h2c(a), B = _h2c(b);
  return 'rgb(' + A.map(function(v, i){ return Math.round(v + (B[i]-v)*t); }).join(',') + ')';
}

          '单条结论不构成总体规律；画面读数来自<b>关键帧拼图而非原始视频</b>；分析由大模型生成，仅供辅助参考。</div>'+

    document.body.appendChild(dlg);
    var v = dlg.querySelector('#vcv'), msg = dlg.querySelector('#vcmsg');
    dlg.querySelector('.vcclose').addEventListener('click', function(){ dlg.close(); });

      if(v.src){ v.style.display='block'; v.play(); return; }
      msg.textContent = '获取播放地址…';
      fetch('/video/url/'+encodeURIComponent(it.cid))

        .then(function(j){

          v.play().catch(function(){});
          msg.textContent = '已开始播放（经本站代理）';
        })
        .catch(function(){ msg.textContent='请求失败'; });
    });
    dlg.addEventListener('close', function(){ try{ v.pause(); v.removeAttribute('src'); }catch(e){} });
    dlg.showModal();
  }

R.segbar = function(box, s){
  /* v13：静态分段条 ——
     原 v12 的进场增长（掩膜 0 → 目标）、条纹滚动、数值/百分比滚动补间全部移除；
     渲染完成后条长、数值与百分比即固定不变。
     每行一条纯色（barRamp 按行取色），同一图内各行色相都不同。
     保留：轨道 / 掩膜宽度=占比 / 数值 / 百分比 / 零值档「无」/ 悬停 tooltip /
     底部口径说明条 / 布局列宽（84px 标签 + 轨道 + 54px 数值 + 42px 占比）。 */
  var o = s.o || {}, d = s.d || {};
  var rows = d.rows || [];
  if(!rows.length) rows = pairify(d).map(function(z){ return {lb:z[0], v:+z[1] || 0}; });
  var tot = rows.reduce(function(a, r){ return a + (+r.v || 0); }, 0);
  box.classList.add('segbar');
  box.style.height = 'auto';
  var card = box.closest('.card');
  if(card && BAR_PANEL === 'light') card.classList.add('lp');
  var exp = box.nextElementSibling;               /* 纯 DOM 图没有 canvas，导出按钮点了也没用 */
  if(exp && exp.classList && exp.classList.contains('exp')) exp.style.display = 'none';
  var off = o.p || 0;                             /* 配色起始偏移 */
  var ramp = barRamp(rows.length, off);           /* 逐行一色，色相按行数等分 */

  function trackW(){ return Math.max(90, (box.clientWidth || 380) - 84 - 54 - 42 - 27); }

  function build(){
    var W = trackW();
    var mx = 1;
    rows.forEach(function(r){ mx = Math.max(mx, +r.v || 0); });
    var wrap = el('div','sgb');
    rows.forEach(function(r, i){
      var v = +r.v || 0, fr = v / mx;
      var line = el('div','sgr' + (v > 0 ? '' : ' z'));
      line.title = r.lb + '：' + raw(v) + ' 条' + (tot ? '（占 ' + (v/tot*100).toFixed(1) + '%）' : '');
      line.appendChild(el('span','sgl', r.lb));
      line.appendChild(el('span','sgv', raw(v)));
      line.appendChild(el('span','sgp', (tot ? (v/tot*100).toFixed(1) : '0.0') + '%'));
      var tr = el('span','sgt');
      if(v > 0){
        var m = el('span','sgm');                  /* 掩膜：宽度 = 填充进度（静态，无过渡） */
        var f = el('span','sgf');
        var wPx = Math.max(2, Math.round(W * fr));
        f.style.width = wPx + 'px';
        /* 逐行取色：显式给了 hex 就用它，否则按行号取本图色带 */
        f.style.background = (typeof r.c === 'string' && r.c.charAt(0) === '#')
          ? r.c : ramp[i];
        f.style.boxShadow = 'inset 0 -1px 0 rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.22)';
        m.appendChild(f);
        tr.appendChild(m);
        m.style.width = wPx + 'px';
      } else {
        /* 实测为 0 的档位：留一条空轨 + 一个「无」，避免被读成渲染失败 */
        tr.appendChild(el('em','sgn','无'));
      }
      line.appendChild(tr);
      wrap.appendChild(line);
    });
    if(o.note) wrap.appendChild(el('div','sgbn', o.note));
    box.innerHTML = '';
    box.appendChild(wrap);
  }
  build();

  /* 段宽是按像素算的 → 容器尺寸变了必须重排（静态重建，无动画） */
  return {
    resize: function(){ build(); },
    __relayout: function(){ build(); },
    getDom: function(){ return box; }
  };
};
R.spark = function(box, s){
  /* 热词 × 近 8 天热度矩阵（ECharts heatmap）。
     v7 改色：原 inRange 是 ['rgba(63,143,99,.10)','#2f8f86','#c9860a'] —— 低端是 10% 透明的蓝，
     压在深蓝卡片底（--panel #fffdf8 / --panel2 #faf5ec，亮度 27~33）上只有亮度 41 左右，
     整片「冷区」与底色几乎同调，只剩几块亮斑能看见。
     现改为 8 档多色阶（jet 风格）：色相跨度大、观感鲜明，且**低端整体抬高**
     （最冷档 #2b57b0 亮度 84，比底色高 50+），保证任何非零格都从背景里跳出来。

     另做三处可读性处理：
       ① 底层再铺一层「暗格衬底」（silent），让当日未出现的格子也有格位
          —— 衬底压得很暗（亮度 ≈37，只比底色高 7 点），只当网格轨道用，不与数据争亮度；
       ② 格内数字按**该格实际渲染色**的亮度自适应黑/白（不是按数值比例猜）：
          多色阶里红端比黄端暗、青端比绿端亮，亮度并不随数值单调，必须按渲染色判；
       ③ 图例条给出色阶条与「暗格」口径，不用猜颜色含义。

     另修一处老问题：yAxis.data 原先做了 reverse()，但格子的 y 索引用的是原始 i，
     二者错位会让每行显示的词名与格内数字对不上；改用 axis.inverse:true 表达「高频词在上」。 */
  var HPAL = ['#2b57b0','#2f7fe0','#22b7e8','#22d0a8','#6f9e3a','#ffd45e','#ff8a3d','#ff4d5e'];
  function h2r(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
  function rampAt(t){
    /* 与 ECharts 连续 visualMap 同样的分段线性插值（RGB 空间），用来预判每格的渲染色 */
    t = Math.max(0, Math.min(1, t));
    var x = t * (HPAL.length - 1), i = Math.min(HPAL.length - 2, Math.floor(x)), f = x - i;
    var a = h2r(HPAL[i]), b = h2r(HPAL[i+1]);
    return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
  }
  function lum(c){ return 0.299*c[0] + 0.587*c[1] + 0.114*c[2]; }

  var d = (s.d||[]).map(function(z){ return {name:z[0], v:z[1], sp:z[2]||[]}; });
  var n = d.length? d[0].sp.length : 8;
  var cells = [], mx = 1;
  d.forEach(function(r, i){ r.sp.forEach(function(v, j){ if(v > mx) mx = v; }); });
  d.forEach(function(r, i){ r.sp.forEach(function(v, j){
    cells.push({value:[j, i, Math.max(v, 0)], name:r.name, v:v}); }); });
  var hot = cells.filter(function(z){ return z.v > 0; }).map(function(z){
    var c2 = rampAt(z.v / mx);
    return {value:z.value, name:z.name, v:z.v,
      label:{color:(lum(c2) > 150 ? '#08111f' : '#eaf2ff'), fontSize:10, fontWeight:600}};
  });
  var c = initChart(box);
  c.setOption(base({
    grid:{left:88, right:16, top:8, bottom:26, containLabel:false},
    tooltip:{backgroundColor:'rgba(255,253,248,.95)', borderColor:C.line, textStyle:{color:C.fg,fontSize:12},
      formatter:function(p){ return p.data.name+' · 第'+(p.value[0]+1)+'天：<b>'+raw(p.data.v)+'</b>'; }},
    xAxis:{type:'category', data:Array.apply(null, Array(n)).map(function(_, i){ return 'D'+(i+1); }),
      axisLine:{show:false}, axisTick:{show:false}, axisLabel:{color:C.fg3, fontSize:10}},
    yAxis:{type:'category', inverse:true, data:d.map(function(r){ return r.name; }),
      axisLine:{lineStyle:{color:C.line}}, axisTick:{show:false},
      axisLabel:{color:C.fg2, fontSize:11}},
    visualMap:{show:false, min:0, max:mx, seriesIndex:1, inRange:{color:HPAL}},
    series:[
      {type:'heatmap', silent:true, z:1, data:cells,
        itemStyle:{color:'rgba(120,95,60,.07)', borderRadius:4,
          borderColor:'rgba(255,253,248,.6)', borderWidth:1}},
      {type:'heatmap', z:2, data:hot,
        itemStyle:{borderRadius:4, borderColor:'rgba(6,11,21,.85)', borderWidth:1.5},
        label:{show:true, formatter:function(p){ return p.data.v > 0 ? p.data.v : ''; }}}
    ]
  }));
  var card = box.closest('.card'), ru = card? card.querySelector('.ruler') : null;
  if(ru){
    ru.innerHTML = '<span class="lgs">色阶（低 → 高）</span>' +
      HPAL.map(function(h){ return '<i class="lgc" style="background:'+h+';width:20px"></i>'; }).join('') +
      '　·　格内数字 = 当日词频　·　<b>暗格 = 当日未出现</b>' +
      '　·　色域 0 ~ ' + raw(mx) + ' 次/日（共 ' + hot.length + ' / ' + cells.length + ' 格有数据）';
  }
  return c;
};

function __qaEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function __qaMd(s){
  s = __qaEsc(s);
  s = s.replace(/```([\s\S]*?)```/g, function(m,c){ return '<pre><code>'+c.replace(/^\n/,'')+'</code></pre>'; });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/^#{1,4}\s*(.+)$/gm, '<b class="mdh">$1</b>');
  s = s.replace(/^[-*]\s+(.+)$/gm, '· $1');
  s = s.replace(/^\d+[.、]\s*(.+)$/gm, '· $1');
  s = s.replace(/\n/g, '<br>');
  return s;
}

        throw new Error('HTTP '+r.status);
      });
    }).then(function(data){
      var reply = (data && data.reply) ? data.reply : '⚠️ 大模型未返回有效内容，请重试。';
      var refs = (data && data.references) || [];

    }).then(function(){
      busy = false; btn.disabled = false; btn.textContent = '发送';
      msgs.scrollTop = msgs.scrollHeight;
    });

R.upload = function(box, s){
  var wrap = el('div','upbox');
  var tips = el('div','chat-tips');
  tips.innerHTML = '支持图片（JPG/PNG/WebP/GIF）与文档（PDF/DOCX/XLSX/TXT/MD/CSV），单文件 ≤ 20MB；选择文件后自动上传，可预览或下载。';
  wrap.appendChild(tips);

  var IMG_RE = /\.(jpe?g|png|webp|gif|bmp)$/i;
  var DOC_RE = /\.(pdf|docx?|xlsx?|txt|md|csv)$/i;
  var MAX = 20 * 1024 * 1024;

  function makeUploader(kind){
    var zone = el('div','upzone');
    var title = el('div','upz-title', kind === 'img' ? '📷 上传图片' : '📄 上传文档');
    var hint = el('div','upz-hint', kind === 'img'
      ? '图表截图 / 词云图 · JPG / PNG / WebP / GIF'
      : '参考文档 / 论文 / 数据表 · PDF / DOCX / XLSX / TXT / MD / CSV');
    var input = el('input','up-input');
    input.type = 'file';
    input.accept = kind === 'img' ? 'image/*' : '.pdf,.doc,.docx,.xls,.xlsx,.txt,.md,.csv';
    var pickBtn = el('button','up-pick', kind === 'img' ? '选择图片' : '选择文档');
    var status = el('div','up-status');
    var bar = el('div','up-bar');
    var barfill = el('div','up-barfill');
    bar.appendChild(barfill);
    var preview = el('div','up-preview');
    var retry = el('button','up-retry','↻ 重试上传');
    retry.style.display = 'none';

    pickBtn.addEventListener('click', function(){ input.click(); });
    zone.appendChild(title); zone.appendChild(hint);
    zone.appendChild(pickBtn); zone.appendChild(input);
    zone.appendChild(status); zone.appendChild(bar);
    zone.appendChild(preview); zone.appendChild(retry);

    var lastFile = null;
    var busy = false;

    function validate(f){
      if(f.size > MAX) return '文件超过 20MB 限制';
      var ok = kind === 'img' ? IMG_RE.test(f.name) : DOC_RE.test(f.name);
      if(!ok) return kind === 'img'
        ? '不支持的图片格式（仅 JPG/PNG/WebP/GIF/BMP）'
        : '不支持的文档格式（仅 PDF/DOCX/XLSX/TXT/MD/CSV）';
      return null;
    }
    function fmtSize(n){ return (n/1024/1024).toFixed(2) + ' MB'; }

    function upload(){
      if(!lastFile || busy) return;
      var err = validate(lastFile);
      if(err){ status.innerHTML = '<span style="color:var(--red)">❌ ' + __qaEsc(err) + '</span>'; retry.style.display='none'; return; }
      busy = true;
      retry.style.display = 'none';
      preview.innerHTML = '';
      barfill.style.width = '0%';
      status.innerHTML = '上传中 0%：' + __qaEsc(lastFile.name);

      var fd = new FormData();
      fd.append('file', lastFile);
      var xhr = new XMLHttpRequest();
      xhr.open('POST', kind === 'img' ? '/page/upload_image' : '/page/upload_file');
      xhr.upload.onprogress = function(e){
        if(e.lengthComputable){
          var pct = Math.round(e.loaded / e.total * 100);
          barfill.style.width = pct + '%';
          status.innerHTML = '上传中 ' + pct + '%：' + __qaEsc(lastFile.name);
        }
      };
      xhr.onload = function(){
        busy = false;
        var d = null;
        try{ d = JSON.parse(xhr.responseText); }catch(e){}
        if(xhr.status >= 200 && xhr.status < 300 && d && (d.url || d.filename)){
          barfill.style.width = '100%';
          status.innerHTML = '<span style="color:var(--teal)">✓ 上传成功</span>';
          if(kind === 'img'){
            preview.innerHTML = '<img class="up-thumb" src="' + d.url + '" alt="预览">'
              + '<div class="up-pvmeta">' + __qaEsc(d.filename || '') + ' · ' + fmtSize(lastFile.size) + '</div>';
          } else {
            preview.innerHTML = '<a class="report-dl" href="' + d.url + '" target="_blank">📥 下载 ' + __qaEsc(d.filename || '文档') + '</a>'
              + '<div class="up-pvmeta">' + fmtSize(lastFile.size) + ' · 已保存到 static/uploads/</div>';
          }
        } else {
          var msg = (d && d.error) ? d.error : ('HTTP ' + xhr.status);
          status.innerHTML = '<span style="color:var(--red)">❌ 上传失败：' + __qaEsc(msg) + '</span>';
          retry.style.display = 'inline-block';
        }
      };
      xhr.onerror = function(){
        busy = false;
        status.innerHTML = '<span style="color:var(--red)">❌ 网络错误，上传中断</span>';
        retry.style.display = 'inline-block';
      };
      xhr.send(fd);
    }

    input.addEventListener('change', function(){
      if(input.files && input.files[0]){
        lastFile = input.files[0];
        var err = validate(lastFile);
        status.innerHTML = err
          ? '<span style="color:var(--red)">❌ ' + __qaEsc(err) + '</span>'
          : '已选择：' + __qaEsc(lastFile.name) + '（' + fmtSize(lastFile.size) + '）';
        preview.innerHTML = '';
        barfill.style.width = '0%';
        retry.style.display = 'none';
        if(!err) upload();
        input.value = '';
      }
    });
    retry.addEventListener('click', upload);

    return zone;
  }

  wrap.appendChild(makeUploader('img'));
  wrap.appendChild(makeUploader('doc'));
  box.appendChild(wrap);
  return { resize:function(){} };
};

var WC_NOISE = false;
var LAYER_SUB = {
  article:'颜色越深声量越高　·　悬停查看省份值与占比',
  comment:'评论侧已归属率 95.2%，高于微博侧 66.4%',
  basin:'蓝 = 长江 12 省　·　橙 = 黄河 8 省　·　灰 = 非流域（与声量蓝明确区分）'
};
function makeTools(spec){
  /* spec.tools 支持逗号并列：'layer' / 'pal' / 'noise'，如 'layer,pal' */
  var wrap = el('div','toolbar'), b, seg;
  String(spec.tools||'').split(',').forEach(function(t){
    t = t.replace(/^\s+|\s+$/g,'');
    if(t === 'layer'){
      seg = el('div','seg tools');
      (spec.modes || [['article','微博作者'],['comment','评论作者'],['basin','流域着色']])
        .forEach(function(m,i){
          b = el('button', i===0?'on':'', m[1]); b.dataset.m = m[0]; seg.appendChild(b); });
      wrap.appendChild(seg);
    } else if(t === 'pal'){
      seg = el('div','seg tools pal');
      MAP_PAL_NAMES.forEach(function(m,i){
        b = el('button', i===0?'on':'', m[1]); b.dataset.pal = m[0]; seg.appendChild(b); });
      wrap.appendChild(seg);
    } else if(t === 'noise'){
      seg = el('div','seg tools');
      b = el('button', WC_NOISE?'on':'', WC_NOISE?'隐藏噪声词':'显示噪声词');
      b.dataset.a = 'noise'; seg.appendChild(b); wrap.appendChild(seg);
    }
  });
  return wrap;
}
function rerenderCard(card){
  Array.prototype.forEach.call(card.querySelectorAll('.ch'), function(box){
    var sp = JSON.parse(box.dataset.spec);
    var inst = echarts.getInstanceByDom(box);
    if(inst) inst.dispose();          /* 必须先 dispose，否则 ECharts 会在同一 DOM 上叠实例 */
    try{ charts[sp.id] = R[sp.r](box, sp); }
    catch(e){ box.innerHTML = '<div class="note bad">'+e.message+'</div>'; }
  });
}
function bindLayer(seg, b){
  var card = seg.closest('.card');
  Array.prototype.forEach.call(seg.children, function(x){ x.classList.toggle('on', x===b); });
  Array.prototype.forEach.call(card.querySelectorAll('.ch'), function(box){
    var sp = JSON.parse(box.dataset.spec);
    sp.o = sp.o || {};
    if(b.dataset.m === 'basin'){ sp.o.basin = true; }
    else { sp.o.basin = false; sp.o.side = b.dataset.m; }
    box.dataset.spec = JSON.stringify(sp);
  });
  rerenderCard(card);
  var sub = card.querySelector('.sub');
  if(sub) sub.textContent = LAYER_SUB[b.dataset.m] || sub.textContent;
}
function bindPal(seg, b){
  var card = seg.closest('.card');
  Array.prototype.forEach.call(seg.children, function(x){ x.classList.toggle('on', x===b); });
  Array.prototype.forEach.call(card.querySelectorAll('.ch'), function(box){
    var sp = JSON.parse(box.dataset.spec);
    sp.o = sp.o || {};
    sp.o.pal = b.dataset.pal;
    box.dataset.spec = JSON.stringify(sp);
  });
  rerenderCard(card);
}
function bindNoise(b){
  WC_NOISE = !WC_NOISE;
  b.textContent = WC_NOISE ? '隐藏噪声词' : '显示噪声词';
  b.classList.toggle('on', WC_NOISE);
  Array.prototype.forEach.call(document.querySelectorAll('[data-recipe="wordcloud"]'), function(box){
    var sp = JSON.parse(box.dataset.spec);
    try{ charts[sp.id] = R.wordcloud(box, sp); }catch(e){}
  });
}
function compositeDark(cv){
  /* 无 ECharts 实例的图（词云 canvas）导出时补深色底，避免透明 PNG 看不清 */
  var t = document.createElement('canvas');
  t.width = cv.width; t.height = cv.height;
  var x = t.getContext('2d');
  x.fillStyle = '#f7f2e8'; x.fillRect(0,0,t.width,t.height);
  x.drawImage(cv, 0, 0);
  return t.toDataURL('image/png');
}
function makeExport(spec){
  var b = el('button','exp','PNG');
  b.title = '导出该图 PNG（2× 分辨率，含深色底）';
  b.onclick = function(){
    var card = b.closest('.card'), box = card? card.querySelector('.ch') : null;
    if(!box) return;
    var inst = echarts.getInstanceByDom(box), url = null;
    /* 复合渲染器（一张卡片内多张子图，如首页「济南区位」三图）：容器上没有 ECharts 实例，
       改从登记表取——它的 getDataURL 会把三张子图拼成「上一下二」一张图。 */
    if(!inst && charts[spec.id] && charts[spec.id].getDataURL){ inst = charts[spec.id]; }
    if(inst){ url = inst.getDataURL({pixelRatio:2, backgroundColor:'#f7f2e8'}); }
    else { var cv = box.querySelector('canvas'); if(cv) url = compositeDark(cv); }
    if(!url) return;
    var a = el('a'); a.href = url; a.download = (spec.id||'chart')+'.png'; a.click();
  };
  return b;
}

function renderTable(spec){
  var rows = spec.d||[];
  var t = el('div', cardCls(spec));
  t.appendChild(el('h3',null,spec.t));
  if(spec.s) t.appendChild(el('div','sub',spec.s));
  var w = el('div','tblwrap');
  var tb = el('table');
  var th = el('tr');
  spec.cols.forEach(function(c){
    /* 表头必须带与单元格同一套对齐类：漏掉 num 会出现「表头左对齐、数值右对齐」的错位 */
    th.appendChild(el('th', (c.num?'num ':'')+(c.nw?'nw':''), c.l)); });
  tb.appendChild(el('thead')).appendChild(th);
  var bod = el('tbody');
  rows.forEach(function(r){
    var tr = el('tr');
    if(spec.rowClsKey && r[spec.rowClsKey]) tr.className = r[spec.rowClsKey];
    spec.cols.forEach(function(c){
      var v = c.f? c.f(r) : r[c.k];
      var cls = (c.num?'num ':'')+(c.nw?'nw':'');
      /* 状态列色彩标签：c.tag = {'通过':'g','待修':'a'} */
      if(c.tag && c.tag[v]) cls += ' cell ' + c.tag[v];
      tr.appendChild(el('td', cls, v==null?'-':String(v)));
    });
    bod.appendChild(tr);
  });
  tb.appendChild(bod); w.appendChild(tb); t.appendChild(w);
  if(spec.note) t.appendChild(el('div','sub','注：'+spec.note));
  /* 单元格级 CSV 导出 */
  var cb = el('button','exp','CSV');
  cb.title = '导出该表 CSV（UTF-8 BOM，Excel 可直接打开）';
  cb.onclick = function(){
    var cols = spec.cols.filter(function(c){ return !c.hide; });
    var lines = [cols.map(function(c){ return c.l; }).join(',')];
    rows.forEach(function(r){
      lines.push(cols.map(function(c){
        var v = c.f? c.f(r) : r[c.k];
        if(v==null) v = '';
        v = String(v);
        return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v;
      }).join(','));
    });
    var blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
    var a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = (spec.id || spec.t || 'table').replace(/[\\/:*?"<>|]/g,'_') + '.csv';
    a.click();
  };
  t.appendChild(cb);
  return t;
}
/* ---- 排行榜诊断图（2026-10-06 新增，可选）----
   spec.figs = [{type, title, sub, note, ...}]，由 Python 侧算好后传进来。
   本函数只负责**摆放与说明文案**，具体绘制全部复用既有的 R.* 渲染器
   （散点 R.scatter / 横条 R.hbar），不引入新的图表实现。 */
function renderListFigures(spec){
  var figs = spec.figs||[];
  if(!figs.length) return null;
  var wrap = el('div','figsbox');
  var n = 0;
  figs.forEach(function(f){
    var blk = el('div','figblk');
    var t = el('div','figt', esc2(f.title));
    if(f.sub) t.appendChild(el('span','figsub', f.sub));
    blk.appendChild(t);
    /* 图形描述放 data-fig，与 .ch 的 data-spec 同一套路：
       外层分帧渲染时读它、幂等（data-done）、失败可降级。
       ⚠ 不能在这里 init ECharts —— 卡片还没进文档树，容器宽高为 0。 */
    var slot = el('div', f.type==='scatter' ? 'figslot' : 'figrows');
    slot.setAttribute('data-fig', JSON.stringify(f));
    slot.dataset.k = 'f' + (n++);
    blk.appendChild(slot);
    if(f.legend && f.legend.length){
      var lg = el('div','figlg');
      f.legend.forEach(function(g){
        var s = el('span','fl');
        var ic = el('i'); ic.style.background = g.color; s.appendChild(ic);
        s.appendChild(el('span',null, g.label));
        lg.appendChild(s);
      });
      blk.appendChild(lg);
    }
    if(f.note) blk.appendChild(el('div','fignote', f.note));
    wrap.appendChild(blk);
  });
  return wrap;
}
function esc2(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderList(spec){
  var items = spec.d||[];
  var t = el('div', cardCls(spec));
  t.appendChild(el('h3',null,spec.t));
  if(spec.s) t.appendChild(el('div','sub',spec.s));
  /* spec.explain 可选：{0:{what,sig,read}, 3:{...}}，键为条目下标。
     诊断图 spec.figs 可选：{type,title,sub,svg|rows}。
     两者都不传时本函数行为与从前完全一致（仓库内另外 4 处 list 卡零影响）。 */
  var ex = spec.explain || null;
  var ul = el('ul', 'ev' + (ex ? ' ex' : ''));
  items.forEach(function(r, ri){
    var li = el('li');
    var m = el('div','m');
    (spec.meta||[]).forEach(function(mk){
      var v = mk.f? mk.f(r) : r[mk.k];
      if(v!=null && v!=='') m.appendChild(el('span', mk.cls||null, v));
    });
    li.appendChild(m);
    li.appendChild(el('div','t', (spec.body && r[spec.body]!=null)? r[spec.body]
                                            : (r.text||'')));
    /* 三段式：是什么（客观转述）/ 反映什么（可判断，须落在可核证据上）/ 读法。
       缺哪段就不渲染哪段 —— 写不出就不写，不留占位框。 */
    var e = ex ? ex[ri] : null;
    if(e){
      li.className = 'ex-on';
      var box = el('div','exbox');
      [['what','是什么',''],['sig','反映什么',''],['read','读法',' exread']].forEach(function(seg){
        if(!e[seg[0]]) return;
        var d = el('div', seg[2]);
        d.appendChild(el('i', null, seg[1]));
        /* 文案里已用 <b> 标出要强调的片段，先整体转义再放行 b —— 其余标签一律转义掉 */
        d.appendChild(el('p', null, richText(e[seg[0]])));
        box.appendChild(d);
      });
      li.appendChild(box);
    }
    ul.appendChild(li);
  });
  t.appendChild(ul);
  /* 诊断图：紧接副标题、排在条目列表**之前**。
     理由：图回答"这批内容整体是什么形态"，条目解释回答"这一条为什么这样"——
     先看结构再逐条，读者不会把单条的异常当成全局结论。

     ⚠ 这里**只建占位与文案，绝不在此处 init ECharts**：
     卡片尚未挂进文档树，容器宽高都是 0，init 会得到空画布。
     真正的绘制交给外层的分帧渲染（与 .ch 图表同一套机制），
     见 figsDraw() —— 它复用 draw() 的"视口内先画 + 其余按帧补"策略。

     ⚠ renderListFigures 返回的是**节点本身**（不是 {node,jobs}）。
     早前按旧结构写 insertBefore(fr.node, ul) → fr.node 为 undefined，
     insertBefore 抛 TypeError → 整个 buildView 中断 → 卡片区全空白。 */
  var fr = renderListFigures(spec);
  if(fr) t.insertBefore(fr, ul);
  return t;
}
/* 诊断图的绘制入口：由外层渲染流程在卡片入文档后调用（见 renderView 末尾）。
   figSlot 必须带 data-fig（图形描述的 JSON），与 .ch 的 data-spec 同一套路，
   这样分帧、幂等、失败降级都能复用现成逻辑。 */
function figsDraw(root){
  /* ⚠ 选择器必须同时含 .figslot（散点）与 .figrows（横条）。
     早前只写 '.figslot[data-fig]'，结果横条图永远查不到、slots 为空直接 return
     —— 表现为「散点正常、横条全空白」，且无任何报错。 */
  var slots = Array.prototype.slice.call(
    (root||document).querySelectorAll('.figslot[data-fig], .figrows[data-fig]'));
  if(!slots.length) return 0;
  function draw(b){
    if(!b || b.dataset.done) return;
    b.dataset.done = '1';
    var f;
    try{ f = JSON.parse(b.dataset.fig); }catch(e){ return; }
    try{
      if(f.type === 'scatter'){
        charts['fig_' + (f.k||Math.random().toString(36).slice(2,7))] =
          R.scatter(b, {d: f.d, o: {xn: f.xn||'', yn: f.yn||''}});
      }else if(f.type === 'hbar'){
        charts['fig_' + (f.k||Math.random().toString(36).slice(2,7))] =
          R.hbar(b, {d: f.d, o: {n: (f.d||[]).length, p: f.p||0}});
      }
    }catch(e){
      b.innerHTML = '<div class="note bad">诊断图渲染失败：'+e.message+'</div>';
      window.__err = (window.__err||'')+' fig:'+e.message;
    }
  }
  /* 一次性同步画完。
     ⚠ 早前沿用 .ch 图表那套"视口内先画 + 其余 requestAnimationFrame 按帧补"，
     结果视口外的横条图永远画不出来：无头环境里 requestAnimationFrame 配合
     --virtual-time-budget 不推进，rest 队列停在半路（实测横条 done 一直为空）。
     .ch 图是几十张、必须分帧；诊断图每卡 ≤4 张、每张 ≤15 个点，
     同步成本可忽略，**不为省 14ms 而换来"图不出现"**。 */
  slots.forEach(draw);
  /* 视口切换（hash 跳转 / 折叠展开）后容器尺寸才最终确定，用 IO 再兜一次 */
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting && !e.target.dataset.done){ draw(e.target); io.unobserve(e.target); }
      });
    }, {rootMargin:'500px 0px'});
    slots.forEach(function(b){ if(!b.dataset.done) io.observe(b); });
  }
  return slots.length;
}
function renderKV(spec){
  var t = el('div', cardCls(spec));
  t.appendChild(el('h3',null,spec.t));
  if(spec.s) t.appendChild(el('div','sub',spec.s));
  /* 值分两种：数字 → 进度条 + 右对齐数字；文字（「陕西 20」「12 / 8」「1.38 : 1」）
     → 不画条、右侧显示原文。旧实现无条件按数字算，文字值宽度成 NaN、值被 raw() 打成「-」。 */
  function num(v){
    if(typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v == null ? '' : v).trim();
    if(!s) return null;
    /* 千分位容错：Python 侧 N() 产出 "1,234"，带逗号直接 +s 会变 NaN →
       该行被误判成"文字值"、进度条消失。这里先剥掉分隔符再判数值。 */
    var t = s.replace(/[,\s]/g, '');
    return isFinite(+t) ? +t : null;
  }
  var mx = Math.max.apply(null, (spec.d||[]).map(function(z){ return num(z.v); })
                                        .filter(function(x){ return x !== null; })
                                        .concat([1]));
  var ramp = barRamp((spec.d||[]).length, 0);     /* 逐行一色，色相按行数等分 */
  (spec.d||[]).forEach(function(z, i){
    var b = el('div','bar'), n = num(z.v);
    b.appendChild(el('div','lb', z.k));
    var tr = el('div', n === null ? 'tr textonly' : 'tr'); var fl = el('div','fl');
    if(n !== null) fl.style.width = Math.max(2, n/mx*100)+'%';
    /* v13：逐条取色 —— 显式给了颜色就用它，否则按行号取本图色带（同一图内每条一色） */
    fl.style.background = z.c || ramp[i];
    tr.appendChild(fl); b.appendChild(tr);
    /* 顺序：条 → 主值 → 补充值（如占比）。主值在前才读得顺 */
    b.appendChild(el('div', n === null ? 'nv text' : 'nv',
                     n === null ? String(z.v == null ? '' : z.v) : rsp(z.v, spec.unit)));
    if(z.s != null && z.s !== '') b.appendChild(el('div','sv', String(z.s)));
    t.appendChild(b);
  });
  if(spec.note) t.appendChild(el('div','sub','注：'+spec.note));
  return t;
}
function rsp(v,u){ return (u==='%'? (+v).toFixed(1)+'%' : raw(v)); }
function renderText(spec){
  var t = el('div', cardCls(spec));
  t.appendChild(el('h3',null,spec.t));
  if(spec.s) t.appendChild(el('div','sub',spec.s));
  t.appendChild(el('div',null,spec.html));
  return t;
}
function renderNote(spec){
  var w = el('div', cardCls(spec));
  var box = el('div','notes');
  (spec.items||[]).forEach(function(it){
    box.appendChild(el('div','note '+(it.k||''), (it.t?'<b>'+it.t+'</b> ':'')+it.x));
  });
  w.appendChild(box);
  return w;
}

/* ---------------- 高度自适应 ----------------
   以 1440px 视口为基准：视口越宽，卡片越宽，图表按同一系数等比变高，
   避免超宽屏上图表被压成"扁条 + 大片留白"。系数全局统一 → 列间等高关系不变。 */
function heightK(){
  /* ≤1560px 保持原尺寸（与已确认的版式一致）；再宽才等比放大，上限 1.3× */
  var w = window.innerWidth;
  if(w <= 1560) return 1;
  return Math.min(1.3, 1 + (w - 1560) / 2400);
}
function applyHeights(scope){
  var m = scope || document.getElementById('main'), k = heightK();
  Array.prototype.forEach.call(m.querySelectorAll('.ch'), function(box){
    var h0 = box.dataset.h0;
    if(h0 == null){ h0 = box.style.height; if(!h0) return; box.dataset.h0 = h0; }
    box.style.height = Math.round(parseFloat(h0) * k) + 'px';
  });
}

/* ---------------- 栅格末行自动补齐 ----------------
   起因：卡片宽 1/2/3 列混排时，只要「单元数 ÷ 列数」除不尽就必然留下半行空位。
   例：情感分析 9 格在 2 列下 → 末行只剩「新旧口径覆盖对照」1 张，右侧空一整列。
   做法：先清掉上一轮写入的 inline span（回到 class 定义的宽度）→ 量出每行实际占列数
   → 把剩余列补给该行最后一张卡，并让它内部的图重算画布尺寸。
   全部用几何量取，与断点/视口无关，所以 1/2/3 列下都成立。 */
function fillRows(reset){
  var g = document.querySelector('#main .grid');
  if(!g || !g.children.length) return 0;
  var tpl = getComputedStyle(g).gridTemplateColumns;
  var cols = (tpl && tpl !== 'none') ? tpl.trim().split(/\s+/).length : 1;
  if(cols < 2) return 0;                       /* 单列无需补齐 */
  var cards = Array.prototype.slice.call(g.children);
  if(reset){ cards.forEach(function(c){ c.style.gridColumn = ''; }); }
  void g.offsetWidth;                          /* 强制重排，否则量到的是旧布局 */
  var gap = parseFloat(getComputedStyle(g).columnGap) || 0;
  var colw = (g.clientWidth - gap * (cols - 1)) / cols;
  if(colw <= 0) return 0;
  /* ⚠ 必须按几何位置归行，不能按 DOM 顺序读 offsetTop：
     grid-auto-flow:dense 会把后面的卡回填到前面的空位，DOM 顺序 ≠ 视觉顺序，
     按 DOM 顺序归行会把「已被回填填满的行」误判成有空位（实测把两张 1 列卡误撑成 2 列）。 */
  var gx = g.getBoundingClientRect().left;
  var list = cards.map(function(c){
    var r = c.getBoundingClientRect();
    return {c:c, l:Math.round(r.left - gx), t:Math.round(r.top), w:Math.round(r.width)};
  });
  var tops = [];
  list.forEach(function(z){ if(tops.indexOf(z.t) < 0) tops.push(z.t); });
  tops.sort(function(a,b){ return a - b; });
  var rows = [], last = null;
  tops.forEach(function(t){
    if(last === null || t - last > 4){ rows.push([]); last = t; }
    list.forEach(function(z){ if(z.t === t) rows[rows.length-1].push(z); });
  });
  var fixed = 0;
  rows.forEach(function(r){
    var maxRight = 0, rightMost = null;
    r.forEach(function(z){ if(z.l + z.w > maxRight){ maxRight = z.l + z.w; rightMost = z; } });
    if(!rightMost) return;
    /* 该行最右边界占了 need 列（+gap 是为了避开亚像素误差） */
    var need = Math.max(1, Math.ceil((maxRight + gap) / (colw + gap) - 0.02));
    if(need >= cols) return;
    var cur = Math.max(1, Math.round((rightMost.w + gap) / (colw + gap)));
    var span = Math.min(cols, cur + (cols - need));
    if(span === cur) return;
    rightMost.c.style.gridColumn = 'span ' + span;
    fixed++;
    Array.prototype.forEach.call(rightMost.c.querySelectorAll('.ch'), function(box){
      var inst = echarts.getInstanceByDom(box);
      if(inst) inst.resize();
    });
  });
  return fixed;
}
function fillRowsPasses(){ fillRows(true); fillRows(false); }

/* ---------------- 视图构建 ---------------- */
function buildView(v){
  var m = document.getElementById('main');
  m.innerHTML = '';
  m.appendChild(el('h2','vtitle', v.name + (v.badge? ' <span class="tag '+(v.badgeCls||'b')+'">'+v.badge+'</span>':'')));
  m.appendChild(el('p','lead', v.lead||''));

  if(v.kpis && v.kpis.length){
    var kg = el('div','kpis');
    v.kpis.forEach(function(k,i){
      var d = el('div','kpi c'+(k.c||(i%6+1)));
      d.appendChild(el('div','k',k.k));
      d.appendChild(el('div','v',k.v));
      if(k.s) d.appendChild(el('div','s',k.s));
      kg.appendChild(d);
    });
    m.appendChild(kg);
  }
  if(v.btns && v.btns.length){
    var bg = el('div','btns');
    v.btns.forEach(function(b){
      var bt = el('button',null,b.t);
      bt.onclick = function(){
        var payload = (b.d === '__all__')? U : (get(b.d)!=null? get(b.d) : U);
        var txt = b.csv? toCSV(payload) : JSON.stringify(payload,null,1);
        var blob = new Blob(['\ufeff'+txt], {type:'text/plain;charset=utf-8'});
        var a = el('a'); a.href = URL.createObjectURL(blob); a.download = b.f; a.click();
      };
      bg.appendChild(bt);
    });
    m.appendChild(bg);
  }
  var g = el('div','grid');
  (v.cards||[]).forEach(function(spec){
    if(spec.kind === 'table'){ g.appendChild(renderTable(spec)); return; }
    if(spec.kind === 'list'){ g.appendChild(renderList(spec)); return; }
    if(spec.kind === 'kv'){ g.appendChild(renderKV(spec)); return; }
    if(spec.kind === 'text'){ g.appendChild(renderText(spec)); return; }
    var card = el('div', cardCls(spec));
    if(spec.tools){
      var hd = el('div','chd');
      hd.appendChild(el('h3',null,spec.t));
      hd.appendChild(makeTools(spec));
      card.appendChild(hd);
    } else {
      card.appendChild(el('h3',null,spec.t));
    }
    if(spec.s) card.appendChild(el('div','sub',spec.s));
    if(spec.stack){
      /* 复合卡：一列内竖排多个图（如 1 主图 + 2 副图对齐高度） */
      spec.stack.forEach(function(sub,i){
        var si = el('div','stackitem');
        if(sub.t) si.appendChild(el('h4',null,sub.t));
        if(sub.s) si.appendChild(el('div','sub',sub.s));
        var ssp = {id:spec.id+'_'+i, t:sub.t, s:sub.s, r:sub.r, d:sub.d, o:sub.o||{}};
        var sbx = el('div','ch');
        sbx.style.height = (sub.h||200)+'px';
        sbx.dataset.cid = ssp.id;
        sbx.dataset.recipe = ssp.r;
        sbx.dataset.spec = JSON.stringify(ssp);
        si.appendChild(sbx);
        card.appendChild(si);
      });
    } else {
      var box = el('div','ch'+(spec.cls?' '+spec.cls:''));
      if(spec.h) box.style.height = spec.h+'px';
      box.dataset.cid = spec.id;
      box.dataset.recipe = spec.r;
      box.dataset.spec = JSON.stringify(spec);
      card.appendChild(box);
      if(spec.r !== 'chat' && !spec.noexp) card.appendChild(makeExport(spec));
    }
    if(spec.ruler) card.appendChild(el('div','ruler'));
    g.appendChild(card);
  });
  m.appendChild(g);
  if(v.notes && v.notes.length){
    var n = el('div','notes');
    v.notes.forEach(function(it){
      n.appendChild(el('div','note '+(it.k||''), (it.t?'<b>'+it.t+'</b> ':'')+it.x));
    });
    m.appendChild(n);
  }
  m.appendChild(el('div','foot','数据快照：'+U.generated+
    '　·　口径统一由 unified_data.json 提供，页面内所有数字与图表同源；'+
    '标注 <span class="tag g">真实</span> 为库/文件实测，<span class="tag p">演示</span> 为界面原型。'));
  m.scrollTop = 0;
  window.scrollTo(0,0);

  /* ---- 先定高度系数，再渲染（否则图表按旧尺寸初始化）---- */
  applyHeights(m);
  /* ---- 末行补齐：宽度定了再画图，避免图先按窄宽度初始化 ---- */
  fillRowsPasses();

  /* ---- 图表渲染：先画视口内的，其余按帧补齐；window.__flush() 强制全画 ---- */
  var boxes = Array.prototype.slice.call(m.querySelectorAll('.ch'));
  function draw(box){
    if(!box || box.dataset.done) return;      /* 幂等：重复调用不会叠加实例 */
    box.dataset.done = '1';
    var spec;
    try{ spec = JSON.parse(box.dataset.spec); }catch(e){ return; }
    var r = R[spec.r];
    if(!r) return;
    try{
      charts[spec.id] = r(box, spec);
    }catch(e){
      box.innerHTML = '<div class="note bad">图表渲染失败：'+e.message+'</div>';
      window.__err = (window.__err||'')+' '+spec.id+':'+e.message;
    }
  }
  window.__flush = function(){ boxes.forEach(draw); };
  /* 诊断图（排行榜卡内的散点 / 横条）走同一套分帧策略。
     必须放在卡片入文档之后调用 —— ECharts 需要有尺寸的容器。 */
  figsDraw(m);
  var vh = window.innerHeight || 900, near = [], rest = [];
  boxes.forEach(function(b){
    (b.getBoundingClientRect().top < vh * 1.5 ? near : rest).push(b);
  });
  near.forEach(draw);
  var qi = 0;
  (function step(){
    var t0 = Date.now();
    while(qi < rest.length && Date.now() - t0 < 14) draw(rest[qi++]);
    if(qi < rest.length) requestAnimationFrame(step);
  })();
  /* 保险丝：滚到未渲染的图表时补画（兜住分帧被中断的情况） */
  if('IntersectionObserver' in window && rest.length){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ draw(e.target); io.unobserve(e.target); } });
    }, {rootMargin:'700px 0px'});
    rest.forEach(function(b){ io.observe(b); });
  }
  /* 卡片级控件事件 */
  Array.prototype.forEach.call(m.querySelectorAll('.seg.tools'), function(seg){
    seg.addEventListener('click', function(e){
      var b = e.target.closest('button');
      if(!b) return;
      if(b.dataset.m !== undefined) bindLayer(seg, b);
      else if(b.dataset.pal !== undefined) bindPal(seg, b);
      else if(b.dataset.a === 'noise') bindNoise(b);
    });
  });
}
function toCSV(rows){
  if(!rows || !rows.length) return '';
  if(!Array.isArray(rows)) rows = [rows];
  var keys = {};
  rows.forEach(function(r){ if(r && typeof r==='object') Object.keys(r).forEach(function(k){keys[k]=1;}); });
  var ks = Object.keys(keys);
  if(!ks.length) return rows.join('\n');
  return ks.join(',') + '\n' + rows.map(function(r){
    return ks.map(function(k){
      var v = r[k];
      if(v==null) return '';
      v = typeof v==='object'? JSON.stringify(v) : String(v);
      return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v;
    }).join(',');
  }).join('\n');
}

/* ---------------- 导航 ---------------- */
(function(){
  document.getElementById('gen').textContent = U.generated;
  var list = document.getElementById('sideList'), secsEl = document.getElementById('secs');
  var lastG = null, map = {}, gbox = {}, git = {}, curSec = null, secFirst = {};
  /* ---------- 黄河流域专题导航 ----------
     只保留黄河流域模块；其它专题模块不进入侧栏。 */
  var SECS = [
    {id:'hh', name:'黄河流域舆情', full:'黄河流域舆情分析 · 生态治理 / 文旅 / 医患矛盾'}
  ];
  function secOf(v){ return v.sec || SECS[0].id; }
  VIEWS.forEach(function(v){
    map[v.id] = v;
    var s = secOf(v);
    if(!secFirst[s]) secFirst[s] = v.id;
  });
  SECS.forEach(function(s){
    var b = el('b', null, s.name);
    b.title = s.full;
    b.dataset.sec = s.id;
    var n = VIEWS.filter(function(v){ return secOf(v) === s.id; }).length;
    b.appendChild(el('span','n', n + ' 项'));
    b.onclick = function(){ switchSec(s.id); };
    secsEl.appendChild(b);
  });
  function markSec(sec){
    Array.prototype.forEach.call(secsEl.children, function(b){
      b.classList.toggle('on', b.dataset.sec === sec);
    });
  }
  /* 按当前段重建侧栏列表（分组：可折叠 + 组内计数） */
  function buildList(sec){
    list.innerHTML = ''; lastG = null; gbox = {}; git = {};
    VIEWS.filter(function(v){ return secOf(v) === sec; }).forEach(function(v){
      if(v.group !== lastG){
        var head = el('div','grp');
        head.appendChild(el('i','arw','▾'));
        head.appendChild(el('span',null,v.group));
        var box = el('div','gitems');
        gbox[v.group] = box;
        head.onclick = function(){
          var c = box.classList.toggle('collapsed');
          head.classList.toggle('collapsed', c);
        };
        list.appendChild(head); list.appendChild(box);
        git[v.group] = head;
        lastG = v.group;
      }
      var it = el('div','it');
      it.appendChild(el('i','d'));
      it.appendChild(el('span',null, v.short || v.name));
      if(v.badge) it.appendChild(el('span','bd '+(v.badgeCls||''), v.badge));
      it.dataset.id = v.id;
      it.onclick = function(){ location.hash = v.id; };
      gbox[v.group].appendChild(it);
    });
    Object.keys(gbox).forEach(function(g){
      var n = gbox[g].children.length;
      git[g].appendChild(el('span','cnt', String(n)));
    });
  }
  function switchSec(sec){
    if(!secFirst[sec]) sec = SECS[0].id;
    curSec = sec; markSec(sec); buildList(sec);
    var t = secFirst[sec];
    if(location.hash === '#' + t) go(); else location.hash = t;
  }
  function go(){
    var id = (location.hash||'').replace('#','');
    if(!map[id]) id = VIEWS[0].id;
    /* hash 指向的视图属于另一段时，同步切换侧栏列表 */
    var sec = secOf(map[id]);
    if(sec !== curSec){ curSec = sec; markSec(sec); buildList(sec); }
    var cur = null;
    Array.prototype.forEach.call(list.querySelectorAll('.it'), function(x){
      var on = (x.dataset.id === id);
      x.classList.toggle('on', on);
      if(on) cur = x;
    });
    /* 当前项所属分组自动展开并滚动可见 */
    if(cur){
      var bx = cur.parentNode;
      if(bx && bx.classList.contains('gitems') && bx.classList.contains('collapsed')){
        bx.classList.remove('collapsed');
        if(bx.previousSibling) bx.previousSibling.classList.remove('collapsed');
      }
      if(cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
    }
    var v = map[id];
    buildView(v); built[id] = 1;
    if(v.after) v.after();
  }
  window.addEventListener('hashchange', go);
  var _lastK = heightK(), _rszT = null;
  window.addEventListener('resize', function(){
    if(_rszT) clearTimeout(_rszT);
    _rszT = setTimeout(function(){
      _rszT = null;
      applyHeights(); _lastK = heightK();
      fillRowsPasses();
      Object.keys(charts).forEach(function(kk){
        var c = charts[kk]; if(!c || !c.resize) return;
        c.resize();
        /* 依赖容器像素尺寸的渲染器（气泡堆积）需要重排坐标；普通实例没有该钩子 */
        if(c.__relayout) c.__relayout();
      });
    }, 120);
  });
  /* 顶栏：全部渲染 / 打印 */
  var bDraw = document.getElementById('btnDraw'), bPrint = document.getElementById('btnPrint');
  if(bDraw) bDraw.onclick = function(){
    if(window.__flush) window.__flush();
    Object.keys(charts).forEach(function(k){
      var c = charts[k]; if(!c || !c.resize) return;
      c.resize(); if(c.__relayout) c.__relayout();
    });
  };
  if(bPrint) bPrint.onclick = function(){ window.print(); };
  go();
  window.__views = map;
})();
</script>

<!-- 动态采集：一键「更新数据」。仅 http(s) 访问时显示 —— file:// 打开离线包时
     两个接口都不存在，脚本会探不到后端，按钮保持隐藏，离线演示不受影响。 -->
<script>
(function(){
  if(!/^https?:/i.test(location.protocol)) return;
  var btn = document.getElementById('btnData'), chip = document.getElementById('chipData'),
      lastEl = document.getElementById('lastCrawl');
  if(!btn) return;
  var S = '/page/api/data/refresh/status', GO = '/page/api/data/refresh';
  var timer = null, justStarted = false;
  function busy(b, txt){
    btn.disabled = b;
    btn.textContent = txt || (b ? '采集中…' : '更新数据');
  }
  function chipTxt(last){
    var t = last && last.written_at ? String(last.written_at).replace('T',' ').slice(0,16) : '—';
    var a = last && last.added_total != null ? last.added_total : '—';
    lastEl.textContent = t + ' · 新增 ' + a + ' 条';
  }
  function stopPoll(){ if(timer){ clearInterval(timer); timer = null; } }
  function poll(){
    fetch(S, {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(j){
      if(!j || j.status !== 'ok') return;
      if(!j.enabled){ btn.style.display = 'none'; chip.style.display = 'none'; stopPoll(); return; }
      if(j.running){
        busy(true);
        if(!timer) timer = setInterval(poll, 5000);
        return;
      }
      stopPoll();
      chipTxt(j.last);
      btn.style.display = '';
      chip.style.display = '';          // ← 修正前漏了这行：chip 永远 display:none
      if(justStarted){
        justStarted = false;
        busy(false, '已更新，正在载入新数据…');
        setTimeout(function(){ location.reload(); }, 900);   // 重载后即拿到重建后的新 HTML
        return;
      }
      busy(false);
      if(j.last && j.last.chain && j.last.chain.ok === false)
        btn.title = '上次重建失败：' + String(j.last.chain.msg || '').slice(0, 120);
    }).catch(function(){ /* 后端不在（file:// / 旧版本）→ 维持原状，不打扰 */ });
  }
  btn.onclick = function(){
    if(btn.disabled) return;
    busy(true, '触发中…');
    fetch(GO, {method:'POST', credentials:'same-origin'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.status === 'disabled'){ busy(false, '已停用'); btn.disabled = true; return; }
        justStarted = true;
        poll();
      })
      .catch(function(){ busy(false, '触发失败'); });
  };
  poll();
})();
</script>
